<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>语文知识馆 · 统编版五年级上册 | 全八单元（2026新版）</title>
<style>
:root{
  --bg:#FFF8EF; --card:#FFFFFF; --ink:#3A3226; --muted:#8A7F6E;
  --teal:#0F9E8C; --teal-l:#DFF6F2;
  --red:#D9534F; --red-l:#FCE9E8;
  --orange:#E8890C; --orange-l:#FDF0DC;
  --green:#4E9F3D; --green-l:#E8F5E3;
  --purple:#7B5EA7; --purple-l:#F0EAF8;
  --blue:#2F80C3; --blue-l:#E3F0FA;
  --gold:#F5B301;
  --radius:16px;
  --shadow:0 4px 14px rgba(58,50,38,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
/* 楷体子集字体(112个生字,20KB)——保证手机/平板上米字格与 PC 一致显示楷体 */
@font-face{font-family:"KBKaiWeb";src:url("fonts/kbkai.woff2") format("woff2");font-display:swap}
html{scroll-behavior:smooth}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--ink);line-height:1.8;font-size:16px}
img{max-width:100%;display:block;border-radius:12px}
button{font-family:inherit;cursor:pointer;border:none;border-radius:12px}

/* 顶栏 */
.topbar{position:sticky;top:0;z-index:50;background:#fff;border-bottom:3px solid var(--gold);padding:10px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.topbar .logo{font-size:20px;font-weight:700}
.topbar .logo .sub{font-size:13px;color:var(--muted);font-weight:400;margin-left:8px}
.topbar .unitbadge{background:#FFF3D6;border-radius:999px;padding:5px 16px;font-size:14px;font-weight:700;color:#8A6400;box-shadow:inset 0 0 0 2px #F5D777}
.topback{flex:0 0 auto;background:var(--bg);border:2px solid var(--ink);border-radius:10px;padding:5px 14px;font-weight:700;font-size:14px;transition:.15s;white-space:nowrap}
.topback:hover{background:var(--ink);color:#fff}
.topback:active{transform:scale(.96)}
@media(max-width:560px){.topbar{padding:8px 12px}.topbar .logo{font-size:17px}.topbar .logo .sub{display:none}.topbar .unitbadge{font-size:12.5px;padding:4px 12px}}
@media(max-width:640px){.topback{padding:4px 10px;font-size:13px}}

/* 通用 */
.wrap{max-width:1000px;margin:0 auto;padding:18px}
.view{display:none;animation:fade .35s}
.view.show{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:16px}
h1,h2,h3{line-height:1.45}

/* 首页 */
.hero{background:linear-gradient(135deg,#7B5EA7,#2F80C3);color:#fff;border-radius:20px;padding:28px 26px;margin-bottom:18px}
.hero h1{font-size:clamp(22px,4vw,32px);margin-bottom:6px}
.hero p{opacity:.95;max-width:680px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}

/* 单元卡 */
.lesson-card{position:relative;background:#fff;border-radius:18px;box-shadow:var(--shadow);overflow:hidden;cursor:pointer;transition:transform .18s,box-shadow .18s;text-align:left;width:100%;display:flex;flex-direction:column}
.lesson-card:hover{transform:translateY(-4px);box-shadow:0 10px 22px rgba(58,50,38,.16)}
.lesson-card .banner{height:120px;display:flex;align-items:center;justify-content:center;font-size:52px;color:#fff;overflow:hidden}
.lesson-card .banner img{width:100%;height:120px;object-fit:cover;border-radius:0}
.lesson-card .body{padding:14px 16px 16px;flex:1}
.lesson-card .unitnum{display:inline-block;padding:3px 13px;border-radius:999px;color:#fff;font-size:13.5px;font-weight:800;letter-spacing:1.5px;margin-bottom:9px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.lesson-card h3{font-size:18px;margin-bottom:4px}
.lesson-card .num{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.55);color:#fff;font-weight:700;border-radius:10px;padding:2px 10px;font-size:14px;z-index:2}
.lesson-card.lr{flex-direction:row;align-items:stretch}
.lesson-card.lr .banner{width:132px;min-width:132px;height:auto;min-height:132px}
.lesson-card.lr .banner img{width:100%;height:100%;object-fit:cover;border-radius:0}
.lesson-card.lr .banner span{font-size:44px}
.lesson-card.lr .body{padding:13px 16px 14px;flex:1;min-width:0}
.lesson-card.lr h3{font-size:16.5px}
.lesson-card.lr .goal{font-size:12px;margin-top:6px}
.lesson-card.lr .more-hint{margin-top:6px;font-size:12.5px}
@media(max-width:480px){.lesson-card.lr .banner{width:106px;min-width:106px}.lesson-card.lr .banner span{font-size:34px}}

.lesson-card p{font-size:14px;color:var(--muted)}
.lesson-card .goal{margin-top:8px;display:inline-block;font-size:13px;font-weight:700;border-radius:8px;padding:2px 10px}
.more-hint{margin-top:8px;font-size:13px;font-weight:700;color:var(--blue);display:block}

/* 方法四招 */
.methods{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:14px}
.method{background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.45);border-radius:14px;padding:12px 16px;color:#fff;cursor:pointer;transition:.18s;text-align:left}
.method:hover{background:rgba(255,255,255,.26)}
.method b{display:block;font-size:16px;margin-bottom:2px}
.method .detail{display:none;font-size:13.5px;line-height:1.7;margin-top:6px;border-top:1px solid rgba(255,255,255,.35);padding-top:6px}
.method.open .detail{display:block;animation:fade .3s}

/* 课程页 */
.backbtn{background:#fff;border:2px solid var(--ink);padding:6px 18px;font-weight:700;font-size:15px;margin-bottom:14px;transition:.15s}
.backbtn:hover{background:var(--ink);color:#fff}
.lesson-head{border-radius:18px;color:#fff;padding:22px 24px;margin-bottom:14px}
.lesson-head h2{font-size:clamp(20px,3.5vw,28px)}
.lesson-head .goal{margin-top:6px;display:inline-block;background:rgba(255,255,255,.22);border-radius:999px;padding:3px 14px;font-size:14px;font-weight:700}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{flex:1;min-width:96px;padding:10px 6px;font-size:16px;font-weight:700;background:#fff;color:var(--muted);border:2px solid #EDE4D3;transition:.15s}
.tabs button.active{color:#fff}
.tabpane{display:none}
.tabpane.show{display:block;animation:fade .3s}
figure.pic{margin-bottom:12px}
figure.pic img{width:100%;max-height:420px;object-fit:cover}

/* 生字米字格 */
.zwrap{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 4px}
.zitem{width:106px;background:#fff;border:1px solid #EDE0C8;border-radius:10px;padding:8px 4px;text-align:center}
.zitem svg{display:block;margin:0 auto}
.zpy{font-weight:700;color:var(--teal);font-size:14px;margin-top:4px}
.zwords{font-size:12px;color:var(--muted);line-height:1.55;margin-top:2px}
@media(max-width:640px){.zitem{width:92px}}
figure.pic figcaption{font-size:13px;color:var(--muted);margin-top:6px}

/* 章节锚点快速导航(吸顶平铺+当前章节高亮) */
.anchorbar{position:sticky;z-index:40;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:rgba(255,248,239,.94);backdrop-filter:blur(8px);border:2px solid #EDE4D3;border-radius:14px;padding:8px 10px;margin-bottom:14px;box-shadow:var(--shadow)}
.anchorbar .chip{flex:0 0 auto;padding:5px 13px;border-radius:999px;background:#fff;border:1.5px solid #E0D3B4;font-size:13.5px;font-weight:700;color:#6B5F4E;cursor:pointer;white-space:nowrap;transition:.15s}
.anchorbar .chip:hover{border-color:var(--ink);color:var(--ink)}
.anchorbar .chip.on{background:var(--red);border-color:var(--red);color:#fff}
.anchorbar .chip.top{border-style:dashed;background:rgba(255,255,255,.7);color:var(--muted)}

.bili-frame{position:relative;width:100%;padding-top:56.25%;border-radius:12px;overflow:hidden;background:#000}
.bili-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vnote{font-size:13.5px;color:var(--muted);margin-top:8px}
.vnote .blink{color:var(--pink);font-weight:700;text-decoration:none}
.vnote .blink:hover{text-decoration:underline}

/* ===== 视频·横屏模式 ===== */
.landlink{cursor:pointer;-webkit-tap-highlight-color:transparent}
.landbtn{display:none;position:absolute;top:12px;right:12px;z-index:12;align-items:center;justify-content:center;
  padding:7px 16px;border-radius:18px;background:rgba(0,0,0,.55);color:#fff!important;font-size:14px;font-weight:700;
  cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.force-land .landbtn,.fs-land .landbtn{display:flex}
html.land-lock,html.land-lock body{overflow:hidden!important;height:100%}
.bili-frame.force-land{position:fixed;z-index:9999;padding-top:0;border-radius:0;background:#000;
  width:100vw;height:100vh;left:0;top:0;transform:none;box-shadow:none}
/* 竖屏视口下旋转90度伪装横屏（iPhone等不支持方向锁的浏览器走这条） */
@media (orientation:portrait){
  .bili-frame.force-land{width:100vh;height:100vw;left:calc((100vw - 100vh)/2);top:calc((100vh - 100vw)/2);
    transform:rotate(90deg)}
}
.bili-frame.fs-land{padding-top:0;border-radius:0;background:#000}
.bili-frame.force-land iframe,.bili-frame.fs-land iframe{border-radius:0}

/* 左右滑动切换课文 */
.swipehint{font-size:12.5px;opacity:.85;margin-top:12px;font-weight:400}
.swipetoast{position:fixed;left:50%;bottom:36px;transform:translateX(-50%) translateY(20px);background:rgba(58,50,38,.88);color:#fff;padding:9px 20px;border-radius:999px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:86vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.swipetoast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 课文切换方向性过渡 */
.lesson-anim-out-l{opacity:0;transform:translateX(-36px);transition:opacity .16s ease,transform .16s ease}
.lesson-anim-out-r{opacity:0;transform:translateX(36px);transition:opacity .16s ease,transform .16s ease}
.lesson-anim-in-l{opacity:0;transform:translateX(-36px)}
.lesson-anim-in-r{opacity:0;transform:translateX(36px)}
.lesson-anim-settle{opacity:1;transform:none;transition:opacity .24s ease,transform .24s ease}
.picsrc{display:inline-block;background:#F1EBDD;border-radius:6px;padding:1px 8px;font-size:12px;color:#7A6F5C}
.kv{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.kv div{flex:1;min-width:200px;background:var(--teal-l);border-radius:12px;padding:10px 14px;font-size:15px}
.kv b{color:var(--teal)}
ul.dotlist{margin:8px 0 8px 22px}
ul.dotlist li{margin-bottom:6px}
.tipbox{border-radius:12px;padding:12px 16px;margin:10px 0;font-size:15px}
.tip{background:var(--orange-l);border-left:5px solid var(--orange)}
.story{background:var(--purple-l);border-left:5px solid var(--purple)}
.fun{background:var(--blue-l);border-left:5px solid var(--blue)}
.exam{background:var(--red-l);border-left:5px solid var(--red)}

/* 翻卡（词语/名言）—— 淡入淡出切换，兼容所有浏览器 */
.flipgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:10px 0}
.flip{height:175px;cursor:pointer}
.flip .inner{position:relative;width:100%;height:100%}
.flip .face{position:absolute;inset:0;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px 18px;font-size:16.5px;line-height:1.8;transition:opacity .35s;overflow:hidden}
.flip .front{background:#fff;border:2px solid #EDE0C8;font-weight:700;color:var(--ink)}
.flip .front small{color:var(--muted);font-weight:400;font-size:12.5px;margin-top:6px}
.flip .back{opacity:0;background:var(--teal);color:#fff;font-size:15.5px}
.flip.on .front{opacity:0}
.flip.on .back{opacity:1}
.flip .back.purple{background:var(--purple)}

/* 考点手风琴 */
.acc{border-radius:12px;background:#fff;box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden}
.acc .head{width:100%;display:flex;align-items:center;gap:10px;padding:13px 16px;font-size:15.5px;font-weight:700;background:none;text-align:left;color:var(--ink)}
.acc .head .idx{flex:none;width:26px;height:26px;border-radius:50%;background:var(--red-l);color:var(--red);display:flex;align-items:center;justify-content:center;font-size:14px}
.acc .head .arrow{margin-left:auto;color:var(--muted);transition:transform .25s}
.acc.open .head .arrow{transform:rotate(90deg)}
.acc .body{display:none;padding:0 16px 14px 52px;font-size:15px;color:#5A5142}
.acc.open .body{display:block;animation:fade .3s}
.acc .body b{color:var(--red)}

/* 速度动态条形图 */
.speedchart{margin:12px 0}
.srow{display:grid;grid-template-columns:130px 1fr;align-items:center;gap:10px;margin-bottom:9px}
.srow .name{font-size:14.5px;font-weight:700;text-align:right}
.srow .track{background:#F3EDDF;border-radius:999px;height:26px;overflow:hidden}
.srow .bar{height:100%;width:0;border-radius:999px;color:#fff;font-size:12.5px;font-weight:700;display:flex;align-items:center;padding-left:12px;white-space:nowrap;transition:width 1.1s cubic-bezier(.2,.7,.3,1)}
.replay{margin-top:8px;background:var(--orange);color:#fff;font-weight:700;padding:8px 20px;font-size:14px}
.replay:hover{background:#C46E08}

/* 地道入口探索 —— 淡入淡出切换 */
.holegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0}
.hole{height:104px;cursor:pointer}
.hole .inner{position:relative;width:100%;height:100%}
.hole .face{position:absolute;inset:0;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px;font-size:15px;font-weight:700;transition:opacity .3s;overflow:hidden}
.hole .front{background:#fff;border:2px solid #D9CBA8}
.hole .back{opacity:0;background:var(--green);color:#fff;font-size:13px;line-height:1.55}
.hole.on .front{opacity:0}
.hole.on .back{opacity:1}

/* 句式对比 */
.senttoggle{display:flex;gap:8px;margin:10px 0}
.senttoggle button{padding:8px 18px;font-weight:700;background:#fff;border:2px solid #E0D3B4;color:var(--muted)}
.senttoggle button.active{background:var(--red);border-color:var(--red);color:#fff}
.sentbox{background:var(--red-l);border-radius:12px;padding:12px 16px;font-size:15px}
.sentbox .lbl{font-weight:700;color:var(--red)}

/* 时间线 */
.timeline{margin:10px 0 10px 6px;border-left:3px solid var(--purple);padding-left:18px}
.timeline .tl{margin-bottom:14px;position:relative}
.timeline .tl::before{content:"";position:absolute;left:-27px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--purple);border:2px solid #fff;box-shadow:0 0 0 2px var(--purple)}
.imgrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:12px 0}

/* 单元速览表 */
.ovtable{width:100%;border-collapse:collapse;font-size:14.5px;margin-top:8px}
.ovtable th,.ovtable td{border:1px solid #EBDFC8;padding:9px 12px;text-align:left;vertical-align:top}
.ovtable th{background:#FBF4E4;font-weight:700}
.ovtable td b{white-space:nowrap}

footer{margin:26px 0 40px;font-size:13px;color:var(--muted)}
footer .src{background:#fff;border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
footer li{margin-bottom:4px;margin-left:18px}

@media(max-width:640px){
  body{font-size:15px}
  .wrap{padding:12px}
  .topbar .logo{font-size:17px}
  .flip{height:195px}
  .srow{grid-template-columns:96px 1fr}
  .srow .name{font-size:13px}
  /* 表格卡片化:多列表在小屏转为单列卡片,字段名以彩色小标显示 */
  .ovtable thead,.ovtable th{display:none}
  .ovtable,.ovtable tbody{display:block;width:100%}
  .ovtable tr{display:block;background:#fff;border:1px solid #EDE4D3;border-radius:12px;margin:0 0 10px;padding:6px 4px;box-shadow:0 2px 8px rgba(58,50,38,.05)}
  .ovtable td{display:block;border:none;padding:9px 12px 10px;width:auto!important}
  .ovtable td+td{border-top:1px dashed #EDE0C8}
  .ovtable td:before{content:attr(data-lb);display:block;font-size:12px;font-weight:700;color:var(--red);margin-bottom:3px;letter-spacing:.5px}
  .ovtable td:not([data-lb]):before{content:none}
  .ovtable td b{white-space:normal}
}
/* ===== 任务流 & 资料卡 & 过关自测（第四单元样板） ===== */
.taskflow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.tflow{flex:1;min-width:140px;border:2px solid #E5D9BE;border-radius:14px;background:#FFFDF8;padding:12px 10px;text-align:center;cursor:pointer;transition:.15s;font-weight:700;font-size:14.5px;color:var(--ink);font-family:inherit}
.tflow:active{transform:scale(.97)}
.tflow small{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:4px}
.srcbtn{display:inline-block;background:#FFF3D6;border:1.5px solid #E8C97A;color:#8A6A12;border-radius:999px;font-size:12.5px;font-weight:700;padding:3px 12px;margin:4px 6px 0 0;cursor:pointer;font-family:inherit}
.srcbtn:active{transform:scale(.96)}
.cardmask{position:fixed;inset:0;background:rgba(30,25,15,.55);z-index:1000;display:none;align-items:flex-end;justify-content:center}
.cardmask.show{display:flex}
.cardpop{background:#FFFDF8;width:min(560px,94vw);max-height:82vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 18px 28px;box-shadow:0 -8px 40px rgba(0,0,0,.25)}
@media(min-width:700px){.cardmask{align-items:center}.cardpop{border-radius:20px}}
.cardpop h4{margin:0 0 10px;font-size:17px;color:var(--ink)}
.cardpop .closex{float:right;background:#F1EAE0;border:none;border-radius:999px;width:30px;height:30px;font-size:15px;cursor:pointer;color:#8A7F6E}
.cardpop p{margin:0 0 10px;font-size:14.5px;line-height:1.85}
.quizq{background:#FFFDF8;border:2px solid #E5D9BE;border-radius:14px;padding:14px;margin-bottom:12px}
.quizq h4{margin:0 0 10px;font-size:15px;line-height:1.7}
.quizq .opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid #EDE4D3;border-radius:10px;padding:10px 12px;margin:6px 0;cursor:pointer;font-size:14.5px;font-family:inherit;transition:.12s}
.quizq .opt.sel{border-color:#2F80C3;background:#EFF6FD}
.quizq .opt.ok{border-color:#3C9E5C;background:#EFF9F1}
.quizq .opt.bad{border-color:#C0392B;background:#FBF0EE}
.xltextarea{width:100%;border:2px solid #E5D9BE;border-radius:12px;padding:10px;font-size:14.5px;font-family:inherit;box-sizing:border-box;resize:vertical;line-height:1.7}
.tl-flash{animation:tlflash 1.8s ease}
@keyframes tlflash{0%,55%{background:#FFF3D6;box-shadow:0 0 0 3px #E8C97A;border-radius:8px}100%{background:transparent;box-shadow:none}}
/* 精讲富文本子块（原句/先想一想/咀嚼/一句话/考法） */
.jl-yuan{background:#F7F1E3;border-left:4px solid #C9A961;border-radius:0 10px 10px 0;padding:8px 12px;margin:8px 0;font-size:14px;line-height:1.8;color:#5A5142}
.jl-ask{background:#EFF6FD;border-radius:10px;padding:8px 12px;margin:8px 0;font-size:14px;line-height:1.8;color:#2F5C8F;font-weight:700}
.jl-ju{margin:8px 0;padding:0}
.jl-ju li{margin-bottom:6px;font-size:14px;line-height:1.8;list-style:none;padding-left:16px;position:relative}
.jl-ju li:before{content:"◆";position:absolute;left:0;top:1px;font-size:9px;color:#C9A961}
.jl-take{background:#EFF9F1;border-radius:10px;padding:8px 12px;margin:8px 0;font-size:14px;line-height:1.8;color:#2E6B45}
.jl-kao{font-size:13px;color:#8A6A12;background:#FFF3D6;border-radius:10px;padding:7px 12px;margin:8px 0 0;line-height:1.7}
.jl-lab{display:inline-block;font-size:12px;font-weight:900;color:#A08A54;letter-spacing:2px;margin-right:6px}
/* 课文原文·直读版式 */
.readtext{margin-top:4px}
.readtext p{margin:13px 0;font-size:15px;line-height:2.05;color:var(--ink)}
.readtext p>span:first-child{margin-right:8px}

  {t:"地道产生的原因",b:"1938年抗日战争进入相持阶段，日军在冀中平原频繁“扫荡”，实行烧光、杀光、抢光的“三光”政策。平原上无山无险可守，冀中人民创造了<b>地道战</b>——把整个平原变成打击敌人的战场。"},

 ,luohuasheng:[
  {t:"情节链（四件事）",b:"<b>种花生 → 收花生 → 尝花生 → 议花生</b>。其中“议花生”写得最详细——这叫<b>详略得当</b>：重点内容详写，次要内容略写。"},

 ,guihuayu:[
  {t:"两条线索",b:"明线：<b>童年摇花乐</b>（摇桂花、送桂花、做桂花食品）；暗线：<b>思念故乡</b>。所有内容都围着桂花转，都指向乡愁。"},

 ,yuan1Di:[

  {t:"人物品质",b:"海力布<b>热心助人</b>（平时把猎物分给大家）、<b>舍己为人</b>（为救乡亲说出秘密，宁可自己变成石头）。评价人物要结合具体情节。"},

  {t:"民间故事的特点",b:"<b>口耳相传</b>（老百姓一代代讲出来的）、<b>情节神奇</b>（能听懂动物说话）、<b>寄托愿望</b>（赞颂舍己为人的英雄）。"},

 ,niulang1:[
  {t:"情节链",b:"<b>身世凄苦</b>（爹娘去世、哥嫂虐待、分家只分得老牛）→ <b>老牛相伴</b> → <b>老牛开口指点</b> → <b>湖边遇见织女</b> → <b>结为夫妻</b>。"},

 ,niulang2:[
  {t:"情节链",b:"<b>男耕女织的幸福生活</b> → <b>老牛临终留牛皮</b> → <b>王母抓走织女</b> → <b>牛郎披牛皮挑着儿女追赶</b> → <b>天河相隔</b> → <b>七夕鹊桥相会</b>。"},

  {t:"情节排序（必考）",b:"课文顺序：<b>雾海夜航 → 海难发生 → 组织救援 → 船长殉职</b>。考试爱给打乱的情节排序，抓住“出海—撞船—救人—沉没”四步就不会错。"},
  {t:"人物品质分析",b:"哈尔威船长：<b>忠于职守</b>（始终站在指挥岗位上）、<b>临危不乱</b>（面对惊慌失措的众人镇定自若）、<b>舍己救人</b>（把 60 人救出去，自己随船沉没）。答题用“品质词+文中事例”两段式。"},

function zigeGrid(key){

    return "<div class='zitem'>"+
      "<svg viewBox='0 0 80 80' width='80' height='80' role='img' aria-label='"+c[0]+"'>"+
      "<rect x='1' y='1' width='78' height='78' fill='#FFFDF7' stroke='#C9B88F' stroke-width='1.5'/>"+
      "<path d='M40 1V79 M1 40H79 M1 1L79 79 M79 1L1 79' stroke='#EAD9B8' stroke-width='0.8' stroke-dasharray='4 3' fill='none'/>"+
      "<text x='40' y='59' text-anchor='middle' font-size='46' fill='#3A3226' style=\"font-family:'KBKaiWeb','Kaiti SC','STKaiti','KaiTi','楷体',serif\">"+c[0]+"</text>"+
      "</svg>"+
      "<div class='zpy'>"+c[1]+"</div><div class='zwords'>"+c[2]+"</div></div>";
  }).join("");
  return "<div class='card'><h3>✍️ 会写字·米字格（"+arr.length+" 字）</h3><p style='font-size:13px;color:var(--muted)'>字在米字格正中，注意笔画的疏密与占位；下面的词语帮助你记字义。</p><div class='zwrap'>"+cells+"</div></div>";
}

/* ===================== 基础渲染 ===================== */
function showView(id){
  ["view-units","view-unit","view-lesson"].forEach(function(v){
    document.getElementById(v).classList.toggle("show", v===id);
  });
  var tb=document.getElementById("topBack");
  if(tb){
    if(id==="view-lesson"){
      tb.style.display=""; tb.textContent="← 单元总览";
      tb.onclick=function(){ if(currentUnit) openUnit(currentUnit.key); };
    } else if(id==="view-unit"){
      tb.style.display=""; tb.textContent="← 单元列表";
      tb.onclick=function(){ showView("view-units"); };
    } else {
      tb.style.display="none";
    }
  }
  window.scrollTo({top:0,behavior:"smooth"});
}

  });
}

      "<span class=\"more-hint\">查看讲解 →</span></div>";

var currentLesson=null;
function openLesson(key){
  var hit=findLesson(key);
  currentLesson=hit.L; currentUnit=hit.unit;
  var L=hit.L;
  document.getElementById("lessonHead").style.background = "linear-gradient(135deg,"+L.color+","+shade(L.color)+")";
  document.getElementById("lessonTitle").textContent = L.emoji+" "+L.num+" · "+L.title;
  document.getElementById("lessonGoal").textContent = L.goal;
  var tabs=document.querySelectorAll("#lessonTabs button");
  var tnames = L.isWriting ? ["✍️ 审题指导","🖋️ 写作支架","🌟 素材与积累"] : ["📘 知识讲解","📌 考点说明","🌟 背景拓展"];
  if(window.PANE_GUOGUAN && PANE_GUOGUAN[L.key]) tnames.push("🎯 过关自测");
  tabs.forEach(function(b,i){
    b.textContent=tnames[i]||"";
    b.classList.remove("active"); b.style.removeProperty("background");
    b.style.display = i<tnames.length ? "" : "none";
  });
  tabs[0].classList.add("active");
  tabs[0].style.background=L.color;
  buildPanes(L);
  switchTab("jiangjie");
  showView("view-lesson");
}
function shade(c){
  var map={"var(--teal)":"#0B7A6C","var(--red)":"#B23F3B","var(--orange)":"#C46E08","var(--green)":"#3C7E2E","var(--purple)":"#5F4787"};
  return map[c]||c;
}
function switchTab(name){
  var L=currentLesson;
  document.querySelectorAll("#lessonTabs button").forEach(function(b){
    var on = b.dataset.tab===name;
    b.classList.toggle("active",on);
    if(on){b.style.background=L.color;}else{b.style.removeProperty("background");}
  });
  document.querySelectorAll("#lessonPanes .tabpane").forEach(function(p){
    p.classList.toggle("show", p.dataset.tab===name);
  });
  if(name==="kaodian") buildAccordion();
  if(name==="tuozhan") playSpeedChart();
  if(name==="guoguan") buildQuiz();
}
function buildPanes(L){
  var box=document.getElementById("lessonPanes");
  var html = PANE_JIANGJIE[L.key](L) + PANE_KAODIAN[L.key](L) + PANE_TUOZHAN[L.key](L);
  if(window.PANE_GUOGUAN && PANE_GUOGUAN[L.key]) html += PANE_GUOGUAN[L.key](L);
  box.innerHTML = html;
  loadXilianbi(L.key);
  if(L.key==="yuan4Di") tgInit();
  var anchor=box.querySelector(".tabpane[data-tab='jiangjie'] #jichuAnchor");
  if(anchor && JICHU[L.key]){ anchor.innerHTML=jichuHtml(L.key); }
  else{
    var tipEl=box.querySelector(".tabpane[data-tab='jiangjie'] .tipbox.tip");
    if(tipEl && JICHU[L.key]){ tipEl.insertAdjacentHTML("beforebegin", jichuHtml(L.key)); }
  }
  buildFlips();
  buildHoles();
  initSentToggle();
  buildSpeedChart();
  initAnchors();
  initTableLabels();
  /* 学习/复习双模式排序（第四单元样板） */
  var jmode="learn"; try{ jmode=localStorage.getItem("inkclass_jjmode")||"learn"; }catch(e){}
  if(window.PANE_GUOGUAN && PANE_GUOGUAN[L.key] && jmode==="learn"){
    reorderJj(box.querySelector(".tabpane[data-tab='jiangjie']"));
  }
  var mb=document.getElementById("jjModeBtn");
  if(mb) mb.textContent = jmode==="learn" ? "🔄 切换为：复习模式（备考顺序）" : "🔄 切换为：学习模式（先读课文）";
}

/* 章节锚点快速跳转（自动扫描面板内分区卡，生成吸顶导航条） */
function initAnchors(){
  var topbar=document.querySelector(".topbar");
  document.querySelectorAll("#lessonPanes .tabpane").forEach(function(pane){
    if(pane.dataset.anchored) return;
    var cards=Array.prototype.filter.call(pane.children,function(el){
      return el.classList && el.classList.contains("card");
    });
    if(cards.length<3) return;
    pane.dataset.anchored="1";
    var bar=document.createElement("div"); bar.className="anchorbar";
    if(topbar) bar.style.top=topbar.offsetHeight+"px";
    var chips=[];
    var topChip=document.createElement("button"); topChip.type="button"; topChip.className="chip top"; topChip.textContent="⬆ 顶部";
    topChip.onclick=function(){ window.scrollTo({top:0,behavior:"smooth"}); };
    bar.appendChild(topChip); chips.push(topChip);
    cards.forEach(function(card,i){
      var h=card.querySelector("h3");
      var name=h?h.textContent.replace(/（[^）]*）|\([^)]*\)/g,"").trim():"";
      if(name.indexOf("：")>-1||name.indexOf(":")>-1||name.indexOf("—")>-1){
        name=name.split(/：|:|—/)[0].trim();
      }
      if(!name) name="第"+(i+1)+"节";
      if(name.length>10) name=name.slice(0,10);
      var chip=document.createElement("button"); chip.type="button"; chip.className="chip"; chip.textContent=name;
      chip.onclick=function(){
        var barBottom=bar.getBoundingClientRect().bottom;
        var y=card.getBoundingClientRect().top+window.scrollY-(barBottom+10);
        window.scrollTo({top:y,behavior:"smooth"});
      };
      bar.appendChild(chip); chips.push(chip);
    });
    var ticking=false;
    function updateOn(){
      ticking=false;
      if(!document.contains(bar)) return;
      var mark=bar.getBoundingClientRect().bottom+50;
      var cur=0;
      cards.forEach(function(card,i){
        if(card.getBoundingClientRect().top<=mark) cur=i;
      });
      for(var j=1;j<chips.length;j++){
        chips[j].classList.toggle("on", j-1===cur);
      }
    }
    window.addEventListener("scroll",function(){
      if(!ticking){ ticking=true; window.requestAnimationFrame(updateOn); }
    },{passive:true});
    pane.insertBefore(bar,pane.firstChild);
    updateOn();
    setTimeout(updateOn,120);
    setTimeout(updateOn,600);
    window.addEventListener('load',updateOn);
  });
}
window.addEventListener("resize",function(){
  var t=document.querySelector(".topbar");
  if(!t) return;
  document.querySelectorAll(".anchorbar").forEach(function(b){ b.style.top=t.offsetHeight+"px"; });
});

function initTableLabels(){
  document.querySelectorAll("table.ovtable").forEach(function(tb){
    if(tb.dataset.lb) return;
    tb.dataset.lb="1";
    var head=tb.rows.length?tb.rows[0].cells[0]:null;
    if(!head || head.tagName!=="TH") return; /* 无表头的表(词语介绍/生字词等)不打字段小标 */
    var ths=Array.prototype.map.call(tb.rows[0].cells,function(c){ return c.textContent.trim(); });
    Array.prototype.forEach.call(tb.rows,function(row){
      Array.prototype.forEach.call(row.cells,function(td,ci){
        if(td.tagName==="TD" && ths[ci]) td.setAttribute("data-lb",ths[ci]);
      });
    });
  });
}

/* 左右滑动 / 方向键切换上一篇下一篇 */
function inLessonView(){
  var v=document.getElementById("view-lesson");
  return !!(v && v.classList.contains("show"));
}
function lessonNeighbors(){
  if(!currentUnit || !currentLesson) return null;
  var arr=currentUnit.lessons, idx=-1;
  for(var i=0;i<arr.length;i++){ if(arr[i].key===currentLesson.key){ idx=i; break; } }
  if(idx<0) return null;
  return {prev:idx>0?arr[idx-1]:null, next:idx<arr.length-1?arr[idx+1]:null};
}
function toastMsg(msg){
  var t=document.getElementById("swipeToast");
  if(!t){ t=document.createElement("div"); t.id="swipeToast"; t.className="swipetoast"; document.body.appendChild(t); }
  t.textContent=msg; t.classList.add("show");
  clearTimeout(t._tm); t._tm=setTimeout(function(){ t.classList.remove("show"); },1300);
}
function gotoLesson(nl, dir){
  if(!nl) return;
  var v=document.getElementById("view-lesson");
  if(v.dataset.animating) return;
  function swap(){
    openLesson(nl.key);
    var de=document.documentElement;
    if(de){ de.style.scrollBehavior="auto"; window.scrollTo(0,0); de.style.scrollBehavior=""; }
    else window.scrollTo(0,0);
    toastMsg(nl.emoji+" "+nl.num+" · "+nl.title);
  }
  if(!dir){ swap(); return; }
  v.dataset.animating="1";
  v.classList.add(dir==="next"?"lesson-anim-out-l":"lesson-anim-out-r");
  setTimeout(function(){
    swap();
    v.classList.remove("lesson-anim-out-l","lesson-anim-out-r");
    v.classList.add(dir==="next"?"lesson-anim-in-r":"lesson-anim-in-l");
    void v.offsetWidth;
    v.classList.add("lesson-anim-settle");
    setTimeout(function(){
      v.classList.remove("lesson-anim-in-r","lesson-anim-in-l","lesson-anim-settle");
      delete v.dataset.animating;
    },260);
  },170);
}
function initSwipe(){
  var sx=0, sy=0, on=false;
  document.addEventListener("touchstart",function(e){
    if(!inLessonView() || e.touches.length!==1) return;
    sx=e.touches[0].clientX; sy=e.touches[0].clientY; on=true;
  },{passive:true});
  document.addEventListener("touchend",function(e){
    if(!on) return; on=false;
    if(!inLessonView()) return;
    var t=e.changedTouches[0];
    var dx=t.clientX-sx, dy=t.clientY-sy;
    if(Math.abs(dx)<70 || Math.abs(dx)<Math.abs(dy)*1.5) return;
    var nb=lessonNeighbors(); if(!nb) return;
    if(dx<0 && nb.next) gotoLesson(nb.next,"next");
    else if(dx>0 && nb.prev) gotoLesson(nb.prev,"prev");
  },{passive:true});
  document.addEventListener("keydown",function(e){
    if(!inLessonView()) return;
    var tag=(e.target&&e.target.tagName||"").toLowerCase();
    if(tag==="input"||tag==="textarea") return;
    var nb=lessonNeighbors(); if(!nb) return;
    if(e.key==="ArrowLeft" && nb.prev) gotoLesson(nb.prev,"prev");
    else if(e.key==="ArrowRight" && nb.next) gotoLesson(nb.next,"next");
  });
}

  "<div class='card'><h3>📚 课后习题·参考答案（据统编教材课后题整理）</h3>"+
  "<div class='acc open' onclick='this.classList.toggle(\"open\")'><button class='head'><span class='idx'>题1</span>“紧走搭石慢过桥”这句俗语怎么理解？<span class='arrow'>▸</span></button><div class='body'>📝 <b>答题模板：</b>释俗语 + 讲原理 + 点智慧。<br>✅ <b>参考答案：</b>搭石踩上去难免活动，走得快才容易保持平衡，所以过搭石要快；桥面平稳，可以慢走。这句俗语体现了山里人过溪的生活智慧。</div></div>"+
  "<div class='acc' onclick='this.classList.toggle(\"open\")'><button class='head'><span class='idx'>题2</span>从哪里看出一行人走搭石“协调有序”？<span class='arrow'>▸</span></button><div class='body'>✅ <b>参考答案：</b>“前面的抬起脚来，后面的紧跟上去”——配合默契、有先有后；“嗒嗒的声音，像轻快的音乐”——动作整齐得像合着节拍，这就是协调有序。</div></div>"+
  "<div class='acc' onclick='this.classList.toggle(\"open\")'><button class='head'><span class='idx'>题3</span>结尾说搭石“联结着乡亲们美好的情感”，怎么理解？<span class='arrow'>▸</span></button><div class='body'>✅ <b>参考答案：</b>搭石联结着故乡的小路，更联结着乡亲们摆搭石（为他人着想）、走搭石（协调有序）、让搭石（敬老礼让）的美好情感。借物喻人，物美情深。</div></div>"+
  "</div>"+
  "<div class='card'><h3>👤 作者与背景：刘章</h3>"+
  "<div class='kv'><div><b>👤 作者小传</b><br>刘章（1939—2020），出生在河北省兴隆县上庄村，著名乡土诗人，人们称他为“农民诗人”。他从小在山村走搭石长大，写过《燕山歌》《葵花集》等大量诗歌和散文。</div>"+
  "<div><b>🖋️ 写作背景</b><br>1977年末，刘章调到石家庄工作。看到城里人抢挤公共汽车、无序横穿马路，他格外想念家乡：山里人走搭石，一人跟着一人、协调有序，对面相遇还互相礼让。1980年2月，他写下了散文《搭石》。</div></div>"+
  "<div class='tipbox story'>📖 刘章在回忆文章《写作〈搭石〉的前前后后》里说：“搭石上有新意，搭石上有美，搭石上有情。”正是这种从平凡小事里发现美的眼睛，让这篇散文从2004年起入选语文教材，一教就是二十多年。</div>"+
  "<div class='acc' onclick='this.classList.toggle(\"open\")'><button class='head'><span class='idx'>年</span>生平年表（点击展开）<span class='arrow'>▸</span></button><div class='body'><div class='timeline'>"+
  "<div class='tl'><b>1939年</b><br>出生在河北省兴隆县上庄村，从小走搭石长大。</div>"+
  "<div class='tl'><b>1977年末（转折点）</b><br>调到石家庄工作，城市里挤公交、乱穿马路的景象，让他格外想念家乡的搭石。</div>"+

 jiangxianghe:function(L){return "<div class='tabpane show' data-tab='jiangjie'>"+

  "<div id='jichuAnchor'></div>"+
  "<div class='card'><h3>🌏 历史大舞台：战国时代</h3>"+
  "<p>这个故事发生在<b>两千两百多年前</b>的战国时期（公元前475—前221年）。当时天下分裂成七个大国，史称<b>“战国七雄”</b>：齐、楚、燕、韩、赵、魏、秦。各国今天结盟、明天开战，都想吞并别人、壮大自己。</p>"+
  "<div class='kv'><div><b>🐅 最强的秦国</b><br>秦国经过商鞅变法，兵力冠绝天下，一心向东扩张、吞并六国。它最爱用的手段之一，就是玩“外交把戏”占邻国的便宜——本课的两场重头戏，都是秦国设的局。</div>"+

  "<div class='tipbox exam'>📝 <b>一课一背（考试标准答案）</b><br>主要内容：课文讲完璧归赵、渑池会面、负荆请罪三个故事。<br>中心思想：赞扬蔺相如机智勇敢、不畏强暴、顾全大局，廉颇英勇善战、知错就改，以及他们<b>以国家利益为重</b>的爱国情怀。</div>"+

  "<div class='kv'><div><b>🧠 蔺相如</b><br>机智勇敢、顾全大局。面对秦王毫不畏惧；为了国家利益，处处避让廉颇。</div><div><b>🛡️ 廉颇</b><br>英勇善战、知错就改。不服气时说“我廉颇攻无不克”，认清错误后背着荆条上门请罪。</div></div>"+

  "<div class='tl'><b>风波 · 将相失和</b><br>廉颇不服：“我攻无不克、战无不胜，他蔺相如就靠一张嘴，反倒爬到我头上！”扬言要当面羞辱他。蔺相如于是处处躲着廉颇——不是怕他，而是怕将相不和，秦国就有机可乘。</div>"+
  "<div class='tl'><b>转机 · 负荆请罪</b><br>廉颇听说后羞愧难当，脱下战袍、背着荆条登门请罪。两人从此结为生死之交，同心协力保卫赵国。</div>"+
  "<div class='tl'><b>后续 · 将相同心的力量</b><br>将相和好后，秦国很多年果然不敢大规模进攻赵国。可惜后来赵王中了秦国的反间计，在长平之战换下廉颇、改用只会“纸上谈兵”的赵括，赵军惨败，赵国从此一蹶不振——这恰恰反衬出当年将相同心多么珍贵。</div>"+
  "<div class='tl'><b>尾声 · 流传两千年</b><br>公元前221年，秦统一六国，战国落幕。而“完璧归赵”“负荆请罪”这两个成语，跟着司马迁的《史记》一直流传到今天。</div>"+

  "<div class='card'><h3>📄 课文原文（对照精讲用）</h3>"+
  "<p style='font-size:13px;color:var(--muted)'>依据统编教材，共 17 个自然段，根据《史记·廉颇蔺相如列传》相关内容改写。点击展开。</p>"+
  "<div class='acc' onclick='this.classList.toggle(\"open\")'><button class='head'><span class='idx'>原</span>展开课文全文（约1300字）<span class='arrow'>▸</span></button><div class='body'>"+
  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>1</span>战国时候，秦国最强，常常进攻别的国家。</div>"+
  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>2</span>有一回，赵王得了一件无价之宝，叫和氏璧。秦王知道了，就写一封信给赵王，说愿意拿十五座城换这块璧。</div>"+
  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>3</span>赵王接到信后非常着急，立即召集大臣来商议。大家说秦王不过想把和氏璧骗到手罢了，不能上他的当；可是不答应，又怕他派兵来进攻。</div>"+
  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>4</span>正在为难的时候，有人说有个叫蔺相如的人，勇敢机智，也许他能解决这个难题。</div>"+
  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>5</span>赵王把蔺相如找来，问他该怎么办。</div>"+
  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>6</span>蔺相如想了一会儿，说：“我愿意带着和氏璧到秦国去。如果秦王真的拿十五座城来换，我就把璧交给他；如果他不肯交出十五座城，我一定把璧送回来。那时候秦国理屈，就没有动兵的理由。”</div>"+
  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>7</span>赵王和大臣们没有别的办法，只好派蔺相如带着和氏璧到秦国去。</div>"+
  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>8</span>蔺相如到了秦国，进宫见了秦王，献上和氏璧。秦王双手捧住璧，一边看一边称赞，绝口不提十五座城的事。蔺相如看这情形，知道秦王没有拿城换璧的诚意，就上前一步，说：“这块璧有点儿小毛病，让我指给您看。”秦王听他这么一说，就把和氏璧交给蔺相如。蔺相如捧着璧，往后退了几步，靠着柱子站定。他理直气壮地说：“我看您并不想交付十五座城。现在璧在我手里，您要是强逼我，我的脑袋和璧就一块儿撞碎在这柱子上！”说着，他举起和氏璧就要向柱子上撞。秦王怕他把璧真的撞碎了，连忙说一切都好商量，就叫人拿出地图，把允诺划归赵国的十五座城指给他看。蔺相如说和氏璧是无价之宝，要举行个隆重的典礼，他才肯交出来。秦王只好跟他约定了举行典礼的日期。</div>"+
  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>9</span>蔺相如知道秦王丝毫没有拿城换璧的诚意，一回到客舍，就叫手下人化了装，带着和氏璧抄小路先回赵国去了。到了举行典礼那一天，蔺相如进宫见了秦王，大大方方地说：“和氏璧已经送回赵国了。您如果有诚意的话，先把十五座城交给我国，我国马上派人把璧送来，决不失信。不然，您杀了我也没有用，天下的人都知道秦国是从来不讲信用的！”秦王没有办法，只得客客气气地把蔺相如送回赵国。</div>"+
  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>10</span>这就是“完璧归赵”的故事。蔺相如立了功，赵王封他做上大夫。</div>"+
  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>11</span>过了几年，秦王约赵王在渑池会见。赵王和大臣们商议说：“去吧，怕有危险；不去吧，又显得太胆怯。”蔺相如认为对秦王不能示弱，还是去的好，赵王才决定动身，让蔺相如随行。大将军廉颇带着军队送他们到边界上，做好了抵御秦兵的准备。</div>"+
  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>12</span>赵王到渑池与秦王会见。秦王要赵王鼓瑟。赵王不好推辞，鼓了一段。秦王就叫人记录下来，说在渑池会上，赵王为秦王鼓瑟。</div>"+
  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>13</span>蔺相如看秦王这样侮辱赵王，生气极了。他走到秦王面前，说：“请您为赵王击缶。”秦王拒绝了。蔺相如再要求，秦王还是拒绝。蔺相如说：“您现在离我只有五步远。您不答应，我就跟您拼了！”秦王被逼得没法，只好敲了一下缶。蔺相如也叫人记录下来，说在渑池会上，秦王为赵王击缶。</div>"+
  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>14</span>秦王没占到便宜。他知道廉颇已经在边境上做好了准备，不敢拿赵王怎么样，只好让赵王回去。</div>"+
  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>15</span>蔺相如在渑池会上又立了功。赵王封蔺相如为上卿，职位比廉颇高。廉颇很不服气，他对别人说：“我廉颇攻无不克，战无不胜，立下许多大功。他蔺相如有什么能耐，就靠一张嘴，反而爬到我头上去了。我碰见他，得给他个下不了台！”这话传到了蔺相如耳朵里，蔺相如就请病假不上朝，免得跟廉颇见面。</div>"+
  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>16</span>有一天，蔺相如坐车出去，远远看见廉颇骑着高头大马过来了，他赶紧叫车夫把车往回赶。蔺相如手下的人可看不顺眼了。他们说，蔺相如见了廉颇像老鼠见了猫似的，为什么要怕他呢！蔺相如对他们说：“诸位请想一想，廉将军和秦王比，谁厉害？”他们说：“当然秦王厉害！”蔺相如说：“秦王我都不怕，会怕廉将军吗？大家知道，秦王不敢进攻我们赵国，就因为武有廉颇，文有蔺相如。如果我们俩闹不和，就会削弱赵国的力量，秦国必然乘机来打我们。我所以避着廉将军，为的是我们赵国啊！”</div>"+
  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>17</span>蔺相如的话传到了廉颇的耳朵里。廉颇静下心来想了想，觉得自己为了争一口气，就不顾国家的利益，真不应该。于是，他脱下战袍，背上缚着荆条，到蔺相如门上请罪。蔺相如见廉颇来负荆请罪，连忙热情地出来迎接。从此以后，他们俩成了好朋友，同心协力保卫赵国。</div>"+
  "</div></div>"+
  "</div>"+
  "<div class='card'><h3>📖 逐幕精读：三个故事里的人物细节</h3>"+
  "<div class='timeline'>"+
  "<div class='tl'><b>⭐ 第一幕 · 完璧归赵（第8-10段）</b><br>秦王说用15座城换璧——蔺相如看穿“给不给都吃亏”的死局。他的三步妙棋：①说璧有点小毛病，拿回宝璧；②靠柱而立，“我的脑袋和璧就一块儿撞碎在这柱子上”；③要求秦王举行典礼拖延时间，暗中派人把璧送回。<b>关键词：理直气壮、不畏强暴。</b></div>"+
  "<div class='tl'><b>⭐ 第二幕 · 渑池会面（第11-14段）</b><br>秦王让赵王鼓瑟并叫人记录，想占上风；蔺相如逼前一步：“您现在离我只有五步远”，逼秦王击缶。<b>关键词：针锋相对、不畏牺牲。</b></div>"+

  "<table class='ovtable'><thead><tr><th style='width:110px'>写法</th><th>课文里怎么用</th><th style='width:190px'>你的作文怎么用</th></tr></thead>"+

  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>1</span>也许你跑得很快。不过要是你跟猎豹或鸵鸟赛跑的话，就一点儿赢的希望也没有了。</div>"+
  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>2</span>人在奋力奔跑的时候，最大速度能够达到 44 千米每小时。这个速度跟鸵鸟比起来差远了——鸵鸟奔跑的最大速度约 72 千米每小时。在两条腿的动物里面，鸵鸟应该算是奔跑的世界冠军。</div>"+
  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>3</span>比鸵鸟跑得更快的动物就要数猎豹了。猎豹奔跑的最大速度可达 110 千米每小时。猎豹才是陆地上跑得最快的动物。</div>"+
  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>4</span>但是游隼向下俯冲时的速度更快，超过 320 千米每小时。这个速度是汽车在高速公路上飞速行驶时速度的两到三倍。它俯冲时的速度比任何一种动物奔跑时的速度都要快。</div>"+
  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>5</span>不过，游隼还是没有飞机飞行的速度快。在喷气式飞机飞行的高度，声音传播的速度大约是 1050 千米每小时，而一些高速喷气式飞机的飞行速度是声速的数倍。如果你对着一个以超音速移动的人大喊，他是什么都听不见的。因为声音根本就追不上他。</div>"+
  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>6</span>乘坐喷气式飞机去旅行，速度绝对是够快的了。但是，如果你想到月球上去，就需要搭乘速度更快的工具了。对！我们需要一枚火箭。为了摆脱地心引力，飞到浩瀚的太空中，火箭的速度要比喷气式飞机快得多才行。火箭的最大速度能达到 4 万千米每小时，是声速的 30 多倍。进入太空之后，即使关掉发动机，火箭仍可以继续前进。</div>"+
  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>7</span>看！前面呼啸而过的东西是什么？跟它的速度一比，火箭就好像是静止的一样。那是流星体！流星体是太空中一种较小的天体。有的流星体运动的最大速度能达到 25 万千米每小时，是火箭运动最大速度的 6 倍多。</div>"+
  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>8</span>现在，你一定会认为流星体是人们所能见到的速度最快的物体。不过，还有比流星体运动速度快得多的东西，而且它就在我们身边。只要我们按下手电筒的开关，立刻会出现一束光柱。光的速度是惊人的，大约是 30 万千米每秒，比流星体的速度要快几千倍！</div>"+
  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>9</span>如果按照光速运动，我们一秒钟就可以沿着地球赤道转约七圈半！科学家认为光的传播速度是最快的。真是令人难以置信，宇宙中最快的东西居然可以轻易地拿在手上！</div>"+
  "</div>"+
  "<div class='card'><h3>📖 逐段精讲：一场“速度接力赛”</h3>"+
  "<div class='timeline'>"+
  "<div class='tl'><b>⭐ 第1-3段 · 从“你”写起，三大选手登场</b><br>“也许你跑得很快。不过要是你跟猎豹或鸵鸟赛跑的话，就一点儿赢的希望也没有了。”从读者自己写起拉近距离；人 44 千米/时，鸵鸟 72——作比较+列数字；“猎豹才是陆地上跑得最快的动物！”点题句。</div>"+
  "<div class='tl'><b>第4段 · 游隼：新选手</b><br>俯冲超 320 千米/时，是高速公路汽车速度的两三倍——“比猎豹更快”的人出现了。</div>"+
  "<div class='tl'><b>⭐ 第5-6段 · 声音、飞机与火箭</b><br>声音约 1050 千米/时；高速喷气式飞机是声速的数倍。妙例：“对着以超音速移动的人大喊，他什么都听不见”——声音追不上他。火箭 4 万千米/时，摆脱地心引力后关掉发动机也能前进。</div>"+
  "<div class='tl'><b>第7段 · 流星体</b><br>最高 25 万千米/时，是火箭的 6 倍多——“跟它一比，火箭就好像是静止的一样”。</div>"+
  "<div class='tl'><b>⭐ 第8-9段 · 光：最后的大冠军</b><br>每秒约 30 万千米，比流星体快几千倍；按光速一秒绕赤道约七圈半。结尾感叹“宇宙中最快的东西居然可以轻易地拿在手上”——手电筒一按，光就来。</div>"+
  "<div class='tl'><b>结构小结</b><br>每个自然段的开头几乎都是<b>过渡句</b>，像接力棒一样把“更快”一棒一棒传下去——这就是“借助关键词句”的最好范本。</div>"+
  "</div></div>"+
  "<div class='card'><h3>✍️ 写法借鉴：课文怎么写，作文怎么用</h3>"+
  "<table class='ovtable'><thead><tr><th style='width:110px'>写法</th><th>课文里怎么用</th><th style='width:190px'>你的作文怎么用</th></tr></thead>"+
  "<tr><td><b>作比较+列数字</b></td><td>拿熟悉的（人、汽车）比陌生的（流星体），数字说话</td><td>介绍一样东西：先比大小，再报数字，一秒说清楚</td></tr>"+
  "<tr><td><b>问句做标题</b></td><td>“什么比猎豹的速度更快？”勾起好奇心</td><td>给作文起个问题式标题，老师一眼被吸引</td></tr>"+
  "<tr><td><b>过渡句串珠</b></td><td>每段第一句承上启下，接力传“更快”</td><td>段落之间用一句“路牌句”连起来，全文不散</td></tr></table></div>"+
  "<div class='card'><h3>📚 课后习题·参考答案（据统编教材课后题整理）</h3>"+
  "<div class='acc open' onclick='this.classList.toggle(\"open\")'><button class='head'><span class='idx'>题1</span>借助关键词句，用较快的速度默读课文，记下所用的时间<span class='arrow'>▸</span></button><div class='body'>💡 <b>方法提示：</b>先看每段第一句（过渡句），把“人→鸵鸟→猎豹→游隼→声音→飞机→火箭→流星体→光”的接力链抓出来，再回头补细节。读完对照：第一次用了几分钟？第二次能不能更快？</div></div>"+
  "<div class='acc' onclick='this.classList.toggle(\"open\")'><button class='head'><span class='idx'>题2</span>每个自然段的第一句有什么共同特点？<span class='arrow'>▸</span></button><div class='body'>✅ <b>参考答案：</b>大多是过渡句，承上启下，把速度一个比一个快的顺序像接力一样连起来。抓住第一句，就能快速读懂全文——这是“借助关键词句”读法的最佳练习课文。</div></div>"+
  "<div class='acc' onclick='this.classList.toggle(\"open\")'><button class='head'><span class='idx'>题3</span>“声音传播的速度大约是1050千米每小时”，“大约”能删吗？<span class='arrow'>▸</span></button><div class='body'>📝 <b>答题模板：</b>表态 + 释词 + 扣准确性。<br>✅ <b>参考答案：</b>不能。“大约”表示估计，声音速度随环境变化并不绝对，删去后与事实不符——体现说明文语言的准确严谨。</div></div>"+
  "</div>"+
  "<div class='card'><h3>👤 作者与背景：罗伯特·E·威尔斯</h3>"+
  "<div class='kv'><div><b>👤 作者小传</b><br>美国著名童书作家、插画家。他特别擅长用“画比较图”的办法给孩子讲科学，代表作品是科普绘本系列《妙想科学》（比如其中一本《蓝鲸是最大的东西吗？》）。</div>"+

 didaozhan:function(L){return "<div class='tabpane show' data-tab='jiangjie'>"+

  "<h3>🕳️ 读懂课文：平原上的“地下长城”</h3>"+
  "<div class='tipbox exam'>📝 <b>一课一背（考试标准答案）</b><br>主要内容：课文介绍了冀中地道战的产生原因、地道的式样结构及特点，以及地道在保护自己、打击敌人中的作用。<br>中心思想：热情颂扬了人民群众<b>无穷无尽的智慧和顽强的斗志</b>。</div>"+

  "<div class='tl'><b>1931年 · 九一八事变</b><br>日本侵占中国东北三省，中国人民开始了长达14年的抗日斗争。</div>"+
  "<div class='tl'><b>1937年 · 七七事变</b><br>日军发动全面侵华战争，北平、天津很快失守。冀中平原（今河北中部，紧挨着平津）成了敌后抗战的最前线。</div>"+
  "<div class='tl'><b>1938年起 · 最黑暗的岁月</b><br>抗日战争进入相持阶段，日军把主要兵力用来对付敌后根据地。他们在冀中频繁“扫荡”，实行烧光、杀光、抢光的<b>“三光”政策</b>，还修起封锁沟、封锁墙和密密麻麻的碉堡，妄想把抗日军民困死、饿死。</div>"+

  "<div><b>🖋️ 历史背景</b><br>1942到1944年，日军在冀中平原疯狂“大扫荡”，还修起封锁沟、封锁墙，“十里一碉，八里一堡”。平原上无处躲藏，冀中人民就在中国共产党的领导下发明了地道战。</div></div>"+
  "<div class='timeline'><div class='tl'><b>第一步 · 交通沟</b><br>抗战初期，村与村之间挖“道沟”，方便军民隐蔽转移，也限制日军的汽车横冲直撞。</div>"+

  "<div class='acc' onclick='this.classList.toggle(\"open\")'><button class='head'><span class='idx'>原</span>展开课文全文（约1200字）<span class='arrow'>▸</span></button><div class='body'>"+
  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>1</span>1942到1944那几年，日本侵略军在冀中平原上“大扫荡”，还修筑了封锁沟和封锁墙，十里一碉，八里一堡，想搞垮我们的人民武装。</div>"+
  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>2</span>为了粉碎敌人的“扫荡”，冀中人民在中国共产党的领导下，创造了新的斗争方式，这就是地道战。</div>"+
  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>3</span>说起地道战，简直是个奇迹。在广阔平原的地底下，挖了不计其数的地道，横的，竖的，直的，弯的，家家相连，村村相通。敌人来了，我们就钻到地道里去，让他们扑个空；敌人走了，我们就从地道里出来，照常种地过日子，有时候还要打击敌人。靠着地道这种坚强的堡垒，冀中平原上的人民坚持了敌后游击战争。</div>"+
  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>4</span>地道的式样有一百多种。就拿任丘的来说吧，村里的地道挖在街道下面，跟别村相通的地道挖在庄稼地下面。地道有四尺多高，个儿高的人弯着腰可以通过；地道的顶离地面三四尺，不妨碍上面种庄稼。地道里每隔一段距离就有一个大洞，洞顶用木料撑住，很牢靠。大洞四壁又挖了许多小洞，有的住人，有的拴牲口，有的搁东西，有的做厕所。一个大洞容得下一百来人，最大的能容二百多人。洞里经常准备着开水、干粮、被子、灯火，在里面住上个三五天，不成问题。洞里有通到地面的气孔，从气孔里还能漏下光线来。气孔的口子都开在隐蔽的地方，敌人很难发现。人藏在洞里，既不气闷，又不嫌暗。有的老太太把纺车也搬进来，还嗡嗡嗡地纺线呢。</div>"+
  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>5</span>地道的出口也开在隐蔽的地方，外面堆满荆棘。有的还在旁边挖一个陷坑，坑里插上尖刀或者埋上地雷，上面用木板虚盖着，板上铺些草，敌人一踏上去就翻下坑里送了命。在地道里，离出口不远的地方挖几个特别坚固的洞，民兵拿着武器在洞里警戒；拐弯的地方挖一些岔道，叫“迷惑洞”，敌人万一进来了，分不清哪条是死道，哪条是活道。进了死道，就有地雷埋在那儿等着他们；就算进了活道，他们也过不了“孑口”。原来地道里每隔一段就有个很窄的“孑口”，只能容一个人爬过去。只要一个人拿一根木棒，就可以把“孑口”守住，真是“一夫当关，万夫莫开”。</div>"+
  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>6</span>敌人尝到了地道的厉害，想方设法来破坏，什么火攻呀，水攻呀，毒气攻呀，都用遍了。大家又想出了许多妙法来防备。洞口准备着土和沙，可以用来灭火。“孑口”上装着吊板，如果敌人放毒气，就把吊板放下来挡住，不让毒气往里透。对付水攻的法子更妙了，把地道跟枯井暗沟连接起来，敌人放水的时候，水从洞口进来，就流到枯井暗沟里去了。任敌人想出什么毒辣的法子也不怕，因为各个村子的地道是相通的，大不了转移到旁的村子去。</div>"+
  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>7</span>人在地道里怎么能了解地面上的情况呢？民兵指挥部派出一些人分布在各处，发现了敌情就吆喝起来，一个接一个，一直传到指挥部里。老百姓管这种吆喝叫“无线电”。地道里面可就用“有线电”了，一根铁丝牵住一个小铜铃，这儿一拉，那儿就响，拉几下表示什么意思是早就约好了的。</div>"+
  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>8</span>为了打击敌人，什么办法都想出来了，人民的智慧是无穷无尽的。</div>"+
  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>9</span>有了地道战这个斗争方式，敌人毒辣透顶的“扫荡”被粉碎了。冀中平原上的人民不但坚持了生产，还有力地打击了敌人，在我国抗日战争史上留下了惊人的奇迹。</div>"+
  "</div></div>"+
  "</div>"+
  "<div class='card'><h3>📖 逐段精讲：读懂这座“地下长城”</h3>"+
  "<div class='timeline'>"+
  "<div class='tl'><b>第1-2段 · 为什么会有地道战</b><br>1942到1944那几年，日军在冀中平原“大扫荡”，还修起封锁沟墙、“十里一碉，八里一堡”；为了粉碎“扫荡”，冀中人民在党的领导下创造了新的斗争方式——地道战。读到这里要记住：地道战是被“逼”出来的智慧。</div>"+
  "<div class='tl'><b>⭐ 第3段 · “简直是个奇迹”</b><br>横的竖的直的弯的，不计其数，家家相连、村村相通；敌人来扑空、走了照常种地，有时还打击敌人——先总写“奇”。</div>"+
  "<div class='tl'><b>第4段 · 式样多、功能全</b><br>式样一百多种；以任丘为例：挖在街道下面、四尺多高、顶离地面三四尺不妨碍种庄稼；大洞容百人、小洞住人拴牲口、气孔隐蔽还漏光——老太太都能在里面纺线！</div>"+
  "<div class='tl'><b>⭐ 第5段 · 出口与机关</b><br>出口开在隐蔽处、堆满荆棘；旁边挖陷坑插尖刀埋地雷；“迷惑洞”分不清死道活道；“孑口”一夫当关，万夫莫开。</div>"+
  "<div class='tl'><b>⭐ 第6段 · 防破坏的妙法</b><br>敌人火攻、水攻、毒气攻都用遍：洞口备土沙灭火；“孑口”装吊板挡毒气；地道连枯井暗沟排水——任敌人想出什么毒辣法子也不怕。</div>"+
  "<div class='tl'><b>⭐ 第7-8段 · 地上的“无线电”</b><br>民兵分片瞭望，发现敌情一声吆喝一个接一个传到指挥部（“无线电”）；地道里拉铁丝铜铃（“有线电”）——人民智慧无穷无尽。</div>"+
  "<div class='tl'><b>⭐ 第9段 · 高度评价（首尾呼应）</b><br>敌人“扫荡”被粉碎；冀中人民坚持了生产，还有力地打击了敌人——在我国抗日战争史上留下惊人的奇迹。与开头“简直是个奇迹”遥相呼应。</div>"+
  "</div></div>"+
  "<div class='card'><h3>✍️ 写法借鉴：课文怎么写，作文怎么用</h3>"+
  "<table class='ovtable'><thead><tr><th style='width:110px'>写法</th><th>课文里怎么用</th><th style='width:190px'>你的作文怎么用</th></tr></thead>"+
  "<tr><td><b>总分总+空间顺序</b></td><td>先总说“奇迹”，再按地道内→出口→联络的空间转换分说</td><td>介绍一个地方：先总述，再按参观顺序一处一处写</td></tr>"+
  "<tr><td><b>一一对应列举</b></td><td>火攻→土沙，毒气→吊板，水攻→枯井暗沟</td><td>写“问题与办法”用一一对应，条理立刻清楚</td></tr>"+
  "<tr><td><b>首尾呼应</b></td><td>开头“简直是个奇迹”，结尾“惊人的奇迹”</td><td>开头结尾扣同一个词，结构完整还升华主题</td></tr></table></div>"+
  "<div class='card'><h3>📚 课后习题·参考答案（据统编教材课后题整理）</h3>"+
  "<div class='acc open' onclick='this.classList.toggle(\"open\")'><button class='head'><span class='idx'>题1</span>地道战“奇”在哪里？<span class='arrow'>▸</span></button><div class='body'>📝 <b>答题模板：</b>分点列举（式样 / 功能 / 联系）。<br>✅ <b>参考答案：</b>①式样奇——一百多种，村的地道挖在街道下、村外挖在庄稼地下；②功能奇——能藏能打能防，大洞容百人，住三五天不成问题；③联系奇——家家相连、村村相通，敌人破坏一处，大家可以转移到别的村子。</div></div>"+
  "<div class='acc' onclick='this.classList.toggle(\"open\")'><button class='head'><span class='idx'>题2</span>敌人是怎样破坏地道的？冀中人民怎样对付？<span class='arrow'>▸</span></button><div class='body'>📝 <b>答题模板：</b>一一对应列表。<br>✅ <b>参考答案：</b>火攻→洞口备土和沙灭火；毒气攻→“孑口”装吊板挡住；水攻→地道连枯井暗沟，水从洞口进来就流走了；另外各村地道相通，还可以转移到旁的村子去。</div></div>"+
  "<div class='acc' onclick='this.classList.toggle(\"open\")'><button class='head'><span class='idx'>题3</span>“无线电”“有线电”为什么加引号？<span class='arrow'>▸</span></button><div class='body'>✅ <b>参考答案：</b>加引号表示特殊含义——它们并不是真正的无线电和有线电：“无线电”指人们发现敌情一个接一个吆喝传信，“有线电”指地道里用铁丝拉铜铃传信号。这两个词生动表现出人民的智慧。</div></div>"+
  "</div>"+
  "<div class='tipbox tip'>⚡ <b>本课速读方法：</b>带着问题读——先提问“地道口藏在哪？敌人破坏怎么办？”，边读边找答案。</div></div>";},
 yuanDi:function(L){return "<div class='tabpane show' data-tab='jiangjie'>"+
  "<div class='card' style='background:linear-gradient(135deg,#FDF3E3,#FFFDF8)'><h3>🚩 本课任务流（用具体事例“漫画”老师）</h3>"+
  "<div class='taskflow'>"+
  "<div class='tflow' onclick='showPack(\"yuanDi\")'>📋<br>审题资料包<small>先看 3 张卡再动笔</small></div>"+
  "<div class='tflow' onclick='document.getElementById(\"yuanDi-src\").scrollIntoView({behavior:\"smooth\"})'>📚<br>范文技法卡<small>三篇范文怎么写出“漫画感”</small></div>"+
  "<div class='tflow' onclick='openXilianbi(\"yuanDi\")'>✍️<br>写个开头<small>用画面感的句子引出老师</small></div>"+
  "<div class='tflow' onclick='switchTab(\"guoguan\")'>🎯<br>过关自测<small>5 道题检验</small></div>"+
  "</div>"+
  "<div style='margin-top:10px;text-align:right'><button class='srcbtn' id='jjModeBtn' onclick='toggleJjMode()'>🔄 切换为：复习模式</button></div></div>"+
  "<div class='card'><h3>📋 教材写作要求·逐句拆解</h3>"+
  "<p>本次习作是<b>写人的记叙文</b>，对象是<b>一位老师</b>。“漫画”不是画图，而是一种<b>写法</b>：像漫画家画画一样——<b>抓住最突出的特点，用夸张有趣的方式</b>把它表现出来。</p>"+
  "<div class='kv'><div><b>✍️ 写谁</b><br>一位让你印象深刻的老师（现在的或以前的都可以）。</div>"+
  "<div><b>🎯 写什么特点</b><br>只选<b>一个</b>最突出的：外貌、口头禅、习惯动作或性格。贪多嚼不烂，一个特点写透就是好文章。</div>"+
  "<div><b>🧩 怎么写</b><br>用一两件<b>具体事例</b>把特点撑起来；语言可以夸张、幽默，但<b>事实必须真实</b>。</div></div>"+
  "<div class='tipbox exam'>⚠️ 特别提醒：“漫画”是<b>善意的幽默</b>，不是丑化取笑。写成“批评大会”就跑题了——漫画的背后，藏着你对老师的喜爱。</div></div>"+
  "<div class='card'><h3>❓ 审题三问自检（动笔前先问自己）</h3>"+
  "<div class='kv'><div><b>Q1 · 写谁？</b><br>闭上眼能不能让同学一眼猜出是哪位老师？猜得出，说明特点抓准了。</div>"+
  "<div><b>Q2 · 写什么特点？</b><br>这个特点是不是他/她身上最突出的？还是所有老师都有的“通用款”？</div>"+
  "<div><b>Q3 · 凭什么？</b><br>有事例证明吗？事例和特点对得上吗？（写“幽默”却举严厉的例子＝跑题）</div></div></div>"+
  "<div class='card'><h3>📊 评分自查表（老师就按这个给分）</h3>"+
  "<table class='ovtable'><thead><tr><th style='width:110px'>评分点</th><th>自查标准</th></tr></thead>"+
  "<tr><td><b>切题</b></td><td>写的是老师，且有“漫画感”——特点鲜明+语言有趣</td></tr>"+
  "<tr><td><b>特点</b></td><td>集中写一个最突出的特点，不东一榔头西一棒子</td></tr>"+
  "<tr><td><b>事例</b></td><td>至少一件典型事例，有动作、语言、神态等细节</td></tr>"+
  "<tr><td><b>语言</b></td><td>夸张有趣不失真，读着让人想笑或想点头</td></tr>"+
  "<tr><td><b>感情</b></td><td>喜爱或敬佩之情自然流露，不说空话</td></tr></table></div>"+
  "<div class='card' id='yuanDi-src'><h3>📚 范文技法卡：三招写出“漫画感”</h3>"+
  "<div class='readtext'>"+
  "<div style='margin:8px 0;padding:10px 14px;background:rgba(255,248,239,.6);border-radius:12px;line-height:1.9'><b>第一招 · 特点切入，两三笔立起人</b><br>外貌只挑最突出的一处：“王老师的眼睛会‘说话’：一瞪，吵闹的教室立刻安静；一弯，我们又敢举手了。”再配一句“头发硬得像刷子”——人就站出来了。</div>"+
  "<button class='srcbtn' onclick='showCard(\"yuanDi1\")'>📖 拆范文 · 《我的“段子手”老师》怎么写幽默</button>"+
  "<div style='margin:8px 0;padding:10px 14px;background:rgba(255,248,239,.6);border-radius:12px;line-height:1.9'><b>第二招 · 典型事例撑特点</b><br>详写一件：起因→经过→结果，穿插动作、语言、神态；可再配一件略写的小事例，一严一暖、对比生情。</div>"+
  "<button class='srcbtn' onclick='showCard(\"yuanDi2\")'>📖 拆范文 · 《“三不”李老师》一严一暖</button>"+
  "<div style='margin:8px 0;padding:10px 14px;background:rgba(255,248,239,.6);border-radius:12px;line-height:1.9'><b>第三招 · 夸张幽默不失真，感情藏结尾</b><br>“三不”排比、错题“通缉令”都是放大的特点——事实必须真实；结尾点情：“严厉也是爱”，漫画的背后藏着喜爱。</div>"+
  "<button class='srcbtn' onclick='showCard(\"yuanDi3\")'>📖 拆范文 · 《温柔的“大朋友”》温柔的力量</button>"+
  "</div></div>"+
  "<div class='card'><h3>✍️ 写个开头：用一个画面感的句子引出你的老师</h3>"+
  "<p style='font-size:13.5px;color:var(--muted)'>想一想：老师最突出的特点是什么？从外貌、口头禅或一个场景切入，一句话把读者“画”进去（30~50 字即可）。</p>"+
  "<textarea id='xilianbi-yuanDi' class='xltextarea' rows='4' placeholder='写在这里，点保存会自动记住…'></textarea>"+
  "<div style='margin-top:8px;display:flex;gap:10px;align-items:center'><button class='tflow' style='max-width:180px' onclick='saveXilianbi(\"yuanDi\")'>💾 保存</button><span id='xlsave-yuanDi' style='font-size:12.5px;color:#3C9E5C;font-weight:700'></span></div></div>"+
  "<div class='tipbox tip'>📌 本页要点：审题三问——写谁、写什么特点、凭什么。点“🖋️ 写作支架”，手把手教你搭结构、升格语言。</div></div>";}
 ,bailu:function(L){return "<div class='tabpane show' data-tab='jiangjie'>"+

  "<p style='margin:6px 0'><span style='display:inline-block;background:#F1EBDD;border-radius:6px;padding:0 6px;font-size:12px;color:#7A6F5C;margin-right:6px'>1</span>我们家的后园有半亩空地。母亲说：“让它荒着怪可惜的，你们那么爱吃花生，就开辟出来种花生吧。”我们姐弟几个都很高兴，买种，翻地，播种，浇水，没过几个月，居然收获了。</p>"+
  "<button class='srcbtn' onclick='showCard(\"lh1\")'>📚 查资料 · “居然”里的科学：花生为什么藏在地里</button>"+
  "<p style='margin:6px 0'><span style='display:inline-block;background:#F1EBDD;border-radius:6px;padding:0 6px;font-size:12px;color:#7A6F5C;margin-right:6px'>2</span>母亲说：“今晚我们过一个收获节，请你们父亲也来尝尝我们的新花生，好不好？”母亲把花生做成了好几样食品，还吩咐就在后园的茅亭里过这个节。</p>"+
  "<p style='margin:6px 0'><span style='display:inline-block;background:#F1EBDD;border-radius:6px;padding:0 6px;font-size:12px;color:#7A6F5C;margin-right:6px'>3</span>那晚的天色不大好。可是父亲也来了，实在很难得。</p>"+
  "<p style='margin:6px 0'><span style='display:inline-block;background:#F1EBDD;border-radius:6px;padding:0 6px;font-size:12px;color:#7A6F5C;margin-right:6px'>4</span>父亲说：“你们爱吃花生吗？”我们争着答应：“爱！”</p>"+
  "<p style='margin:6px 0'><span style='display:inline-block;background:#F1EBDD;border-radius:6px;padding:0 6px;font-size:12px;color:#7A6F5C;margin-right:6px'>5</span>“谁能把花生的好处说出来？”</p>"+
  "<p style='margin:6px 0'><span style='display:inline-block;background:#F1EBDD;border-radius:6px;padding:0 6px;font-size:12px;color:#7A6F5C;margin-right:6px'>6</span>姐姐说：“花生的味道很美。”</p>"+
  "<p style='margin:6px 0'><span style='display:inline-block;background:#F1EBDD;border-radius:6px;padding:0 6px;font-size:12px;color:#7A6F5C;margin-right:6px'>7</span>哥哥说：“花生可以榨油。”</p>"+
  "<p style='margin:6px 0'><span style='display:inline-block;background:#F1EBDD;border-radius:6px;padding:0 6px;font-size:12px;color:#7A6F5C;margin-right:6px'>8</span>我说：“花生的价钱便宜，谁都可以买来吃，都喜欢吃。这就是它的好处。”</p>"+
  "<p style='margin:6px 0'><span style='display:inline-block;background:#F1EBDD;border-radius:6px;padding:0 6px;font-size:12px;color:#7A6F5C;margin-right:6px'>9</span>父亲说：“花生的好处很多，有一样最可贵：它的果实埋在地里，不像桃子、石榴、苹果那样，把鲜红嫩绿的果实高高地挂在枝头上，使人一见就生爱慕之心。你们看它矮矮地长在地上，等到成熟了，也不能立刻分辨出来它有没有果实，必须挖起来才知道。”</p>"+

  "<p style='margin:6px 0'><span style='display:inline-block;background:#F1EBDD;border-radius:6px;padding:0 6px;font-size:12px;color:#7A6F5C;margin-right:6px'>11</span>父亲接下去说：“所以你们要像花生，它虽然不好看，可是很有用。”</p>"+
  "<p style='margin:6px 0'><span style='display:inline-block;background:#F1EBDD;border-radius:6px;padding:0 6px;font-size:12px;color:#7A6F5C;margin-right:6px'>12</span>我说：“那么，人要做有用的人，不要做只讲体面，而对别人没有好处的人。”</p>"+

  "<div class='card'><h3>📖 逐段精讲：一场花生谈话的来龙去脉</h3>"+
  "<div class='timeline'>"+
  "<div class='tl'><b>第1段 · 种花生</b><br>姐弟几个买种、翻地、播种、浇水，没过几个月<b>居然</b>收获了。注意“居然”——第一次种花生，没想到真成了，一个词写尽惊喜。</div>"+
  "<div class='tl'><b>第2-4段 · 尝花生</b><br>母亲提议过“收获节”，把花生做成好几样食品。节日和请父亲来，都为下文“议花生”做好了铺垫。</div>"+
  "<div class='tl'><b>第5-8段 · 议花生（上）</b><br>一家人说花生的好处：味美、可以榨油、价钱便宜——你一言我一语，都只说到“有用”。</div>"+
  "<div class='tl'><b>⭐ 第9段 · 议花生（下）</b><br>父亲发问“谁能把花生的好处说出来？”随后把花生与桃子、石榴、苹果对比：<b>“它的果实埋在地里……必须挖起来才知道。”</b>——借物发言，道理呼之欲出。</div>"+
  "<div class='tl'><b>⭐ 第11-12段 · 点题</b><br>父亲说：“人要做有用的人，不要做只讲体面，而对别人没有好处的人。”这句话“深深地印在我的心里”——全文中心句，也是我们要背的话。</div>"+
  "<div class='tl'><b>写法小结</b><br>①对话推动情节，自然亲切；②详略得当：议花生详写，种、收略写；③借物喻人：花生→做人的道理。</div>"+
  "</div></div>"+
  "<div class='card'><h3>🔍 精读深挖：一场花生谈话的三层深意</h3>"+
  "<div class='timeline'>"+
  "<div class='tl' id='lh-tl-1'><b>⭐ 第1段 · 种花生：一个“居然”写尽惊喜</b>"+
  "<div class='jl-yuan'><span class='jl-lab'>原句</span>我们姐弟几个都很高兴，买种，翻地，播种，浇水，没过几个月，居然收获了。</div>"+
  "<div class='jl-ask'>❓ 先想一想：把“居然收获了”换成“就收获了”，意思一样吗？</div>"+
  "<ul class='jl-ju'><li><b>“居然”＝没想到</b>——第一次种花生，姐弟几个本没抱多大指望，没想到真收获了。</li>"+
  "<li><b>惊喜为下文铺路</b>——正因为收获是惊喜，母亲才提议过收获节，一家人才能围坐“议花生”。</li>"+
  "<li><b>八个字一组</b>——“买种，翻地，播种，浇水”连用四个短词，劳动的利落劲儿全出来了，但一笔带过——<b>略写</b>。</li></ul>"+
  "<div class='jl-take'>💡 一句话：“居然”藏着惊喜，也悄悄决定了详略：种、收、尝都略写，好把笔墨留给“议花生”。</div>"+
  "<div class='jl-kao'>📝 考法：<b>词语品析</b>——“居然”表达<b>出乎意料的惊喜</b>；<b>详略判断</b>——种、收、尝略写，议花生详写（高频）。</div></div>"+
  "<div class='tl' id='lh-tl-2'><b>⭐ 第9段 · 父亲的话：把花生摆上对比台</b>"+
  "<div class='jl-yuan'><span class='jl-lab'>原句</span>花生的好处很多，有一样最可贵：它的果实埋在地里，不像桃子、石榴、苹果那样，把鲜红嫩绿的果实高高地挂在枝头上，使人一见就生爱慕之心。你们看它矮矮地长在地上，等到成熟了，也不能立刻分辨出来它有没有果实，必须挖起来才知道。</div>"+
  "<div class='jl-ask'>❓ 先想一想：姐姐说味美、哥哥说榨油、“我”说便宜——父亲为什么说这些都不是“最可贵”的？</div>"+
  "<ul class='jl-ju'><li><b>前面说的都对，但只在说“用处”</b>——父亲要往下挖一层：花生的可贵在<b>品性</b>。</li>"+
  "<li><b>一组对比</b>——桃子石榴苹果：果实高高挂起，引人爱慕；花生：矮矮地埋在地里，必须挖起来才知道。</li>"+
  "<li><b>比出的是做人</b>——不图外表好看、默默奉献，这正是父亲想教给孩子们的道理。</li></ul>"+
  "<div class='jl-take'>💡 一句话：拿花生和桃子石榴苹果一比，花生“不好看可是很有用”的品性就立起来了——为借物喻人搭好了台阶。</div>"+
  "<div class='jl-kao'>📝 考法：<b>对比的作用</b>——答“突出花生朴实无华、默默奉献的可贵”；<b>课后题</b>——花生和桃子石榴苹果“蕴涵的意思”有什么不同。</div></div>"+
  "<div class='tl' id='lh-tl-3'><b>⭐ 第11-12段 · 点题：从花生到做人</b>"+
  "<div class='jl-yuan'><span class='jl-lab'>原句</span>父亲接下去说：“所以你们要像花生，它虽然不好看，可是很有用。”我说：“那么，人要做有用的人，不要做只讲体面，而对别人没有好处的人。”</div>"+
  "<div class='jl-ask'>❓ 先想一想：“我”说这句话时用了“那么”两个字——他在做什么？</div>"+
  "<ul class='jl-ju'><li><b>“那么”是接过话头</b>——父亲从花生讲到人，“我”立刻由物及人，把道理说破：借物喻人水到渠成。</li>"+
  "<li><b>“体面”≠“好看”</b>——体面指外表光鲜、气派；父亲不是否定好看，是反对<b>只讲</b>体面、却没有真本事。</li>"+
  "<li><b>“有用的人”</b>——对别人有好处的人：像花生一样，把价值藏在朴实的外表之下。</li></ul>"+
  "<div class='jl-take'>💡 一句话：花生是物，做人是理——借物喻人，一句话“深深地印在我的心上”，也印在考卷上。</div>"+
  "<div class='jl-kao'>📝 考法：<b>中心句默写</b>——“人要做有用的人，不要做只讲体面，而对别人没有好处的人”（一字不能错）；<b>写法判断</b>——借物喻人。</div></div>"+
  "</div></div>"+
  "<div class='card'><h3>✍️ 写法借鉴：课文怎么写，作文怎么用</h3>"+
  "<table class='ovtable'><thead><tr><th style='width:110px'>写法</th><th>课文里怎么用</th><th style='width:190px'>你的作文怎么用</th></tr></thead>"+

  "<div class='card'><h3>📚 课后习题·参考答案（据统编教材课后题整理）</h3>"+
  "<div class='acc open' onclick='this.classList.toggle(\"open\")'><button class='head'><span class='idx'>题1</span>分角色朗读课文，体会对话中不同人物的语气<span class='arrow'>▸</span></button><div class='body'>💡 <b>提示：</b>姐弟俩抢着说，读出活泼；“我”最后总结，读出认真坚定；父亲的话语重心长，读得沉稳有力。</div></div>"+

  "<div class='card'><h3>👤 作者与背景：许地山</h3>"+
  "<div class='kv'><div><b>👤 作者小传</b><br>许地山（1894—1941），出生于台湾台南，现代小说家、散文家、学者，“文学研究会”发起人之一。</div>"+
  "<div><b>🖋️ 写作背景</b><br>《落花生》写于1922年（收入散文集《空山灵雨》），是他回忆童年生活的散文。文中那位借花生教育孩子的父亲，正是他的父亲、台湾著名爱国诗人许南英。</div></div>"+
  "<div class='tipbox story'>📖 许地山后来给自己取笔名“<b>落华生</b>”（华，同“花”），用一生提醒自己：像花生一样朴实无华、默默奉献。文章里的道理，他用了一辈子。</div>"+

  "<div class='tl'><b>1894年</b><br>出生于台湾台南。甲午战争后，父亲许南英不愿做亡国奴，举家迁回大陆。</div>"+
  "<div class='tl'><b>1921年</b><br>与郑振铎、茅盾等人发起成立“文学研究会”，主张文学要为人生。</div>"+
  "<div class='tl'><b>1922年（与课文相关）</b><br>写下散文《落花生》，回忆童年那段花生谈话；后收入散文集《空山灵雨》。</div>"+

  "<p style='margin:6px 0'><span style='display:inline-block;background:#F1EBDD;border-radius:6px;padding:0 6px;font-size:12px;color:#7A6F5C;margin-right:6px'>1</span>中秋节前后，正是故乡桂花盛开的季节。</p>"+
  "<p style='margin:6px 0'><span style='display:inline-block;background:#F1EBDD;border-radius:6px;padding:0 6px;font-size:12px;color:#7A6F5C;margin-right:6px'>2</span>小时候，我无论对什么花，都不懂得欣赏。父亲总是指指点点地告诉我，这是梅花，那是木兰花……但我除了记些名字外，并不喜欢。我喜欢的是桂花。桂花树的样子笨笨的，不像梅树那样有姿态。不开花时，只见到满树的叶子；开花时，仔细地在树丛里寻找，才能看到那些小花。可是桂花的香气，太迷人了。</p>"+

  "<div class='card' id='yuan1Di-src'><h3>📚 范文技法卡：三招写好“心爱之物”</h3>"+
  "<div class='readtext'>"+
  "<div style='margin:8px 0;padding:10px 14px;background:rgba(255,248,239,.6);border-radius:12px;line-height:1.9'><b>第一招 · 开头点“最爱”</b><br>开门见山或设个小悬念：“我的宝贝谁也不许碰——连妈妈大扫除，都要先问过我。”或“有人爱遥控赛车，有人爱瓷猫，而我最爱的，是那串会唱歌的风铃。”</div>"+

  "</div></div>"+

  ,hailibu:function(L){return "<div class='tabpane show' data-tab='jiangjie'>"+

  "<p style='font-size:13px;color:var(--muted)'>这篇课文必须背诵的内容都在这一页——一项一项过关，考试填空题就不丢分。</p>"+

  "</table></div>"+
  "<div class='card'><h3>🎯 精读段落速查（先抓这几段！）</h3>"+
  "<table class='ovtable'><thead><tr><th style='width:150px'>精读段落</th><th>重点是什么</th><th style='width:150px'>常考怎么考</th></tr></thead>"+
  "<tr><td><b>⭐ 救蛇得宝石</b><br>（第2-6段）</td><td>全篇的“开关”：宝石＝能听懂动物说话，<b>禁忌＝说出来就变石头</b>。没有这个条件，后面的牺牲就不成立。复述时“只能自己知道”这个细节不能丢。</td><td>情节排序、复述要点</td></tr>"+

  "<tr><td><b>⭐ 说实话变石头</b><br>（第9-10段）</td><td>全文高潮：“原原本本照实说了”说明毫无保留。海力布<b>舍己为人</b>的品质全靠这段立起来——人物评价题的答案就在这里。</td><td>人物品质、主旨感悟</td></tr></table>"+

  "<div id='jichuAnchor'></div>"+
  "<div class='card'><h3>🏹 读懂课文：六步走完这个感人的传说</h3>"+
  "<div class='tipbox exam'>📝 <b>一课一背（考试标准答案）</b><br>主要内容：猎人海力布救了龙王的女儿，得到能听懂动物说话的宝石；为救乡亲说出鸟儿的秘密，自己变成石头。<br>中心思想：赞扬海力布<b>热心助人、舍己为人</b>的高尚品质。</div>"+
  "<div class='kv'><div><b>🧭 全文结构（情节链）</b><br>引子（第1段）→ 人设（第2段）→ 救蛇（第3段）→ 得宝石·禁忌（第4-6段）→ 听鸟语（第7段）→ 劝乡亲（第8段）→ 说实话变石头（第9段）→ 得救纪念（第10-11段）。</div></div>"+
  "<div class='kv'><div><b>💛 人物品质</b><br>平时热心助人（把猎物分给大家），关键时刻<b>舍己为人</b>——用生命换来大家的平安。</div>"+
  "<div><b>🎭 故事的张力</b><br>最揪心的矛盾：不说实话，乡亲们不走；说实话，自己变石头。海力布选择了牺牲——这是整个故事的精华。</div></div></div>"+
  "<div class='card'><h3>📄 课文原文（对照精讲用）</h3>"+
  "<p style='font-size:13px;color:var(--muted)'>依据统编教材，共 11 个自然段。民间故事，由甘珠尔扎布整理，选作课文时有改动。点击展开。</p>"+
  "<div class='acc' onclick='this.classList.toggle(\"open\")'><button class='head'><span class='idx'>原</span>展开课文全文（约1100字）<span class='arrow'>▸</span></button><div class='body'>"+
  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>1</span>在我国的一些地区，流传着一个动人的民间故事。</div>"+
  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>2</span>从前有一个猎人，名叫海力布。他热心帮助别人，每次打猎回来，总是把猎物分给大家，自己只留下很少的一份。大家都非常尊敬他。</div>"+
  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>3</span>有一天，海力布到深山去打猎，忽然听见天上有呼救声。他抬头一看，一只老鹰抓着一条小白蛇正从他头上方飞过。他急忙搭箭开弓，对准老鹰射去。老鹰受了伤，丢下小白蛇逃了。</div>"+
  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>4</span>海力布对小白蛇说：“可怜的小东西，快回家去吧！”小白蛇说：“敬爱的猎人，您是我的救命恩人，我要报答您。我是龙王的女儿，您跟我回去，我爸爸一定会好好酬谢谢您。我爸爸的宝库里有许多珍宝，您要什么都可以。如果您都不喜欢，可以要我爸爸含在嘴里的那颗宝石。只要嘴里含着那颗宝石，就能听懂各种动物说的话。”海力布想，珍宝我倒不在乎，能听懂动物的话，对一个猎人来说，实在是太好了。他问小白蛇：“真有这样一颗宝石吗？”小白蛇说：“真的。但是动物说什么话，您只能自己知道。如果对别人说了，您就会变成一块石头。”</div>"+
  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>5</span>海力布点点头，跟着小白蛇到了龙宫。老龙王对海力布十分感激，要重谢他，于是把他领进宝库，让他自己挑选珍宝，爱什么就拿什么。海力布什么珍宝也不要，他对龙王说：“如果您真想给我点儿东西作纪念，请把您嘴里含着的那颗宝石送给我吧。”龙王低头想了一会儿，就把嘴里含的宝石吐出来，送给了海力布。</div>"+
  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>6</span>海力布临走的时候，小白蛇跟了出来，再三叮嘱他说：“敬爱的猎人，您要记住，无论动物说了什么话，都不要对别人说。如果说了，您马上就会变成石头，永远不能复活了！”海力布谢过小白蛇，就回家了。</div>"+
  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>7</span>海力布有了这颗宝石，打猎方便极了。他把宝石含在嘴里，能听懂飞禽走兽的语言，能知道哪座山上有哪些动物。从此以后，他每次打猎回来，分给大家的猎物更多了。这样过了几年。有一天，他正在深山里打猎，忽然听见一群鸟在议论着什么。仔细一听，那只领头的鸟说：“咱们赶快飞到别处去吧！今天晚上，这里的大山要崩塌，大地要被洪水淹没，不知道要淹死多少人呢！”</div>"+
  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>8</span>海力布听到这个消息，大吃一惊。他急忙跑回家对大家说：“咱们赶快搬到别处去吧！这个地方不能住了！”大家听了感到很奇怪，住得好好的，为什么要搬家呢？尽管海力布焦急地催促大家，可是谁也不相信他。海力布急得掉下了眼泪，说：“我可以发誓，我说的话千真万确。相信我的话吧，赶快搬走！再晚就来不及了！”有个老人对海力布说：“海力布，你是我们的好邻居，我们知道你从来不说谎话。可是今天你让我们搬家，你总得说清楚哇。咱们在这山下住了好几代啦，老老小小这么多人，搬家可不容易呀！”</div>"+
  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>9</span>海力布知道着急也没有用，不把为什么要搬家说清楚，大家是不会相信的。再一迟延，灾难就要夺去乡亲们的生命。要救乡亲们，只有牺牲自己。他想到这里，就镇定地对大家说：“今天晚上，这里的大山要崩塌，洪水要淹没大地。你们看，鸟都飞走了。”接着，他就把怎么得到宝石，怎么听见一群鸟议论避难，以及为什么不能把听来的消息告诉别人，都原原本本照实说了。海力布刚说完，就变成了一块僵硬的石头。</div>"+
  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>10</span>大家看见海力布变成了石头，都非常后悔，非常悲痛。他们含着眼泪，念着海力布的名字，扶着老人，领着孩子，赶着牛羊，往很远的地方走去。他们走在路上，忽然乌云密布，狂风怒号，接着就是倾盆大雨。半夜里，听见一声震天动地的巨响，大山崩塌了，地下涌出洪水，把他们住的村子淹没了。</div>"+
  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>11</span>人们世世代代纪念海力布。据说现在还能找到那块叫“海力布”的石头呢。</div>"+
  "</div></div>"+
  "</div>"+
  "<div class='card'><h3>📖 逐情节精讲·复述要点</h3>"+
  "<p style='font-size:14px;color:var(--muted)'>民间故事按情节走。每一站都标出了“复述不能丢的细节”和“可以加想象的地方”。</p>"+
  "<div class='timeline'>"+
  "<div class='tl'><b>① 人物出场 · 热心的猎人（第2段）</b><br>海力布“热心帮助别人”，把猎物分给大家，人人尊敬他。<b>复述要点：</b>先立人设，后面牺牲才感人。<b>可想象：</b>分猎物时大家说什么？</div>"+
  "<div class='tl'><b>② 救白蛇 · 善有善报（第3段）</b><br>救下龙王的宝贝女儿小白蛇；龙王要报恩，珍宝随便挑。</div>"+
  "<div class='tl'><b>⭐ ③ 得宝石 · 带条件的礼物（第4-5段）</b><br>海力布只含了嘴里的宝石，能听懂动物说话；<b>关键细节不能丢：</b>动物的话只能自己知道，对别人说了就会变成石头——这是后面一切情节的“开关”。</div>"+
  "<div class='tl'><b>④ 听鸟语 · 灾难将至（第7段）</b><br>飞鸟议论：当晚大山崩塌、洪水淹没大地，“别再往前飞了”。</div>"+
  "<div class='tl'><b>⭐ ⑤ 劝乡亲 · 最揪心的拉锯（第8段）</b><br>他急忙催大家搬家，乡亲们不信：“这么好的天，能有什么灾？”他急得掉泪。<b>可想象：</b>乡亲们的动作、表情，海力布的心理。</div>"+
  "<div class='tl'><b>⭐ ⑥ 说实话 · 牺牲的抉择（第9段）</b><br>他把灾难的原委<b>原原本本</b>说了一遍，刚说完就变成石头。<b>复述要点：</b>“原原本本”四个字，说明他毫无保留。</div>"+
  "<div class='tl'><b>⑦ 结尾 · 永远的纪念（第10-11段）</b><br>乡亲们含泪搬家得救，世代纪念海力布。<b>创造性示范：</b>换成乡亲的口吻讲——“直到今天，我们还记得那块石头……”</div>"+
  "</div></div>"+
  "<div class='card'><h3>✍️ 写法借鉴：课文怎么写，作文怎么用</h3>"+
  "<table class='ovtable'><thead><tr><th style='width:110px'>写法</th><th>课文里怎么用</th><th style='width:190px'>你的作文怎么用</th></tr></thead>"+
  "<tr><td><b>心理描写</b></td><td>“要救乡亲们，只有牺牲自己”——内心抉择见品质</td><td>写关键时刻先写“心里怎么想”，人物立刻立体</td></tr>"+
  "<tr><td><b>神奇设定</b></td><td>宝石能听懂动物说话——想象为情节服务</td><td>编故事先想好一个“神奇设定”，后面情节都靠它推动</td></tr>"+
  "<tr><td><b>动作连用</b></td><td>“扶着老人，领着孩子，赶着牛羊”——一连串动词写搬家</td><td>写忙碌场面连用动词，节奏一下就出来了</td></tr></table></div>"+
  "<div class='card'><h3>📚 课后习题·参考答案（据统编教材课后题整理）</h3>"+
  "<div class='acc open' onclick='this.classList.toggle(\"open\")'><button class='head'><span class='idx'>题1</span>默读课文，按故事发展顺序复述故事<span class='arrow'>▸</span></button><div class='body'>💡 <b>方法提示：</b>按情节链复述——救白蛇→得宝石（记住禁忌）→听鸟语→劝乡亲→说实话变石头→乡亲得救。哪些内容可以省略？次要对话和环境描写；哪些必须讲清？宝石的禁忌和“原原本本照实说了”。</div></div>"+
  "<div class='acc' onclick='this.classList.toggle(\"open\")'><button class='head'><span class='idx'>题2</span>以海力布或乡亲们的口吻，创造性地讲一讲“劝说乡亲”这一部分<span class='arrow'>▸</span></button><div class='body'>💡 <b>创造性示范（乡亲的口吻）：</b>“那天海力布急得直掉眼泪，一个劲儿催我们搬。我们心想：这好好的天，能有什么灾？他还发起了誓。老爷爷问他到底为啥，他这才咬咬牙，把宝石的事说了……”<b>要点：</b>加上乡亲们的心理和对话，故事立刻活起来。</div></div>"+
  "<div class='acc' onclick='this.classList.toggle(\"open\")'><button class='head'><span class='idx'>题3</span>结合本单元习作，缩写这个故事<span class='arrow'>▸</span></button><div class='body'>💡 <b>四步法：</b>摘录删减（留主干删细节）→ 概括（长话短说）→ 改写（对话变转述）→ 检查（完整连贯不改原意）。示范见“🌟 素材与积累”里的缩写范文。</div></div>"+
  "</div>"+
  "<div class='card'><h3>👤 作者与背景：一篇没有“作者”的名作</h3>"+
  "<div class='kv'><div><b>📚 课文来历</b><br>《猎人海力布》是流传在蒙古族人民中的民间故事，由甘珠尔扎布整理，选作课文时有改动。民间故事没有固定的作者——它的“作者”，是一代又一代讲故事的老百姓。</div>"+
  "<div><b>🖋️ 民间故事的特点</b><br>①口耳相传，人人会讲；②情节神奇（能听懂动物说话）；③善恶分明，寄托愿望（赞颂舍己为人的英雄）。</div></div>"+
  "<div class='tipbox fun'>🤔 草原上的传说：在今天的内蒙古，还留有一块“海力布石”，当地人一直记着这位舍己救人的英雄。故事为什么要编得这么“神奇”？因为“能听懂动物说话”这个想象，把“消息从哪来”讲通了，还让故事百听不厌。</div></div>"+
  "<div class='tipbox tip'>⚡ <b>本单元方法：</b>创造性复述——试着用<b>乡亲</b>的口吻讲这个故事：“我们怎么也不相信灾难要来了，直到海力布说出那个秘密……”</div></div>";}
 ,niulang1:function(L){return "<div class='tabpane show' data-tab='jiangjie'>"+
  "<div class='card' style='border:2px solid #D9C9A8'><h3>🧾 本课必背内容（考试就考这些，先逐项过关）</h3>"+

  "<tr><td><b>⭐ 第2-5段 · 老牛相伴</b></td><td>牛郎的善良都写在细节里：吃嫩草、喝净水、夏天树林休息、冬天山坡晒太阳、刷得干干净净——人设靠细节立起来，也是创造性复述“加想象”的好地方。</td><td>人物形象、结构分析</td></tr>"+
  "<tr><td><b>⭐ 第10-11段 · 老牛开口</b></td><td>民间故事的“神奇设定”就此展开：老牛竟会说话，指点他明天黄昏翻过山去湖边。复述时语气要讲得神秘。</td><td>民间故事的特点</td></tr>"+
