  "<div id='jichuAnchor'></div>"+
  "<div class='card'><h3>🐂 读懂课文：苦孩子的好日子</h3>"+
  "<div class='tipbox exam'>📝 <b>一课一背（考试标准答案）</b><br>主要内容：牛郎从小受哥嫂虐待，与老牛相依为命；长大后哥嫂分家只给他老牛破车，他在山中安家；老牛开口指点，他在湖边结识了织女，结为夫妻。<br>中心思想：赞颂牛郎勤劳善良，织女心灵手巧、追求自由幸福的生活。</div>"+
  "<div class='kv'><div><b>🧭 全文结构（情节链）</b><br>身世凄苦（第1段）→ 照看老牛（第2-5段）→ 哥嫂分家（第6-9段）→ 老牛开口（第10-12段）→ 湖边结缘（第13-19段）→ 结为夫妻（第20-21段）。</div></div>"+
  "<div class='kv'><div><b>👦 牛郎</b><br>勤劳善良，连一头老牛都照顾得无微不至——善良是他获得幸福的根源。</div>"+
  "<div><b>👧 织女</b><br>心灵手巧、向往自由。天上再好，也没有人间的自由和真情可贵。</div>"+
  "<div><b>🐂 老牛</b><br>知恩图报的神牛，是推动故事发展的关键角色。</div></div></div>"+
  "<div class='card'><h3>📄 课文原文（对照精讲用）</h3>"+
  "<p style='font-size:13px;color:var(--muted)'>依据统编教材，共 21 个自然段。民间故事，由叶圣陶整理，选作课文时有改动。点击展开。</p>"+
  "<div class='acc' onclick='this.classList.toggle(\"open\")'><button class='head'><span class='idx'>原</span>展开课文全文（约1400字）<span class='arrow'>▸</span></button><div class='body'>"+
  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>1</span>古时候有个孩子，爹妈都死了，跟着哥哥嫂子过日子。哥哥嫂子待他很不好，叫他吃剩饭，穿破衣裳，夜里在牛棚里睡。牛棚里没床铺，他就睡在干草上。他每天放牛。那头牛跟他很亲密，用温和的眼睛看着他，有时候还伸出舌头舔舔他的手，怪有意思的。哥哥嫂子见他总是爱理不理的，仿佛他一在眼前，就满身不舒服。两下一比较，他也乐得跟牛一块儿出去，一块儿睡。他没名字，人家见他放牛，就叫他牛郎。</div>"+
  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>2</span>牛郎照看那头牛挺周到。一来是牛跟他亲密；二来呢，他想，牛那样勤勤恳恳地干活，不好好照看它，怎么对得起它呢？他老是挑很好的草地，让牛吃又肥又嫩的青草；家里吃的干草，筛得一点儿土也没有。牛渴了，他就牵着它到小溪的上游，让它喝干净的水。夏天天气热，就在树林里休息；冬天天气冷，就在山坡上晒太阳。他把牛身上刷得干干净净，不让有一点儿草叶土粒。到夏天，一把蒲扇不离手，把成群乱转的牛虻都赶跑了。牛棚也打扫得干干净净。在干干净净的地方住，牛舒服，自己也舒服。</div>"+
  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>3</span>牛郎随口哼几支小曲儿，没人听他的，可是牛摇摇耳朵闭闭眼，好像听得挺有味儿。牛郎心里想什么，嘴里就说出来，没人听他的，可是牛咧开嘴，笑嘻嘻的，好像明白他的意思。</div>"+
  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>4</span>他常常把看见的听见的事告诉牛，有时候跟它商量一些事。牛好像全了解，虽然没说话，可是眉开眼笑的，他也就满意了。</div>"+
  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>5</span>自然，有时候他还觉得美中不足，要是牛能说话，把了解的和想说的都一五一十地说出来，那该多好呢。</div>"+
  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>6</span>一年一年过去，牛郎渐渐长大了。哥哥嫂子想独占父亲留下来的家产，把他看成眼中钉。</div>"+
  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>7</span>一天，哥哥把牛郎叫到跟前，装作很亲热的样子说：“你如今长大了，也该成家立业了。老人家留下一点儿家产，咱们分了吧。一头牛，一辆车，都归你；别的归我。”嫂子在旁边，三分像笑七分像发狠，说：“我们挑顶有用的东西给你，你知道吗？你要知道好歹，赶紧离开这儿！”</div>"+
  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>8</span>牛郎听哥哥嫂子这么说，就牵着老牛，拉着破车，头也不回，一直往前走，走出村子，走过树林，走到山里。从那以后，他白天上山打柴，柴装满一车，就让老牛拉着，到集市上去换粮食；夜晚就让老牛在车旁边休息，自己睡在车上。过了些日子，他在山前边盖了一间草房，又在草房旁边开辟了一块地，种些庄稼，这就算安了家。</div>"+
  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>9</span>一天晚上，他走进草房，忽然听见一声“牛郎”，他从没听见过这个声音。是谁叫他呢？回头一看，微弱的星光下，老牛嘴一张一合的，正在说话。老牛真会说话了！牛郎并不觉得奇怪，像是习惯了它说话似的，就转过身子去听。</div>"+
  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>10</span>老牛说：“明天黄昏时候，你翻过右边那座山，山那边是一片树林，树林前边是个湖，那时候会有些仙女在湖里洗澡。她们的衣裳放在草地上，你要捡起那件粉红色的纱衣，跑到树林里等着，跟你要衣裳的那个仙女就是你的妻子。这个好机会你可别错过了。”</div>"+
  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>11</span>“知道了。”牛郎高兴地回答。</div>"+
  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>12</span>第二天黄昏时候，牛郎翻过右边的那座山，穿过树林，走到湖边。湖面映着晚霞的余光，蓝紫色的波纹晃晃荡荡。他听见有女子的笑声，顺着声音看，果然有好些个女子在湖里洗澡。他沿着湖边走，没几步，就看见草地上放着好些衣裳，花花绿绿的，件件都那么漂亮。里头果然有一件粉红色的纱衣，他就拿起来，转身走进树林。</div>"+
  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>13</span>他静静地听着，一会儿，传来女子们上岸的声音，听见一个说：“不早了，咱们赶紧回去吧！”过了一会儿，又听见另一个说：“怎么，你们都走啦？难得来一趟，自由自在地洗个澡，也不多玩一会儿——哎呀！我的衣裳哪儿去了？谁瞧见我的衣裳啦？”</div>"+
  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>14</span>牛郎听到这儿，从树林里走出来，双手托着纱衣，说：“姑娘，别着急，你的衣裳在这儿。”</div>"+
  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>15</span>姑娘穿上衣裳，一边梳她长长的黑头发，一边跟牛郎谈话。牛郎把自己的情形一五一十地说了。姑娘听得出了神，又同情他，又爱惜他，就把自己的情形也告诉了他。</div>"+
  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>16</span>原来姑娘是天上王母娘娘的外孙女，织得一手好彩锦，名字叫织女。天天早晨和傍晚，王母娘娘拿她织的彩锦装饰天空，那就是灿烂的云霞，什么东西也没它美丽。王母娘娘需要的彩锦多，就叫织女成天成夜地织，一会儿也不许休息。织女身子老在机房里，手老在梭子上，劳累不用说，自由也没有了，等于关在监狱里，实在难受。</div>"+
  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>17</span>她常常想，人人说天上好，天上好，天上有什么好呢？没有自由，又看不见什么。她总想离开天上，到人间去，哪怕是一天半天呢，也可以见识见识人间的景物。她把这个想法跟别的仙女说了。别的仙女也都说早有这种想法。</div>"+
  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>18</span>那天下午，王母娘娘喝千年酿的葡萄酒，多喝了点儿，靠在宝座上直打瞌睡，看样子不见得马上就醒。仙女们见机会难得，就你拉我、我拉你地溜出来，一齐飞到人间。她们飞到湖边，看见湖水清得可爱，就跳下去洗澡。织女关在机房里太久了，现在能够在湖水里无拘无束地游泳，心里真痛快，想多玩一会儿，没想到就落在了后边。</div>"+
  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>19</span>牛郎听完织女的话，就说：“姑娘，既然天上没什么好，你就不用回去了。你能干活，我也能干活，咱们两个结了婚，一块儿在人间过一辈子吧。”</div>"+
  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>20</span>织女想了想，说：“你说得很对，咱们结婚，一块儿过日子吧。”</div>"+
  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>21</span>他们俩手拉着手，穿过树林，翻过山头，回到草房。牛郎把老牛指给织女看，说它就是从小到大相依为命的伴儿。织女拍拍老牛的脖子，用腮帮挨挨它的耳朵，算是跟它行见面礼。老牛眉开眼笑地朝她看，仿佛说：“正是这个新娘子。”</div>"+
  "</div></div>"+
  "</div>"+
  "<div class='card'><h3>📖 逐情节精讲·复述要点</h3>"+
  "<div class='timeline'>"+
  "<div class='tl'><b>① 身世凄苦 · 对比铺垫（第1段）</b><br>爹娘去世，哥嫂让他吃剩饭、穿破衣、睡牛棚；分家只分得老牛。<b>复述要点：</b>哥嫂的“狠”衬托牛郎的“忍”，为后文善良性格埋线。</div>"+
  "<div class='tl'><b>⭐ ② 老牛相伴 · 日久情深（第2-5段）</b><br>吃干净的草、喝干净的水，夏天树林休息、冬天晒太阳，把老牛身上刷得干干净净。<b>可想象：</b>牛郎对老牛说的悄悄话。</div>"+
  "<div class='tl'><b>③ 哥嫂分家（第6-9段）</b><br>哥嫂想独占家产，把牛郎看成“眼中钉”，只给他一头牛一辆车。<b>复述要点：</b>“眼中钉”写出哥嫂的贪财恶毒。</div>"+
  "<div class='tl'><b>⭐ ④ 老牛开口 · 神奇转折（第10-12段）</b><br>老牛竟说话了！指点他明天黄昏去湖边。<b>复述要点：</b>“老牛会说话”是民间故事的神奇设定，语气要讲得神秘些。</div>"+
  "<div class='tl'><b>⭐ ⑤ 湖边相遇 · 织女下凡（第13-19段）</b><br>织女是王母的外孙女，织得一手好彩锦，却总被关在天上没自由；她羡慕人间。<b>可想象：</b>两人的对话——牛郎的憨厚、织女的惊喜。</div>"+
  "<div class='tl'><b>⑥ 结为夫妻 · 男耕女织（第20-21段）</b><br>两人互相同情、结为夫妻。<b>复述要点：</b>“老牛眉开眼笑”收束，温馨又神奇。</div>"+
  "</div></div>"+
  "<div class='card'><h3>✍️ 写法借鉴：课文怎么写，作文怎么用</h3>"+
  "<table class='ovtable'><thead><tr><th style='width:110px'>写法</th><th>课文里怎么用</th><th style='width:190px'>你的作文怎么用</th></tr></thead>"+
  "<tr><td><b>总分总写“周到”</b></td><td>先总说“照看那头牛挺周到”，再分写吃、喝、住、夏、冬、刷身</td><td>写“我照顾小宠物”：先总说，再分几方面，条理清楚</td></tr>"+
  "<tr><td><b>细节立人设</b></td><td>善良不用说，全在照顾老牛的细节里</td><td>夸人不喊“他很善良”，写两件小事就够了</td></tr>"+
  "<tr><td><b>神奇设定</b></td><td>老牛会说话，推动整个故事</td><td>编故事设计一个“神奇伙伴”，情节跟着它走</td></tr></table></div>"+
  "<div class='card'><h3>📚 课后习题·参考答案（据统编教材课后题整理）</h3>"+
  "<div class='acc open' onclick='this.classList.toggle(\"open\")'><button class='head'><span class='idx'>题1</span>默读课文，说说牛郎和老牛是怎么相处的，他和织女是怎么认识的<span class='arrow'>▸</span></button><div class='body'>✅ <b>参考答案：</b>①相处：牛郎照看老牛挺周到——挑好草地吃嫩草、干草筛得没有土、喝上游的干净水、夏天树林休息冬天晒太阳、刷得干干净净、赶牛虻；还把心里话告诉老牛。②认识：老牛开口指点，牛郎按嘱咐到湖边拿起粉红色纱衣，认识了织女；牛郎说了自己的遭遇，织女很同情，又见他勤劳善良，便留在人间做了他的妻子。</div></div>"+
  "<div class='acc' onclick='this.classList.toggle(\"open\")'><button class='head'><span class='idx'>题2</span>课文中有些情节写得很简略，发挥想象把情节说得更具体<span class='arrow'>▸</span></button><div class='body'>💡 <b>创造性示范（牛郎织女初次见面）：</b>织女接过纱衣，看着眼前这个憨厚的年轻人，轻声问：“你为什么拿我的衣裳呀？”牛郎挠挠头，把老牛的话一五一十地说了。织女听着听着笑了：这个连一头牛都照顾得那么好的人，心肠一定很好……<b>要点：</b>想象要符合人物身份。</div></div>"+
  "<div class='acc' onclick='this.classList.toggle(\"open\")'><button class='head'><span class='idx'>题3</span>把《牛郎织女（一）》和（二）连起来，完整地讲这个故事<span class='arrow'>▸</span></button><div class='body'>💡 <b>复述路线：</b>身世凄苦→照看老牛→被赶出家→老牛指点→结为夫妻→（二）男耕女织→老牛留皮→王母抓人→披皮追赶→天河相隔→七夕相会。讲之前先列提纲，按提纲讲不丢情节。</div></div>"+
  "</div>"+
  "<div class='card'><h3>👤 作者与背景：整理者叶圣陶</h3>"+
  "<div class='kv'><div><b>👤 作者小传</b><br>叶圣陶（1894—1988），原名叶绍钧，江苏苏州人，现代著名作家、教育家。他编写的《开明国语课本》影响深远，新中国成立后又主持了教材编写工作。</div>"+
  "<div><b>🖋️ 与课文的关系</b><br>《牛郎织女》是流传千百年的民间传说。叶圣陶先生把它整理改编成通顺流畅的故事，收进课本——我们今天读到的完整版本就来自他。</div></div>"+
  "<div class='tipbox story'>📖 牛郎放牛、织女织布，正代表中国古代“男耕女织”的理想生活——传说的背后，是农耕社会人们对幸福的想象。</div>"+
  "<div class='acc' onclick='this.classList.toggle(\"open\")'><button class='head'><span class='idx'>年</span>生平年表（点击展开）<span class='arrow'>▸</span></button><div class='body'><div class='timeline'>"+
  "<div class='tl'><b>1894年</b><br>出生于江苏苏州，原名叶绍钧。</div>"+
  "<div class='tl'><b>1914年起</b><br>开始教书和创作，一生重视儿童教育。</div>"+
  "<div class='tl'><b>1921年</b><br>与茅盾、郑振铎等发起“文学研究会”。</div>"+
  "<div class='tl'><b>1923年</b><br>出版《稻草人》——中国现代童话的开山之作。</div>"+
  "<div class='tl'><b>1932年</b><br>编写《开明国语课本》，影响深远；新中国成立后主持教材编写（与课文相关）。</div>"+
  "<div class='tl'><b>1988年</b><br>逝世。他整理改编的《牛郎织女》被选入统编教材。</div>"+
  "</div></div></div>"+
  "<div class='tipbox tip'>⚡ <b>本单元方法：</b>创造性复述——试着把“牛郎与织女初次见面”讲具体：他们会说什么？发挥想象，但要符合人物身份。</div></div></div>";}
 ,niulang2:function(L){return "<div class='tabpane show' data-tab='jiangjie'>"+
  "<div class='card' style='border:2px solid #D9C9A8'><h3>🧾 本课必背内容（考试就考这些，先逐项过关）</h3>"+
  "<p style='font-size:13px;color:var(--muted)'>这篇课文必须背诵的内容都在这一页——一项一项过关，考试填空题就不丢分。</p>"+
  "<table class='ovtable'>"+
  "<tr><td><b>✅ 必背情节链</b></td><td><b>男耕女织的幸福生活 → 老牛临终留牛皮 → 王母抓走织女 → 牛郎披牛皮挑着儿女追赶 → 玉簪划出天河 → 七夕鹊桥相会</b>（排序题必考）</td></tr>"+

  "</table></div>"+
  "<div class='card'><h3>🎯 精读段落速查（先抓这几段！）</h3>"+
  "<table class='ovtable'><thead><tr><th style='width:150px'>精读段落</th><th>重点是什么</th><th style='width:150px'>常考怎么考</th></tr></thead>"+
  "<tr><td><b>⭐ 第2段 · 老牛留牛皮</b></td><td>临终嘱咐“碰见什么紧急事，你就披上我的皮”——民间故事“神奇设定，关键时刻必有用”。没有这段，牛郎追不上天。</td><td>情节作用、伏笔理解</td></tr>"+
  "<tr><td><b>⭐ 第4-5段 · 抓走·追赶·天河</b></td><td>全文最戏剧的一段：怒气冲冲抓走织女→披牛皮挑儿女飞上天→“我来了”“妈妈”→玉簪一划、天河相隔。必考的情节排序题就在这里；织女“心里恨极了”的情感也藏在这里。</td><td>情节排序、情感体会</td></tr>"+
  "<tr><td><b>⭐ 第7-8段 · 七夕相会</b></td><td>主旨落点：鹊桥相会寄托着对<b>自由幸福生活和团圆</b>的向往；“葡萄架下听悄悄话”是民间故事的浪漫想象。</td><td>主旨理解、文学常识</td></tr></table>"+
  "</div>"+
  "<div id='jichuAnchor'></div>"+
  "<div class='card'><h3>🌌 读懂课文：从幸福到天河相隔</h3>"+
  "<div class='tipbox exam'>📝 <b>一课一背（考试标准答案）</b><br>主要内容：牛郎织女男耕女织、生活美满；王母娘娘抓走织女，牛郎披上牛皮带儿女追赶，被天河隔开；一家人坚持抗争，终于每年七夕鹊桥相会。<br>中心思想：寄托着劳动人民<b>对自由幸福生活的向往</b>和对美好爱情的祝愿。</div>"+
  "<div class='kv'><div><b>🧭 全文结构（情节链）</b><br>男耕女织（第1段）→ 老牛留皮（第2段）→ 王母发誓抓人（第3段）→ 抓走织女（第4段）→ 披皮追赶·天河相隔（第5段）→ 牵牛织女星（第6段）→ 七夕相会（第7-8段）。</div></div>"+
  "<div class='tipbox exam'>📌 必考主旨：民间故事寄托着劳动人民<b>对自由幸福生活的向往</b>和对美好爱情的祝愿。王母娘娘代表阻挠幸福的旧势力，鹊桥相会代表人们对团圆的期盼。</div>"+
  "<div class='kv'><div><b>⭐ 四大民间故事</b><br>《牛郎织女》《孟姜女》《梁山伯与祝英台》《白蛇传》——常考填空，记住口诀：“牛孟梁白”。</div>"+
  "<div><b>🕊️ 喜鹊的角色</b><br>喜鹊在传说中是报喜的吉祥鸟。万鹊搭桥，象征善意的力量最终成全了亲情与爱情。</div></div></div>"+
  "<div class='card'><h3>📄 课文原文（对照精讲用）</h3>"+
  "<p style='font-size:13px;color:var(--muted)'>依据统编教材，共 8 个自然段。民间故事，由叶圣陶整理，选作课文时有改动。点击展开。</p>"+
  "<div class='acc' onclick='this.classList.toggle(\"open\")'><button class='head'><span class='idx'>原</span>展开课文全文（约1100字）<span class='arrow'>▸</span></button><div class='body'>"+
  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>1</span>从此牛郎在地里耕种，织女在家里纺织。有时候，织女也帮助牛郎干些地里的活。两个人勤劳节俭，日子过得挺美满。转眼间两三个年头过去了，他们生了一个男孩，一个女孩。到孩子能说话的时候，晚上得空，织女就指着星星，给孩子们讲些天上的故事。天上虽然富丽堂皇，可是没有自由，她不喜欢。她喜欢人间的生活：跟牛郎一块儿干活，她喜欢；逗着兄妹俩玩，她喜欢；看门前小溪的水活泼地流过去，她喜欢；听晓风晚风轻轻地吹过树林，她喜欢。两个孩子听她这么说，就偎在她怀里，叫一声“妈妈”，回过头来又叫一声“爸爸”。她乐极了，可是有时候也发愁。愁什么呢？她没告诉牛郎。她是怕外祖母知道她在这儿会来找她。</div>"+
  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>2</span>一天，牛郎去喂牛，那头衰老的牛又说话了，眼眶里满是眼泪，说：“我快不行了，不能帮你们下地干活……我死以后，你把我的皮留着。碰见什么紧急事，你就披上我的……”老牛没说完就死了。夫妻两个痛哭了一场，留下老牛的皮，把老牛的尸骨埋在草房后边的山坡上。</div>"+
  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>3</span>再说天上，仙女们溜到人间洗澡的事到底让王母娘娘知道了。王母娘娘罚她们，把她们关在黑屋子里。她尤其恨织女，竟敢留在人间不回来，简直是有意败坏她的门风，损害她的尊严。她发誓要把织女捉回来，哪怕织女藏在泰山底下的石缝里，大海中心的珊瑚礁上，也一定要抓回来，给她顶厉害的惩罚。</div>"+
  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>4</span>王母娘娘派了好些天兵天将到人间察访，察访了好久，才知道织女在牛郎家里，跟牛郎做了夫妻。一天，她亲自到牛郎家里，可巧牛郎在地里干活，她就一把抓住织女往外走。织女的男孩见那老太婆怒气冲冲地拉着妈妈走，就跑过来拉住妈妈的衣裳。王母娘娘狠狠一推，孩子倒在地上，她就带着织女一齐飞起来。织女心里恨极了，望着两个可爱的儿女，一时说不出话来，只喊了一句：“快去找爸爸！”</div>"+
  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>5</span>牛郎跟着男孩赶回家，只见梭子放在织了半截的布匹上，灶上的饭正冒着热气，女孩坐在门前哭。他决定上天去追，把织女救回来。可是怎么能上天呢？他忽然想起老牛临死前说的话，这不正是紧急事吗？他赶紧披上牛皮，找出两个筐，一个筐里放一个孩子，挑起来就往外跑。一出屋门，他就飞起来了，耳边的风呼呼直响。飞了一会儿，望见妻子和老太婆了，他就喊“我来了”，两个孩子也连声叫“妈妈”。越飞越近，眼看要赶上了，王母娘娘拔下头上的玉簪往背后一划，糟了，牛郎的前边忽然出现一条天河。天河很宽，波浪很大，牛郎飞不过去了。</div>"+
  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>6</span>从此以后，牛郎在天河的这边，织女在天河的那边，只能远远地望着，不能住在一块儿了。他们就成了天河两边的牵牛星和织女星。</div>"+
  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>7</span>织女受了很厉害的惩罚，可是不肯死心，一定要跟牛郎一块儿过日子。日久天长，王母娘娘也拗不过她，就允许她每年农历七月七日跟牛郎会一次面。</div>"+
  "<div style='margin:7px 0'><span style='display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#F1EAE0;color:#8A7F6E;border-radius:6px;font-weight:700;font-size:12.5px;margin-right:7px'>8</span>每年的这一天，成群的喜鹊在天河上边搭起一座桥，让牛郎、织女在桥上会面。就因为这件事，每逢那一天，人们很少看见喜鹊，它们都往天河那儿搭桥去了。还有人说，那一天夜里，要是在葡萄架下边静静地听着，还可以听见牛郎、织女在桥上亲亲密密地说话呢。</div>"+
  "</div></div>"+
  "</div>"+
  "<div class='card'><h3>📖 逐情节精讲·复述要点</h3>"+
  "<div class='timeline'>"+
  "<div class='tl'><b>① 幸福生活 · 男耕女织（第1段）</b><br>牛郎织女生儿育女，日子美满。<b>复述要点：</b>先讲足“幸福”，后面的破碎才更让人心疼。排比句“……她喜欢”要读出织女的满足。</div>"+
  "<div class='tl'><b>⭐ ② 老牛留牛皮 · 伏笔（第2段）</b><br>老牛临终嘱咐：遇到紧急事披上它的牛皮。<b>复述要点：</b>民间故事的“神奇设定”，关键时刻必有用。省略号表示老牛话没说完，含着不舍。</div>"+
  "<div class='tl'><b>③ 王母发誓 · 抓走织女（第3-4段）</b><br>王母“怒气冲冲”“狠狠一推”——冷酷无情；织女“心里恨极了”，只喊“快去找爸爸”。<b>可想象：</b>孩子们哭喊的画面。</div>"+
  "<div class='tl'><b>⭐ ④ 牛郎追赶 · 最戏剧的一幕（第5段）</b><br>披牛皮、挑儿女、飞上天；眼看要追上——王母玉簪一划，波涛滚滚的天河出现。<b>复述要点：</b>“一划”动作要有画面感，可加慢镜头描写。</div>"+
  "<div class='tl'><b>⑤ 隔河相望 · 化作星星（第6段）</b><br>一家人只能远远相望，化作牵牛星和织女星——夜空里的星星，就是故事的见证。</div>"+
  "<div class='tl'><b>⭐ ⑥ 七夕鹊桥 · 圆满收束（第7-8段）</b><br>织女不肯死心，王母拗不过她，允许每年七夕相会；喜鹊搭桥，一年一度全家团聚——寄托人们对团圆的期盼。</div>"+
  "</div></div>"+
  "<div class='card'><h3>✍️ 写法借鉴：课文怎么写，作文怎么用</h3>"+
  "<table class='ovtable'><thead><tr><th style='width:110px'>写法</th><th>课文里怎么用</th><th style='width:190px'>你的作文怎么用</th></tr></thead>"+
  "<tr><td><b>伏笔照应</b></td><td>老牛留皮（第2段）→ 紧急时披上（第5段）</td><td>前文埋一个“小道具”，后文让它派上大用场</td></tr>"+
  "<tr><td><b>细节渲染人物</b></td><td>“怒气冲冲”“狠狠一推”写王母冷酷；“眼眶里满是眼泪”写老牛不舍</td><td>写人物别下结论，用一两个动作神态代替</td></tr>"+
  "<tr><td><b>想象寄托愿望</b></td><td>喜鹊搭桥——让好人有团圆的结局</td><td>编故事结尾：让美好的想象替你表达心愿</td></tr></table></div>"+
  "<div class='card'><h3>📚 课后习题·参考答案（据统编教材课后题整理）</h3>"+
  "<div class='acc open' onclick='this.classList.toggle(\"open\")'><button class='head'><span class='idx'>题1</span>默读课文，把《牛郎织女（一）》和（二）连起来，讲一讲完整的故事<span class='arrow'>▸</span></button><div class='body'>💡 <b>复述路线：</b>身世凄苦→照看老牛→哥嫂分家→老牛指点→结为夫妻→男耕女织→老牛留皮→王母抓人→披皮追赶→天河相隔→七夕相会。用上“后来”“有一天”“从此”这些连接词，故事更连贯。</div></div>"+
  "<div class='acc' onclick='this.classList.toggle(\"open\")'><button class='head'><span class='idx'>题2</span>故事中哪些地方让你感动？说说你的体会<span class='arrow'>▸</span></button><div class='body'>✅ <b>参考示例：</b>①牛郎披上牛皮挑着孩子追赶织女——亲情让他有了飞上天的勇气；②织女“心里恨极了”却只喊出“快去找爸爸”——心里装的全是孩子；③喜鹊搭桥——连喜鹊都被这份真情打动，美好的愿望终会实现。</div></div>"+
  "<div class='acc' onclick='this.classList.toggle(\"open\")'><button class='head'><span class='idx'>题3</span>连一连常识：四大民间故事与七夕节<span class='arrow'>▸</span></button><div class='body'>✅ <b>必背：</b>中国四大民间故事＝《牛郎织女》《孟姜女》《梁山伯与祝英台》《白蛇传》；七夕＝农历七月初七，源于牛郎织女鹊桥相会的传说，2006年列入首批国家级非物质文化遗产名录。</div></div>"+
  "</div>"+
  "<div class='card'><h3>👤 作者与背景：整理者叶圣陶</h3>"+
  "<div class='kv'><div><b>📚 课文来历</b><br>《牛郎织女（二）》同样是民间故事，由叶圣陶整理，选作课文时有改动。故事在各地流传的版本不太一样，但“鹊桥相会”这个寄托团圆的结局，谁也不肯改。</div>"+
  "<div><b>🖋️ 关于整理者</b><br>叶圣陶（1894—1988），现代著名作家、教育家，中国现代童话的开山之作《稻草人》就出自他手。生平年表详见《牛郎织女（一）》。</div></div>"+
  "<div class='tipbox fun'>🤔 你知道吗？夜空中真有“牛郎星”和“织女星”！它们隔着一条银河遥遥相对——古人抬头看星星，把星星编成了故事，这是中国人的浪漫。</div></div>"+
  "<div class='tipbox fun'>🤔 复述小妙招：讲到“天河相隔”时停一停，问听众“他们还能见面吗？”——设悬念，故事立刻吸引人。</div></div>";}
 ,yuan3Di:function(L){return "<div class='tabpane show' data-tab='jiangjie'>"+
  "<div class='card'><h3>📋 教材写作要求·逐句拆解</h3>"+
  "<p>本次习作是<b>故事新编</b>：选一个大家熟悉的故事，<b>重新编一编</b>——主人公不变，结局可以变、情节可以变，编出一个新故事来。教材以《龟兔赛跑》为例：先设想结局，再由果探因编情节，编完配上插图，贴在墙报上和同学分享。</p>"+
  "<div class='kv'><div><b>📖 选熟悉的故事</b><br>《龟兔赛跑》《狐假虎威》《坐井观天》《狐狸和乌鸦》……越熟悉越好编——情节记得牢，人物性格摸得清。</div>"+
  "<div><b>🎯 先定新结局</b><br>教材给了四种结局任你选：<b>乌龟和兔子都赢了／都没赢／兔子赢了／乌龟又赢了</b>。结局一定，故事的方向就定了。</div>"+
  "<div><b>🧩 由果探因编情节</b><br>问自己：什么原因让结局变了？教材给出五个方向——<b>路遇不测、急中出错、遇到诱惑、赛道变化、天气变化</b>。</div>"+
  "<div><b>🎨 配插图分享</b><br>编完给故事配上图画，贴在墙报上分享——这是本次习作的特别要求。</div></div>"+
  "<div class='tipbox exam'>⚠️ 特别提醒：<b>新编不是乱编</b>。人物的性格底色要保留（兔子知错就改、狐狸狡猾爱耍小聪明），情节要能支撑结局，不能“兔子莫名其妙就输了”。</div></div>"+
  "<div class='card'><h3>❓ 审题三问自检（动笔前先问自己）</h3>"+
  "<div class='kv'><div><b>Q1 · 给谁新编？</b><br>必须是<b>熟悉的</b>故事：原故事讲了什么、人物什么性格，都要心里有数。</div>"+
  "<div><b>Q2 · “新”在哪里？</b><br>结局要<b>打破原版</b>：原版乌龟赢，你可以让兔子赢、都赢、都没赢——但不能只改结局不改情节。</div>"+
  "<div><b>Q3 · 合理吗？</b><br>倒着问一遍：因为什么，才有了这个结局？把原因编成情节写出来，故事才站得住。</div></div></div>"+
  "<div class='card'><h3>📊 评分自查表（老师就按这个给分）</h3>"+
  "<table class='ovtable'><thead><tr><th style='width:110px'>评分点</th><th>自查标准</th></tr></thead>"+
  "<tr><td><b>结局新颖</b></td><td>打破了原版结局，让人眼前一亮</td></tr>"+
  "<tr><td><b>情节合理</b></td><td>由果探因——情节能支撑结局，不是硬凑的</td></tr>"+
  "<tr><td><b>人物一致</b></td><td>主人公没变，性格底色保留（骄傲的先骄傲，狡猾的还耍滑）</td></tr>"+
  "<tr><td><b>描写生动</b></td><td>有动作、语言、神态、心理描写，不是干巴巴的流水账</td></tr>"+
  "<tr><td><b>完整有趣</b></td><td>按起因、经过、结果写完整，读起来有意思</td></tr></table>"+
  "<div class='tipbox tip'>📌 本页要点：故事新编 = 熟悉的故事 + 新结局 + 由果探因的新情节。点“🖋️ 写作支架”，看四步法手把手教你编。</div></div></div>";}

 ,nuoman:function(L){return "<div class='tabpane show' data-tab='jiangjie'>"+
  "<div class='card' style='border:2px solid #D9C9A8'><h3>🧾 本课必背内容（考试就考这些，先逐项过关）</h3>"+
  "<p style='font-size:13px;color:var(--muted)'>这篇课文必须背诵的内容都在这一页——一项一项过关，考试填空题就不丢分。</p>"+
  "<table class='ovtable'>"+
  "<tr><td><b>✅ 必背情节链</b></td><td><b>雾海夜航 → 海难发生 → 组织救援 → 船长殉职</b>（考试爱考“按顺序排列故事情节”）</td></tr>"+
  "<tr><td><b>✅ 必背名句</b></td><td>“哪个男人胆敢抢在女人前面，你就开枪打死他。”——一句话让混乱的人群安静下来，写出船长的威严与果断</td></tr>"+
  "<tr><td><b>✅ 必背中心句</b></td><td>“他一生都要求自己忠于职守，履行做人之道。面对死亡，他又践行了一次英雄的壮举。”（结尾点题，理解题高频）</td></tr>"+
  "<tr><td><b>✅ 必背中心思想</b></td><td>赞颂哈尔威船长<b>忠于职守、临危不乱、舍己救人</b>的英雄品格</td></tr>"+
  "</table></div>"+
  "<div class='card'><h3>🎯 精读段落速查（先抓这几段！）</h3>"+
  "<table class='ovtable'><thead><tr><th style='width:150px'>精读段落</th><th>重点是什么</th><th style='width:150px'>常考怎么考</th></tr></thead>"+
  "<tr><td><b>⭐ 雾海夜航（开头）</b></td><td>“夜色正浓，薄雾弥漫”——环境描写不只是写景，它交代了事故发生的原因，为下文埋下伏笔。</td><td>环境描写的作用</td></tr>"+
  "<tr><td><b>⭐ 海难发生（高潮前奏）</b></td><td>“玛丽号”像幽灵般出现，船身被“剖开一个大窟窿”；人们“惊恐万状，一片混乱”。</td><td>比喻手法、场面描写、四字词语理解</td></tr>"+
  "<tr><td><b>⭐ 组织救援·船长殉职（高潮）</b></td><td>简短有力的对话、井然有序的救援；最后“犹如铁铸，纹丝不动”，随船沉入大海。</td><td>人物品质分析、结尾句理解</td></tr>"+
  "</table></div>"+
  "<div id='jichuAnchor'></div>"+
  "<div class='card'><h3>📖 读懂课文：一场海难，一位英雄</h3>"+
  "<div class='kv'><div><b>🌊 一场怎样的海难？</b><br>1870年3月17日夜，“诺曼底号”邮轮在英伦海峡被全速驶来的“玛丽号”撞出大窟窿，海水涌入，船即将沉没。</div>"+
  "<div><b>🧭 全文结构线</b><br>雾海夜航（1-4）→ 海难发生（5-10）→ 组织救援（11-24）→ 船长殉职（25-28）——“划分层次”考题照这个切。</div></div>"+
  "<div class='kv'><div><b>🧑‍✈️ 一位怎样的船长？</b><br>灾难面前，哈尔威船长临危不乱：命令“妇女先走，船员断后”，一定要救出60人；船上实际61人——他把自己给忘了。</div>"+
  "<div><b>🧠 一课一背（主要内容＋中心思想）</b><br>课文记叙了“诺曼底号”邮轮被撞失事、哈尔威船长镇定指挥救援、自己随船沉没的经过，赞颂了他<b>忠于职守、舍己救人</b>的伟大精神。</div></div></div>"+
  "<div class='card'><h3>📄 课文原文（点击展开，对照精讲读原文）</h3>"+
  "<div class='acc' onclick='this.classList.toggle(\"open\")'><button class='head'><span class='idx'>📄</span>全文28个自然段（维克多·雨果）<span class='arrow'>▸</span></button><div class='body'>"+
  "<p style='margin:6px 0'><span style='display:inline-block;background:#F1EBDD;border-radius:6px;padding:0 6px;font-size:12px;color:#7A6F5C;margin-right:6px'>1</span>1870年3月17日夜晚，哈尔威船长照例走着从南安普敦到格恩西岛这条航线。大海上夜色正浓，薄雾弥漫。船长站在舰桥上，小心翼翼地驾驶着他的“诺曼底”号。乘客们都进入了梦乡。</p>"+
  "<p style='margin:6px 0'><span style='display:inline-block;background:#F1EBDD;border-radius:6px;padding:0 6px;font-size:12px;color:#7A6F5C;margin-right:6px'>2</span>“诺曼底”号是一艘大轮船，在英伦海峡也许可以算得上是最漂亮的邮船之一了。它装货容量六百吨，船体长二百二十尺，宽二十五尺。海员们都说它很“年轻”，因为它才七岁，是1863年造的。</p>"+
  "<p style='margin:6px 0'><span style='display:inline-block;background:#F1EBDD;border-radius:6px;padding:0 6px;font-size:12px;color:#7A6F5C;margin-right:6px'>3</span>雾愈来愈浓了，轮船驶出南安普敦河后，来到茫茫大海上，相距埃居伊山脉估计有十五海里。轮船缓缓行驶着。这时大约凌晨四点钟。</p>"+
  "<p style='margin:6px 0'><span style='display:inline-block;background:#F1EBDD;border-radius:6px;padding:0 6px;font-size:12px;color:#7A6F5C;margin-right:6px'>4</span>周围一片漆黑，船桅的梢尖勉强可辨。像这类英国船，晚上出航是没有什么可怕的。</p>"+
  "<p style='margin:6px 0'><span style='display:inline-block;background:#F1EBDD;border-radius:6px;padding:0 6px;font-size:12px;color:#7A6F5C;margin-right:6px'>5</span>突然，沉沉夜雾中冒出一枚黑点，它好似一个幽灵，又仿佛像一座山峰。只见一个阴森森的往前翘起的船头，穿破黑暗，在一片浪花中飞驶过来。</p>"+
  "<p style='margin:6px 0'><span style='display:inline-block;background:#F1EBDD;border-radius:6px;padding:0 6px;font-size:12px;color:#7A6F5C;margin-right:6px'>6</span>那是“玛丽”号，一艘装有螺旋推进器的大轮船。它从敖德萨启航，船上载着五百吨小麦，行驶速度非常快，负重又特别大。它笔直地朝着“诺曼底”号逼了过来。</p>"+
  "<p style='margin:6px 0'><span style='display:inline-block;background:#F1EBDD;border-radius:6px;padding:0 6px;font-size:12px;color:#7A6F5C;margin-right:6px'>7</span>全速前进的“玛丽”号，向“诺曼底”号的侧舷撞过去，在它的船身上剖开一个大窟窿。由于这一猛撞，“玛丽”号自己也受了伤，终于停了下来。</p>"+
  "<p style='margin:6px 0'><span style='display:inline-block;background:#F1EBDD;border-radius:6px;padding:0 6px;font-size:12px;color:#7A6F5C;margin-right:6px'>8</span>“诺曼底”号上有二十八名船员，一名女服务员，三十一名乘客，其中十二名是妇女。</p>"+
  "<p style='margin:6px 0'><span style='display:inline-block;background:#F1EBDD;border-radius:6px;padding:0 6px;font-size:12px;color:#7A6F5C;margin-right:6px'>9</span>震荡可怕极了。一刹那间，男人、女人、小孩，所有的人都奔到甲板上，人们半裸着身子，奔跑着，尖叫着，哭泣着，惊恐万状，一片混乱。海水哗哗往里灌，汹涌湍急，势不可当。轮机火炉被海浪呛得嘶嘶地直喘粗气。</p>"+
  "<p style='margin:6px 0'><span style='display:inline-block;background:#F1EBDD;border-radius:6px;padding:0 6px;font-size:12px;color:#7A6F5C;margin-right:6px'>10</span>船上没有封舱用的防漏隔墙，救生圈也不够。</p>"+
  "<p style='margin:6px 0'><span style='display:inline-block;background:#F1EBDD;border-radius:6px;padding:0 6px;font-size:12px;color:#7A6F5C;margin-right:6px'>11</span>哈尔威船长，站在指挥台上，大声吼喝：“全体安静，注意听命令！把救生艇放下去。妇女先走，其他乘客跟上，船员断后。必须把六十人救出去。”</p>"+
  "<p style='margin:6px 0'><span style='display:inline-block;background:#F1EBDD;border-radius:6px;padding:0 6px;font-size:12px;color:#7A6F5C;margin-right:6px'>12</span>实际上船上一共有六十一人，但是他把自己给忘了。</p>"+
  "<p style='margin:6px 0'><span style='display:inline-block;background:#F1EBDD;border-radius:6px;padding:0 6px;font-size:12px;color:#7A6F5C;margin-right:6px'>13</span>船员赶紧解开救生艇的绳索。大家一窝蜂拥了上去，这股你推我搡的势头，险些儿把小艇都弄翻了。奥克勒福大副和三名工头拼命想维持秩序，但整个人群因为猝然而至的变故简直都像疯了似的，乱得不可开交。</p>"+
  "<p style='margin:6px 0'><span style='display:inline-block;background:#F1EBDD;border-radius:6px;padding:0 6px;font-size:12px;color:#7A6F5C;margin-right:6px'>14</span>几秒钟前大家还在酣睡，蓦地，而且，立时立刻，就要丧命，这怎么能不叫人失魂落魄！</p>"+
  "<p style='margin:6px 0'><span style='display:inline-block;background:#F1EBDD;border-radius:6px;padding:0 6px;font-size:12px;color:#7A6F5C;margin-right:6px'>15</span>就在这时，船长威严的声音压倒了一切呼号和嘈杂，黑暗中人们听到这一段简短有力的对话：</p>"+
  "<p style='margin:6px 0'><span style='display:inline-block;background:#F1EBDD;border-radius:6px;padding:0 6px;font-size:12px;color:#7A6F5C;margin-right:6px'>16</span>“洛克机械师在哪儿？”“船长叫我吗？”“炉子怎么样了？”“海水淹了。”“火呢？”“灭了。”“机器怎样？”“停了。”</p>"+
  "<p style='margin:6px 0'><span style='display:inline-block;background:#F1EBDD;border-radius:6px;padding:0 6px;font-size:12px;color:#7A6F5C;margin-right:6px'>17</span>船长喊了一声：“奥克勒福大副？”大副回答：“到！”船长问道：“我们还有多少分钟？”“二十分钟。”</p>"+
  "<p style='margin:6px 0'><span style='display:inline-block;background:#F1EBDD;border-radius:6px;padding:0 6px;font-size:12px;color:#7A6F5C;margin-right:6px'>18</span>“够了，”船长说，“让每个人都下到小艇上去。奥克勒福大副，你的手枪在吗？”“在，船长。”“哪个男人胆敢抢在女人前面，你就开枪打死他。”</p>"+
  "<p style='margin:6px 0'><span style='display:inline-block;background:#F1EBDD;border-radius:6px;padding:0 6px;font-size:12px;color:#7A6F5C;margin-right:6px'>19</span>大家立时不出声了。没有一个人违抗他的意志，人们感到有一个伟大的灵魂出现在他们的上空。</p>"+
  "<p style='margin:6px 0'><span style='display:inline-block;background:#F1EBDD;border-radius:6px;padding:0 6px;font-size:12px;color:#7A6F5C;margin-right:6px'>20</span>“玛丽”号也放下救生艇，赶来搭救由于它肇祸而遇难的人员。</p>"+
  "<p style='margin:6px 0'><span style='display:inline-block;background:#F1EBDD;border-radius:6px;padding:0 6px;font-size:12px;color:#7A6F5C;margin-right:6px'>21</span>救援工作进行得井然有序，几乎没有发生什么争执或殴斗。事情总是这样，哪里有可卑的利己主义，哪里也会有悲壮的舍己救人。</p>"+
  "<p style='margin:6px 0'><span style='display:inline-block;background:#F1EBDD;border-radius:6px;padding:0 6px;font-size:12px;color:#7A6F5C;margin-right:6px'>22</span>哈尔威巍然屹立在他的船长岗位上，指挥着，主宰着，领导着大家。他把每件事和每个人都考虑到了，面对惊慌失措的众人，他镇定自若，仿佛他不是给人而是给灾难下达命令，就连失事的船舶似乎也听从他的调遣。</p>"+
  "<p style='margin:6px 0'><span style='display:inline-block;background:#F1EBDD;border-radius:6px;padding:0 6px;font-size:12px;color:#7A6F5C;margin-right:6px'>23</span>过了一会儿，他喊道：“把克莱芒救出去！”克莱芒是见习水手，还不过是个孩子。</p>"+
  "<p style='margin:6px 0'><span style='display:inline-block;background:#F1EBDD;border-radius:6px;padding:0 6px;font-size:12px;color:#7A6F5C;margin-right:6px'>24</span>轮船在深深的海水中慢慢下沉。人们尽力加快速度划着小艇，在“诺曼底”号和“玛丽”号之间来回穿梭。“快干！”船长又叫道。</p>"+
  "<p style='margin:6px 0'><span style='display:inline-block;background:#F1EBDD;border-radius:6px;padding:0 6px;font-size:12px;color:#7A6F5C;margin-right:6px'>25</span>二十分钟到了，轮船沉没了。船头先下去，须臾，海水把船尾也浸没了。</p>"+
  "<p style='margin:6px 0'><span style='display:inline-block;background:#F1EBDD;border-radius:6px;padding:0 6px;font-size:12px;color:#7A6F5C;margin-right:6px'>26</span>哈尔威船长一个手势也没有做，一句话也没有说，犹如铁铸，纹丝不动，随着轮船一起沉入了深渊。人们透过阴惨惨的雾气，凝视着这尊黑色的雕像徐徐沉进大海。</p>"+
  "<p style='margin:6px 0'><span style='display:inline-block;background:#F1EBDD;border-radius:6px;padding:0 6px;font-size:12px;color:#7A6F5C;margin-right:6px'>27</span>哈尔威船长的生命就这样结束了。在英伦海峡上，没有任何一个海员能与他相提并论。</p>"+
  "<p style='margin:6px 0'><span style='display:inline-block;background:#F1EBDD;border-radius:6px;padding:0 6px;font-size:12px;color:#7A6F5C;margin-right:6px'>28</span>他一生都要求自己忠于职守，履行做人之道。面对死亡，他又践行了一次英雄的壮举。</p>"+
  "<p style='margin:10px 0 0;font-size:12.5px;color:var(--muted)'>——本文作者是法国的维克多·雨果，译者张汉钧，选作课文时有改动。段落序号为便于对照所加，以课本为准。</p>"+
  "</div></div></div>"+
  "<div class='card'><h3>🔍 精读深挖：跟着“威严的声音”读课文</h3>"+
  "<div class='timeline'>"+
  "<div class='tl'><b>⭐ 第1-4段 · 雾海夜航</b><br>“夜色正浓，薄雾弥漫”——看似平静的开工段，其实句句是伏笔：雾大→看不清→会撞船。考“环境描写的作用”就从这里答。</div>"+
  "<div class='tl'><b>⭐ 第5-8段 · 黑色幽灵</b><br>“好似一个幽灵，又仿佛像一座山峰”——比喻写出来势之猛；“剖开一个大窟窿”一个“剖”字写出灾难之重。</div>"+

  "<div class='tl'><b>第11-13段 · 威严的命令</b><br>“妇女先走，其他乘客跟上，船员断后”——命令一句比一句有力；“实际上一共有六十一人，但是他把自己给忘了”，一个“忘”字写尽舍己。</div>"+

  "<div class='tl'><b>⭐ 第20-28段 · 黑色的雕像</b><br>“犹如铁铸，纹丝不动”——用雕像般的定格写牺牲；结尾两段议论点题：“没有任何一个海员能与他相提并论”。</div>"+

  "<div class='card'><h3>✍️ 写法借鉴：课文怎么写，作文怎么用</h3>"+

  "<div class='card'><h3>📚 课后习题·参考答案</h3>"+
  "<div class='acc open' onclick='this.classList.toggle(\"open\")'><button class='head'><span class='idx'>题1</span>结合课文内容，说说你对“他一生都要求自己忠于职守，履行做人之道。面对死亡，他又践行了一次英雄的壮举”的理解。<span class='arrow'>▸</span></button><div class='body'>📝 <b>答题思路：</b>先解释词语在文中的表现，再点出品质。<br>✅ <b>参考答案：</b>“忠于职守”指哈尔威船长始终坚守在船长岗位上——撞船后他没有逃生，而是指挥救援，把每件事和每个人都考虑到了；“践行英雄的壮举”指他在生死关头把生的希望留给别人，自己随船沉入大海。这两句话是对船长<b>忠于职守、舍己救人</b>一生的总结与赞美。</div></div>"+
  "<div class='acc' onclick='this.classList.toggle(\"open\")'><button class='head'><span class='idx'>题2</span>读课文时，你带着什么问题读？答案在哪些段落？<span class='arrow'>▸</span></button><div class='body'>📝 <b>答题思路：</b>本课的阅读方法是“带着问题读”，答题要有“问题+位置+收获”。<br>✅ <b>参考示例：</b>我带着“哈尔威船长是怎样组织救援的”这个问题读，答案集中在第11-24段：他先命令“妇女先走，船员断后”，再通过与机械师、大副的对话掌握船的情况，最后确保60人全部脱险——带着问题读，找答案又快又准。</div></div>"+
  "<div class='acc' onclick='this.classList.toggle(\"open\")'><button class='head'><span class='idx'>题3</span>“人们感到有一个伟大的灵魂出现在他们的上空”，“伟大的灵魂”指什么？<span class='arrow'>▸</span></button><div class='body'>📝 <b>答题思路：</b>字面＋深意。<br>✅ <b>参考答案：</b>“伟大的灵魂”指哈尔威船长<b>舍己为人、忠于职守的崇高精神</b>。在生死关头，他的威严与镇定震慑了混乱的人群，让人们感受到人格的力量——所以说它“出现在上空”。</div></div>"+

  "<div class='card'><h3>👤 作者与背景：维克多·雨果</h3>"+
  "<div class='kv'><div><b>🖋️ 作者小传</b><br>雨果（1802—1885），法国浪漫主义文学的代表作家，被誉为“法兰西的莎士比亚”，代表作有《巴黎圣母院》《悲惨世界》。他一生关心普通人的命运，作品充满人道主义精神。</div>"+
  "<div><b>🚢 写作背景</b><br>本文取材于真实海难：1870年3月17日夜，“诺曼底号”邮轮在英伦海峡被“玛丽号”撞沉。雨果据此写成这篇小说，塑造了哈尔威船长这位英雄形象。译者张汉钧，选作课文时有改动。</div></div>"+

  "<div><b>🧠 一课一背（主要内容＋中心思想）</b><br>主要内容：抗日战争时期，梅兰芳用避居、蓄须、卖房、装病等办法一次次拒绝为侵略者演出，直到抗战胜利才重新登台。<br>中心思想：赞颂梅兰芳<b>坚贞不屈的民族气节</b>和深沉的爱国情怀。</div></div></div>"+
  "<div class='card' id='ml-src'><h3>📄 课文原文 · 全文 9 个自然段（直读版）</h3>"+
  "<div class='readtext'>"+
  "<p style='margin:6px 0'><span style='display:inline-block;background:#F1EBDD;border-radius:6px;padding:0 6px;font-size:12px;color:#7A6F5C;margin-right:6px'>1</span>梅兰芳先生是闻名世界的京剧表演艺术家。他在舞台上唱旦角，为了演出的需要，总是把胡须剃得干干净净的。但他的一生中，有几年却是留着胡须的。</p>"+
  "<p style='margin:6px 0'><span style='display:inline-block;background:#F1EBDD;border-radius:6px;padding:0 6px;font-size:12px;color:#7A6F5C;margin-right:6px'>2</span>1937 年，日军占领上海，梅兰芳被迫藏身租界，以躲避日本人的纠缠。1938 年底，有人邀请他去香港演戏。演出结束后，梅兰芳在香港住了下来，深居简出，不再登台。对于一个视舞台为生活、视艺术为生命的人来说，不能演出，不能创作，无异于虚度生命。到了深夜，梅兰芳关紧门窗，拉上特制的厚窗帘，才能在寓所悄悄地细声吟唱，这对他来说已经很知足了。一个艺术大师就用这种方式坚持着对艺术的追求。</p>"+
  "<p style='margin:6px 0'><span style='display:inline-block;background:#F1EBDD;border-radius:6px;padding:0 6px;font-size:12px;color:#7A6F5C;margin-right:6px'>3</span>1941 年 12 月香港沦陷。日本驻港司令官亲自出马，多次逼迫梅兰芳演戏。梅兰芳可以忍受生活的困顿，直面战争的危险，但他难以抵抗来自侵略者随时随地的骚扰。拒绝的借口都用尽了，梅兰芳最后只能蓄须明志，表示对日本帝国主义的抗议，表明不给侵略者演戏的决心。后来，梅兰芳不堪其扰，只好又回到了上海。</p>"+
  "<button class='srcbtn' onclick='showCard(\"ml1\")'>📚 查资料 · 蓄须的分量</button>"+
  "<p style='margin:6px 0'><span style='display:inline-block;background:#F1EBDD;border-radius:6px;padding:0 6px;font-size:12px;color:#7A6F5C;margin-right:6px'>4</span>长期不演戏，没有了经济来源，又要养家，梅兰芳准备卖掉北京的房子。听说梅兰芳要卖房子，很多戏园子老板找上门来说：“梅先生，您何必卖房子，只要您把胡子一剃，一登台，还愁没钱花？”有的甚至说，只要签订演出合同，就预支二十两黄金给梅兰芳。但是，无论戏园子老板开出的条件多么优厚，梅兰芳都拒绝了。他宁可卖房度日，也决不在日本侵略者的统治下登台演出。</p>"+
  "<p style='margin:6px 0'><span style='display:inline-block;background:#F1EBDD;border-radius:6px;padding:0 6px;font-size:12px;color:#7A6F5C;margin-right:6px'>5</span>一次，日本侵略军要庆祝“大东亚圣战”，要求他必须上台演出。梅兰芳斩钉截铁地说：“普通的演出我都不参加，这样的庆祝会当然更不会去了。”但是，拒绝演出总得要想出个办法啊。</p>"+
  "<p style='margin:6px 0'><span style='display:inline-block;background:#F1EBDD;border-radius:6px;padding:0 6px;font-size:12px;color:#7A6F5C;margin-right:6px'>6</span>梅兰芳找到一位当医生的好朋友，说明了自己的危险处境，请朋友设法让他生一场“大病”，以摆脱日本人。这个朋友被他的爱国精神感动了，决心帮助他渡过难关，于是给他打了伤寒预防针，人打了这种针就会连日发高烧。</p>"+
  "<p style='margin:6px 0'><span style='display:inline-block;background:#F1EBDD;border-radius:6px;padding:0 6px;font-size:12px;color:#7A6F5C;margin-right:6px'>7</span>日本人不相信梅兰芳病了，专门派了一个军医来检查。日本军医闯进梅兰芳的家，看见他盖着棉被躺在床上，床边桌子上放着很多药。军医用手摸了摸梅兰芳的额头，滚烫滚烫的，看不出破绽，只好认定梅兰芳得了重病，不能登台演出了。日本侵略者的妄想最终没有实现，梅兰芳为此差点儿丢了性命。</p>"+
  "<button class='srcbtn' onclick='showCard(\"ml2\")'>📚 查资料 · 打针装病的凶险</button>"+
  "<p style='margin:6px 0'><span style='display:inline-block;background:#F1EBDD;border-radius:6px;padding:0 6px;font-size:12px;color:#7A6F5C;margin-right:6px'>8</span>当抗日战争取得胜利的消息传来时，梅兰芳当即剃了胡须，高兴地向大家宣布：“胜利了，我该登台演出了！”前来看他演出的人太多了，很多人没有座位就站着看。</p>"+
  "<button class='srcbtn' onclick='showCard(\"ml3\")'>📚 查资料 · 复台那一刻</button>"+

  "<p style='margin:10px 0 0;font-size:12.5px;color:var(--muted)'>——本文作者李大同，选作课文时有改动。新版课题为《梅兰芳蓄须明志》，文字以课本为准。段落序号为便于对照所加。</p>"+
  "</div></div>"+
  "<div class='card'><h3>🔍 精读深挖：一次比一次“狠”的考验</h3>"+
  "<div class='timeline'>"+
  "<div class='tl' id='ml-tl-1'><b>⭐ 第1-3段 · 避居香港与蓄须</b>"+
  "<div class='jl-yuan'><span class='jl-lab'>原句</span>1941 年 12 月香港沦陷。日本驻港司令官亲自出马，多次逼迫梅兰芳演戏。……拒绝的借口都用尽了，梅兰芳最后只能蓄须明志，表示对日本帝国主义的抗议，表明不给侵略者演戏的决心。</div>"+
  "<div class='jl-ask'>❓ 先想一想：梅兰芳为什么要选“蓄须”这个方式拒绝，而不是直接说“不”？</div>"+

  "<li><b>无声胜有声</b>——他不喊口号、不发声明，用职业形象本身宣告：我不演了。</li></ul>"+

  "<div class='jl-kao'>📝 考法：<b>“明志”立的什么志</b>——答“抗议日本帝国主义、坚决不给侵略者演戏的决心”；按顺序说拒演办法是课后题高频。<br>🎤 朗读指导：读第 3 段“最后只能蓄须明志”时放慢加重——“只能”二字里有被逼到墙角的无奈，更有不肯低头的坚决。</div></div>"+

  "<li><b>细节写凶险</b>——打伤寒预防针可能致命；“滚烫滚烫的额头”这个细节，是拿命换来的“看不出破绽”。</li></ul>"+
  "<div class='jl-take'>💡 一句话：钱能买的他不要，命换的他敢给——句式的取舍之间，站着一位把气节看得比命重的艺术家。</div>"+
  "<div class='jl-kao'>📝 考法：<b>“宁可……也决不……”体现什么品质</b>——答“把民族尊严看得高于一切，宁可舍弃财产、安危也不向侵略者低头”；排序题“避居香港→蓄须明志→卖房度日→打针装病”不能错。<br>🎤 朗读指导：这个句式要读得一字一顿——重音落在“宁可”和“决不”上，读出毫不犹豫。</div></div>"+
  "<div class='tl' id='ml-tl-3'><b>⭐ 第7-9段 · 胜利复台</b>"+
  "<div class='jl-yuan'><span class='jl-lab'>原句</span>当抗日战争取得胜利的消息传来时，梅兰芳当即剃了胡须，高兴地向大家宣布：“胜利了，我该登台演出了！”……作为艺术家，梅兰芳先生高超的表演艺术让人喜爱，他的民族气节更令人敬佩！</div>"+

  "</div>"+
  "<div class='card'><h3>👤 作者与背景：梅兰芳</h3>"+
  "<div class='kv'><div><b>🎭 人物小传</b><br>梅兰芳（1894—1961），江苏泰州人，京剧表演艺术大师，“四大名旦”之首，开创“梅派”艺术。代表作有《贵妃醉酒》《霸王别姬》等，曾多次出访美、苏等国，让京剧走向世界。</div>"+

  "<div class='card'><h3>📋 教材写作要求·逐句拆解</h3>"+
  "<p>本次习作是<b>想象作文：二十年后的家乡</b>——大胆想象二十年后家乡的样子：环境、科技、生活、学校……都可以写。特别要求：<b>写之前，先编一个习作提纲</b>，再按提纲一步步写。</p>"+

 ,yuan3Di:function(L){return "<div class='tabpane' data-tab='kaodian'><div class='card'><h3>🧭 新编四步法（照着走就行）</h3>"+

 didaozhan:function(L){return "<div class='tabpane' data-tab='tuozhan'>"+
  "<div class='card'><h3>🌟 英雄的故事：冉庄“第一洞”</h3>"+
  "<div class='imgrow'><figure class='pic'><img src='images/zhangsenlin.jpg' alt='张森林画像'><figcaption>张森林画像。<span class='picsrc'>图源：新华网</span></figcaption></figure>"+

  "<div class='imgrow'><figure class='pic'><img src='images/ditao_battle.jpg' alt='八路军在地道中'><figcaption>冀中八路军依托地道打击日寇（历史资料照片）。<span class='picsrc'>图源：新华社</span></figcaption></figure>"+

 yuanDi:function(L){return "<div class='tabpane' data-tab='tuozhan'>"+
  "<div class='card'><h3>🧲 特点素材库：你的老师是哪一款？</h3>"+
  "<div class='kv'><div><b>🎙️ 口头禅型</b><br>“再讲两分钟就下课”“这道题我讲过八百遍了”——一句台词立起一个人。</div>"+
  "<div><b>🎬 习惯动作型</b><br>推眼镜、拍讲台、粉笔头百发百中、抱着保温杯踱步——动作是人物的指纹。</div>"+
  "<div><b>😤 性格型</b><br>刀子嘴豆腐心、幽默段子手、外冷内热、眼里揉不得沙子——选你最想写的那个。</div></div></div>"+
  "<div class='card'><h3>📚 描写词库（写老师专用）</h3>"+
  "<table class='ovtable'><thead><tr><th style='width:110px'>类型</th><th>词语串</th></tr></thead>"+
  "<tr><td><b>神态</b></td><td>眉飞色舞、和蔼可亲、板着脸、眉头一皱、目光如炬、笑眯眯</td></tr>"+
  "<tr><td><b>动作</b></td><td>大步流星、踱来踱去、一挥而就、拍案而起、俯身细看</td></tr>"+
  "<tr><td><b>语言（夸张化）</b></td><td>“这道题闭着眼都能做”“你们是我带过最活泼的一届”</td></tr></table></div>"+
  "<div class='card'><h3>📄 范文欣赏（3 篇，点击展开）</h3>"+
  "<p style='font-size:13px;color:var(--muted)'>五年级习作一般要求 400 字以上，下面三篇范文均为标准篇幅（420~450 字）。读范文时对照上面的“评分自查表”：开头、特点、事例、结尾各是怎么落实的？</p>"+
  "<div class='acc open' onclick='this.classList.toggle(\"open\")'><button class='head'><span class='idx'>范1</span>《我的“段子手”老师》（幽默型）<span class='arrow'>▸</span></button><div class='body'>我的数学王老师，是我们班公认的“段子手”。他四十来岁，头发硬得像刷子，鼻梁上架一副黑框眼镜，可你千万别被这副“正经面孔”骗了——他一开口，教室准能笑翻。<br>他上课从来不摆架子。讲应用题，他能把“甲乙两人相向而行”讲成“你追奶茶店老板，奶茶店老板追钱包”，逗得我们前仰后合。笑完了，题也就会了。最绝的是他的“错题通缉令”：谁的作业错了不该错的题，他就把那道题投到大屏幕上，打一个硕大的问号：“通缉这道题的‘凶手’，有谁见过它？”全班哄堂大笑，出错的同学红着脸，把题认认真真重做了三遍——从此再没错过。<br>有一次我考砸了，躲在座位上不敢抬头，心想这下完了。可王老师讲评时偏偏没提我的名字，只把我的错题编成了一道“新题”。下课后，他路过我身边，轻轻敲了敲我的桌子，压低声音说：“下次，让它从通缉令上消失。”我一下子就明白了，眼眶有点热，心里却暖暖的。从那以后，我的错题本越记越厚，“通缉令”上却再也没有我的名字。<br>这就是王老师——把数学课变成相声专场，又把批评悄悄藏进笑话里。这样的老师，谁能不爱？<br>✏️ <b>点评：</b>开头外貌+特点切入✓；“通缉令”细节传神✓；考砸事件一波三折、详略得当✓；结尾点情呼应✓。全文约440字。</div></div>"+
  "<div class='acc' onclick='this.classList.toggle(\"open\")'><button class='head'><span class='idx'>范2</span>《“三不”李老师》（严厉型）<span class='arrow'>▸</span></button><div class='body'>提起语文李老师，全班没人不知道他的“三不”：作业不工整，不收；背书不过关，不放；写字不认真，不批。这三句话就贴在教室后墙上，像三道“军令”。<br>刚开学，我们吃足了苦头。我的作业因为字迹潦草，被他退回了三次。第三次退回时，他把我叫到办公室，没批评我，只是摊开我的本子问：“你自己读得清吗？”我的脸一下子红了。第四次，我一笔一画写到天黑才交上去。第二天，作业本发下来了——上面没有“优”，却有一行小字：“字如其人，今天的你特别精神。”我把那一页摸了又摸，心里比得了满分还高兴。<br>李老师严厉，可他的严厉里藏着细心。那天我发烧，趴在桌上直打颤，是他第一个发现，三步并作两步走过来，摸摸我的额头，立刻给我妈妈打电话，还把自己的外套披在我身上。在走廊等妈妈的时候，他一直问我冷不冷，还给我倒了一杯热水。<br>现在，我们班的作业是全年级最工整的，读书声是全年级最响亮的。我们都明白，那“三不”不是刁难，是李老师把我们往正路上赶。<br>严厉也是爱——这就是我们的李老师。<br>✏️ <b>点评：</b>“三不”排比开篇立特点✓；退作业详写（语言+心理）、披外套略写，一严一暖对比中生情✓；结尾点题✓。全文约420字。</div></div>"+
  "<div class='acc' onclick='this.classList.toggle(\"open\")'><button class='head'><span class='idx'>范3</span>《温柔的“大朋友”》（温柔型）<span class='arrow'>▸</span></button><div class='body'>我们的班主任张老师，说话轻轻的，走路轻轻的，连批评人都带着笑。同学们背后都叫她“大朋友”——因为她真的不像老师，更像我们中间的一个。<br>可你别小看这份温柔。三年级时我摔伤了腿，打着石膏休学在家，心里又急又怕，生怕功课落下一大截。张老师每个周末都来给我补课，一次不落。下雨天，她的裤脚全湿了，甩甩伞上的水珠，就笑眯眯地翻开课本：“咱们接着讲。”风里来雨里去，她从来不提一个“累”字。<br>复学那天，我最怕大家把我当“特殊的人”。张老师却在班会上宣布：“咱们班成立一个互助小组，大家轮流帮××记笔记。”轻描淡写的一句话，把我的“特别”变成了全班的“平常”。同学们围过来，没有人问“你为什么休学”，只有人说：“你的笔记，我们先帮你记好了。”那一刻，我的鼻子酸酸的。<br>期末，我考进了班级前十名。领奖状的时候，我看见张老师站在人群后面，没有鼓掌，也没有说话，只是笑得比谁都开心，眼睛弯成了两个月牙。那两个月牙，我一辈子都忘不了。<br>张老师从没大声说过一句话，可她教给我的，比任何大声说出来的话都多。温柔，也是一种了不起的力量。<br>✏️ <b>点评：</b>“轻轻的”叠词立温柔特点✓；补课与互助小组两个事例、一波三折✓；“眼睛弯成月牙”细节传神✓；结尾升华“温柔的力量”✓。全文约450字。</div></div>"+
  "</div>"+
  "<div class='card'><h3>📚 交流平台：四招速读方法总复习</h3>"+
  "<div class='flipgrid'>"+
  "<div class='flip'><div class='inner'><div class='face front'>不回读 🚫↩️<small>点我翻看 →</small></div><div class='face back'>眼睛不倒退。遇到没懂的词，先记在心里继续往前读，读完再解决。</div></div></div>"+
  "<div class='flip'><div class='inner'><div class='face front'>连词成句 🔗<small>点我翻看 →</small></div><div class='face back'>不要一个字一个字地“蹦”，一眼看一组词，像看风景一样扫过去。</div></div></div>"+
  "<div class='flip'><div class='inner'><div class='face front'>抓关键词 🔑<small>点我翻看 →</small></div><div class='face back'>每段第一句常常是“路牌”，抓住它就知道这段在讲什么。</div></div></div>"+
  "<div class='flip'><div class='inner'><div class='face front'>带着问题 ❓<small>点我翻看 →</small></div><div class='face back'>读书前先问自己一个问题，读的时候答案会自己“跳”出来。</div></div></div>"+
  "</div></div>"+
  "<div class='card'><h3>🕰️ 日积月累：惜时名言（点击认识作者）</h3>"+
  "<div class='flipgrid'>"+
  "<div class='flip'><div class='inner'><div class='face front' style='color:var(--purple)'>不饱食以终日，不弃功于寸阴<small>点我认识作者 →</small></div><div class='face back purple'>—— 葛洪（东晋）<br><span style='font-weight:400;font-size:14.5px'>别整天吃饱了混日子，一寸光阴也不能浪费。</span></div></div></div>"+
  "<div class='flip'><div class='inner'><div class='face front' style='color:var(--purple)'>盛年不重来，一日难再晨<small>点我认识作者 →</small></div><div class='face back purple'>—— 陶渊明（东晋诗人）<br><span style='font-weight:400;font-size:14.5px'>最好的年华不会重来，早晨过去了就不再有。</span></div></div></div>"+
  "<div class='flip'><div class='inner'><div class='face front' style='color:var(--purple)'>莫等闲，白了少年头，空悲切！<small>点我认识作者 →</small></div><div class='face back purple'>—— 岳飞《满江红》<br><span style='font-weight:400;font-size:14.5px'>别虚度光阴，等头发白了只能空自悲伤。</span></div></div></div>"+
  "<div class='flip'><div class='inner'><div class='face front' style='color:var(--purple)'>一万年太久，只争朝夕<small>点我认识作者 →</small></div><div class='face back purple'>—— 毛泽东<br><span style='font-weight:400;font-size:14.5px'>要做的事抓紧做，一天也不能耽误。</span></div></div></div>"+
  "</div>"+
  "<div class='tipbox exam'>📌 这四句名言是<b>考试必背</b>：填空默写、情境运用都是常考题型。写作文结尾引用一句，立马上档次。</div></div>"+
  "<div class='card'><h3>🌟 “莫等闲”背后的英雄：岳飞</h3><div class='imgrow'>"+
  "<figure class='pic'><img src='images/zhongxing.jpg' alt='南宋《中兴四将图》'><figcaption>南宋《中兴四将图》（传刘松年绘，绢本设色，纵26厘米、横90.6厘米，中国国家博物馆藏）——画中四将为刘光世、韩世忠、张俊、岳飞，是现存最接近岳飞真实容貌的画像。<span class='picsrc'>图源：中国国家博物馆藏（河北美术学院图书馆网页刊载）</span></figcaption></figure></div>"+
  "<p>日积月累里的“莫等闲，白了少年头，空悲切！”出自南宋名将<b>岳飞</b>的《满江红》。关于岳飞的长相，有个有趣的“考古”故事：</p>"+
  "<div class='timeline'><div class='tl'><b>《中兴四将图》</b><br>南宋画家刘松年（一说画院画师）画的《中兴四将图卷》，绢本设色，纵26厘米、横90.6厘米，现藏于中国国家博物馆，画的是岳飞、韩世忠、张俊、刘光世四位将领。</div>"+
  "<div class='tl'><b>岳飞原来不长胡子？</b><br>清代学者阮元在《石渠随笔》里描述画中岳飞“面大而方，广额疏眉，两颊甚丰，目圆鼻尖……无髭须”——画里的岳飞是个方脸盘、没胡须的“儒将”，跟影视剧里长髯飘飘的形象大不一样！这幅画据人民网文化频道介绍，是现存最接近岳飞真实容貌的画像。</div>"+
  "<div class='tl'><b>为什么他永远年轻</b><br>人民网文章说，画中岳飞还是青年相貌——因为他牺牲时还不到40岁。人们记住的，永远是他“精忠报国”的少年心气。</div></div>"+
  "<div class='tipbox fun'>🤔 写“漫画”老师时偷偷用一用日积月累的名言，作文马上高级起来！比如结尾写：“王老师常说，莫等闲，白了少年头——她的教室里，从来没有人敢等闲。”</div></div></div>";}
 ,bailu:function(L){return "<div class='tabpane' data-tab='tuozhan'>"+
  "<div class='card'><h3>🌟 “韵在骨子里的散文诗”是什么意思？</h3>"+
  "<div class='timeline'>"+
  "<div class='tl'><b>散文诗 = 散文 + 诗</b><br>它像散文一样自由，不受格律限制；又像诗一样凝练、有韵味。郭沫若是中国新诗的开创者，他用“诗的眼睛”看白鹭。</div>"+
  "<div class='tl'><b>1942年的重庆</b><br>那时抗战正艰难，人们的生活又苦又慌。作者偏偏写一只安安静静的白鹭——乱世之中，这份“平常的美”格外珍贵，也寄托着他对宁静生活的向往。</div>"+
  "<div class='tl'><b>白鹭小百科</b><br>白鹭全身雪白，喜欢住在稻田、沼泽、溪流边，捕食鱼虾。“水田钓鱼”写的就是它伸长脖子捕鱼的瞬间——明明是捕鱼，作者却说成“钓鱼”，一下子就悠闲起来了。</div>"+

 ,luohuasheng:function(L){return "<div class='tabpane' data-tab='tuozhan'>"+

 ,guihuayu:function(L){return "<div class='tabpane' data-tab='tuozhan'>"+

 ,yuan1Di:function(L){return "<div class='tabpane' data-tab='tuozhan'>"+
  "<div class='card'><h3>🧲 心爱之物素材库：你的宝贝是哪一款？</h3>"+
  "<div class='kv'><div><b>🧸 陪伴型</b><br>毛绒玩具、小台灯、自行车——天天陪着你，故事最多，最好写。</div>"+
  "<div><b>🎁 纪念型</b><br>奶奶织的围巾、比赛赢来的奖牌、朋友送的礼物——藏着一个人、一件事。</div>"+
  "<div><b>🌊 观赏型</b><br>风铃、贝壳、水晶球——看到它就开心，能带来想象和快乐。</div>"+
  "<div><b>🌱 照料型</b><br>一盆多肉、蚕宝宝——你付出过辛苦，感情最深。</div></div>"+
  "<div class='tipbox tip'>⚡ 选物秘诀：不选最贵的，选<b>最有故事</b>的——“来历+经历”才是“心爱”的底气。</div></div>"+
  "<div class='card'><h3>📚 描写词库（写心爱之物专用）</h3>"+
  "<table class='ovtable'><thead><tr><th style='width:110px'>类型</th><th>词语串</th></tr></thead>"+
  "<tr><td><b>外形</b></td><td>圆滚滚、毛茸茸、亮晶晶、褪了色、磨得发亮、缺了一角、崭新</td></tr>"+
  "<tr><td><b>动态·声音</b></td><td>叮叮当当、随风摇摆、咯吱作响、闪闪发光、转个不停</td></tr>"+
  "<tr><td><b>感情</b></td><td>视若珍宝、爱不释手、念念不忘、朝夕相伴、宝贝得不得了</td></tr></table></div>"+
  "<div class='card'><h3>📄 范文欣赏（3 篇，点击展开）</h3>"+
  "<p style='font-size:13px;color:var(--muted)'>五年级习作一般要求 400 字以上，下面三篇范文均为标准篇幅（400~430 字）。读范文时对照“评分自查表”：样子、来历、事例、感情各是怎么落实的？</p>"+
  "<div class='acc open' onclick='this.classList.toggle(\"open\")'><button class='head'><span class='idx'>范1</span>《缺耳朵的小熊》（纪念型）<span class='arrow'>▸</span></button><div class='body'>每个人都有自己的心爱之物：有人爱威风的遥控赛车，有人爱漂亮的瓷猫，而我最宝贝的，是书桌上那只缺了左耳朵的小熊。<br>它是我五岁生日时奶奶送的。棕色的毛软软的，肚子圆滚滚，两颗黑豆似的眼睛总是笑眯眯地望着我。因为抱得太久，它的左耳朵被我摇掉了，绒毛也磨得发亮，可我一点也不嫌弃——这是我们的“战友勋章”。<br>小熊还是我的“医生”。小时候我发烧，奶奶抱着我，我把小熊搂在怀里，仿佛它的软毛里藏着奶奶的味道，烧好像都退得快些。去年奶奶回了老家，小熊就成了奶奶派来的“代表”：每天晚上写作业，它坐在台灯下陪我；我遇到难题想发火，一摸它圆滚滚的肚子，气就消了一半。<br>有一次妈妈大扫除，差点把它当旧玩具收走。我冲过去一把抱住：“不行！这是奶奶送我的！”妈妈愣了一下，轻轻把它放回原处，还给它找了个更舒服的位置。<br>如今我的书越堆越高，玩具换了一批又一批，只有小熊一直坐在那里。它不会说话，可它什么都记得：记得奶奶的怀抱，记得我的童年，也记得那些奶奶不在身边的夜晚，是它替奶奶守着我。<br>✏️ <b>点评：</b>开头开门见山、点出“最爱”✓；样子抓细节、“战友勋章”有童趣✓；“医生”与“护熊”两个事例，感情藏在事里✓；结尾借物抒情、呼应开头✓。全文约420字。</div></div>"+
  "<div class='acc' onclick='this.classList.toggle(\"open\")'><button class='head'><span class='idx'>范2</span>《我的“战功”钢笔》（奖励型）<span class='arrow'>▸</span></button><div class='body'>在我的文具盒里，躺着好几支笔，可我一眼就能认出我的“心头好”——那支深蓝色、笔帽上印着金色星星的钢笔。<br>它不是买的，是“赢”来的。三年级下学期，我参加学校的书法比赛，天天练到手酸。比赛那天，我的作品得了一等奖！班主任李老师笑眯眯地把这支钢笔递给我：“奖励给未来的小书法家。”我攥着它，感觉手心里握着的不是笔，而是一颗发光的星星。<br>从那以后，它成了我的“战功”钢笔。用它写字，我一笔一画都不敢马虎——这可是“小书法家”的笔呀！有一次同桌想借它用用，我犹豫了半天，还是大方地递了过去，只在拿回来的时候，认认真真把笔尖擦得干干净净。<br>最难忘的是期末考试。考场上，我的笔突然写不出字了，急得手心冒汗。手忙脚乱的空当，我看见那支钢笔安安静静躺在文具盒里，星星在灯下一闪一闪，好像在说：“别慌，一笔一画来。”我深吸一口气，换上它，稳稳当当地写完了整张试卷。成绩出来，作文只扣了一分！<br>这支钢笔已经用了两年多，笔杆上的漆掉了一小块，可我一直舍不得换。它让我记住：好成绩不是等来的，是一笔一画写出来的。<br>✏️ <b>点评：</b>开头设悬念——“赢来的”✓；获奖与考场两个事例，一支笔串起成长✓；“星星好像在说”拟人细节传神✓；结尾由物及理，升华自然✓。全文约420字。</div></div>"+
  "<div class='acc' onclick='this.classList.toggle(\"open\")'><button class='head'><span class='idx'>范3</span>《那辆蓝色自行车》（陪伴型）<span class='arrow'>▸</span></button><div class='body'>我心里最亮的一抹蓝色，不是天空，也不是大海，而是爸爸送我的那辆自行车。<br>去年生日那天，一辆崭新的蓝色自行车停在我面前，车把上还系着个大蝴蝶结。我围着它转了三圈，恨不得立刻骑上它飞一圈。可我根本不会骑！爸爸拍拍车座：“不会，咱就学。”<br>学车的日子可不好受。第一圈，我连车把都扶不稳，“哐当”一声摔进草丛；第二圈，膝盖磕破了皮，火辣辣地疼，眼泪在眼眶里直打转。我把车一推：“不学了！”爸爸没有哄我，只是扶起车，慢慢骑了一圈给我看：“你看，它多想带你去看远处呀。”<br>我咬咬牙，又扶起了车。不知摔了多少次，那天傍晚，我忽然发现车子稳稳地跑了起来——风从耳边呼呼吹过，路边的树一棵一棵向后飞，夕阳把我们俩的影子拉得老长。我大喊：“我会啦！”回头一看，爸爸在后面跑得满头大汗，笑得比我还开心。<br>现在，蓝色自行车每天驮着我上学、放学，车筐里装着书包，也装着我一天的好心情。车铃“叮铃铃”一响，我就想起那个傍晚，想起爸爸的话：摔倒了不要紧，扶起来，接着骑。<br>它不只是我的心爱之物，更是我的“勇气勋章”。<br>✏️ <b>点评：</b>开头“最亮的蓝色”设悬念✓；学车一波三折，摔跤与成功详略得当✓；“爸爸满头大汗”细节动人✓；结尾“勇气勋章”点题升华✓。全文约420字。</div></div>"+
  "</div>"+
  "<div class='card'><h3>📚 交流平台：借物抒情方法总结</h3>"+
  "<div class='flipgrid'>"+
  "<div class='flip'><div class='inner'><div class='face front'>《白鹭》🕊️<small>点我翻看 →</small></div><div class='face back'>借白鹭赞颂平凡之中藏着的美。</div></div></div>"+
  "<div class='flip'><div class='inner'><div class='face front'>《落花生》🥜<small>点我翻看 →</small></div><div class='face back'>借花生告诉我们：要做有用的人。</div></div></div>"+
  "<div class='flip'><div class='inner'><div class='face front'>《桂花雨》🌼<small>点我翻看 →</small></div><div class='face back'>借桂花寄托对故乡和童年的怀念。</div></div></div>"+
  "<div class='flip'><div class='inner'><div class='face front'>《珍珠鸟》🐦<small>点我翻看 →</small></div><div class='face back'>借小鸟写出“信赖创造美好境界”。</div></div></div>"+
  "</div></div>"+
  "<div class='card'><h3>🕰️ 日积月累：《蝉》（点击认识作者）</h3>"+
  "<div class='flipgrid'>"+
  "<div class='flip' style='height:180px'><div class='inner'><div class='face front' style='color:var(--purple)'>垂緌饮清露，<br>流响出疏桐。<br>居高声自远，非是藉秋风。<small>点我认识作者 →</small></div><div class='face back purple'>—— 虞世南（唐初）<br><span style='font-weight:400;font-size:14.5px'>唐太宗称赞他有“五绝”：德行、忠直、博学、文词、书翰。这首诗借蝉表白：品格高洁的人，不需要凭借外力也能声名远扬。</span></div></div></div>"+
  "</div>"+
  "<div class='tipbox exam'>📌 默写易错字：“緌”“疏桐”“藉”。情境运用：“居高声自远，非是藉秋风”可用来夸凭真本事出名、不靠关系炒作的人。</div></div>"+
  "<div class='card'><h3>🌟 一只蝉，三首诗，一个道理</h3>"+
  "<div class='timeline'>"+
  "<div class='tl'><b>唐代咏蝉三绝</b><br>虞世南《蝉》（居高声自远）、骆宾王《在狱咏蝉》（露重飞难进）、李商隐《蝉》（本以高难饱）——同一只蝉，三种心事，都叫<b>托物言志</b>。</div>"+
  "<div class='tl'><b>虞世南是什么人？</b><br>唐初名臣、大书法家，唐太宗夸他身怀“五绝”：德行、忠直、博学、文词、书翰。他自己就“居高声自远”——诗和人完全一致。</div>"+
  "<div class='tl'><b>蝉的小知识</b><br>蝉的幼虫要在地下住好几年才钻出来，在枝头高唱一个夏天。“垂緌”说的就是它嘴上细长的口器，像帽子打结后下垂的带子。</div>"+
  "</div>"+
  "<div class='tipbox fun'>🤔 想一想：《蝉》和《落花生》有什么共同点？——都借一个平凡的事物，说一个做人的道理。写心爱之物也可以这样：由物想到理，文章就有深度啦！</div></div></div>";}
 ,hailibu:function(L){return "<div class='tabpane' data-tab='tuozhan'>"+
  "<div class='card'><h3>🌟 民间故事：老百姓的“集体创作”</h3>"+
  "<div class='timeline'>"+

  "<div class='tl'><b>草原上的传说</b><br>海力布是蒙古族猎人。传说在今天的内蒙古，还留有一块“海力布石”，当地人一直记着这位舍己救人的英雄。</div>"+

 ,niulang1:function(L){return "<div class='tabpane' data-tab='tuozhan'>"+

 ,niulang2:function(L){return "<div class='tabpane' data-tab='tuozhan'>"+

  "<div class='tl'><b>穿针乞巧</b><br>七夕晚上，姑娘们对月穿针，谁穿得快，谁就“得了巧”——所以七夕又叫“乞巧节”。《乞巧》诗里“穿尽红丝几万条”写的就是它。</div>"+

 ,yuan3Di:function(L){return "<div class='tabpane' data-tab='tuozhan'>"+
  "<div class='card'><h3>🌟 素材库：可以新编的故事与情节方向</h3>"+
  "<div class='kv'><div><b>📚 熟悉故事清单</b><br>《龟兔赛跑》《狐假虎威》《坐井观天》《狐狸和乌鸦》《亡羊补牢》《守株待兔》——寓言、民间故事都可以新编。</div>"+
  "<div><b>🧩 五种情节变化方向（教材）</b><br><b>路遇不测</b>（摔跤、掉坑）／<b>急中出错</b>（慌乱中犯错）／<b>遇到诱惑</b>（美食、游戏）／<b>赛道变化</b>（翻山、过河）／<b>天气变化</b>（下雨、刮风）。</div></div>"+
  "<div class='tipbox fun'>🤔 小妙招：把原故事里“最关键的一个情节”换掉，结局往往就跟着变了——比如兔子不睡觉、乌鸦先飞走、农夫先送医。改动一处，全篇皆新。</div></div>"+
  "<div class='card'><h3>📚 描写词库（把情节写活）</h3>"+
  "<table class='ovtable'><thead><tr><th style='width:110px'>类型</th><th>好词好句</th></tr></thead>"+
  "<tr><td><b>动作</b></td><td>纵身一跃、撒腿就跑、不甘示弱、大步流星、连滚带爬</td></tr>"+
  "<tr><td><b>神态</b></td><td>得意洋洋、垂头丧气、面红耳赤、目瞪口呆、喜出望外</td></tr>"+
  "<tr><td><b>心理</b></td><td>心里咯噔一下、暗暗较劲、肠子都悔青了、打定了主意</td></tr>"+
  "<tr><td><b>对话提示语</b></td><td>它拍着胸脯说／它挠挠头说／它眼珠一转说——提示语里藏着性格</td></tr></table></div>"+
  "<div class='card'><h3>📖 范文欣赏（三篇新编范文，均为 400 字以上标准篇幅）</h3>"+
  "<p style='font-size:13px;color:var(--muted)'>读范文时对照上面的“评分自查表”：结局新颖吗？情节由果探因了吗？描写生动吗？</p>"+
  "<div class='acc open' onclick='this.classList.toggle(\"open\")'><button class='head'><span class='idx'>范1</span>《新龟兔赛跑》（约420字）<span class='arrow'>▸</span></button><div class='body'>自从上次输了比赛，兔子天天在山坡上练习跑步。它把“骄傲”两个字写在本子上，又在后面重重地画了一个叉。乌龟听说兔子要再比一场，慢悠悠地说：“比就比，反正它改不了老毛病。”<br>比赛那天，森林里热闹极了。赛道变了——要先翻过山坡，再穿过一片果园。发令枪一响，兔子像离弦的箭一样冲了出去，一口气翻过山坡。跑进果园，红苹果挂满枝头，兔子咽了咽口水，心里咯噔一下：“上次就是睡了一觉才输的，这次一个果子也不能吃！”它盯着脚下的路，撒腿就跑。<br>乌龟呢，不慌不忙地爬着。走到果园，它闻到果香，停了下来——太渴了，想找个水洼喝口水，一不留神，脚下一滑，滚进了旁边的土坑，四脚朝天，怎么也翻不过来。<br>等乌龟费了九牛二虎之力爬出坑，兔子早已冲过了终点，全场的动物都在为它欢呼。兔子却转身跑回果园，把乌龟从坑边拉了上来。<br>乌龟红着脸说：“我总盯着你的老毛病，却忘了提醒你——新赛道上有新坑。这个结局，我服气。”<br>兔子挠挠头，笑了：“真正的对手不是你，是那个爱骄傲的自己。”<br>✏️ <b>点评：</b>结局新颖✓（原版乌龟赢→兔子赢）；由果探因✓（兔子改正骄傲＋乌龟急中出错）；心理、动作细节生动✓；结尾借人物的话点明道理✓。全文约420字。</div></div>"+
  "<div class='acc' onclick='this.classList.toggle(\"open\")'><button class='head'><span class='idx'>范2</span>《狐假虎威新编》（约420字）<span class='arrow'>▸</span></button><div class='body'>自从被狐狸骗了一回，老虎越想越窝囊。它找到百兽，红着脸说：“上次是我不对，让狐狸借着我的威风吓唬大家。这回它再来，咱们演一场戏给它看。”动物们商量好了，个个憋着笑，把“看戏”的位置都占好了。<br>没过几天，狐狸大摇大摆、摇头晃脑地来了。它眼珠一转，老一套的计策又冒了出来：“老虎大哥，这次咱们换个玩法——你跟在我后面，看看森林里还有谁不怕我！”<br>老虎点点头：“好啊，正想见识见识你的本事。”<br>狐狸昂着头走进森林。奇怪的是，小鹿继续低头吃草，猴子继续荡秋千，连胆小的兔子也只是瞥了它一眼。<br>狐狸傻眼了，嗓门都变了调：“你们……你们怎么不跑？”<br>小鹿慢悠悠地说：“老虎大哥早跟我们打过招呼啦。再跑，该是我们才对——上次装怕你，腿都装酸了！”<br>森林里爆发出一阵哈哈大笑。狐狸的脸红得像熟透的苹果，夹着尾巴溜走了。据说从那以后，它再也没敢在森林里耍过花招，见了老虎都绕道走。<br>老虎在后面语重心长地说：“狐狸啊，借来的威风只能用一次。靠别人吓唬人，早晚要露馅。”<br>✏️ <b>点评：</b>结局新颖✓（狐狸的把戏失灵）；由果探因✓（老虎提前打招呼，情节站得住）；对话生动、提示语藏性格✓；道理自然不生硬✓。全文约420字。</div></div>"+
  "<div class='acc' onclick='this.classList.toggle(\"open\")'><button class='head'><span class='idx'>范3</span>《坐井观天新编》（约400字）<span class='arrow'>▸</span></button><div class='body'>小鸟又说了一次“天大得很”，青蛙却摆摆手：“你说一百遍也没用，除非我自己去看看。”<br>小鸟一愣，随即笑了：“这才对嘛！上来吧，我给你带路。”<br>青蛙蹬蹬后腿，顺着井壁一步一步往上跳。快到井口时，它忽然害怕了：外面的世界那么大，万一找不到吃的，万一遇上老鹰怎么办？它在井沿上坐了整整一夜。<br>第二天清晨，第一缕阳光照进来，暖烘烘的。青蛙深吸一口气，猛地跳了出去——哇！天真的无边无际，稻田连着青山，白云擦着头顶飞过。它看得眼睛都不够用了。风一吹，稻田翻起绿色的浪，跟井底那圈圆圆的天完全不一样。<br>青蛙跟着小鸟走了很远，看了大河，见了碧绿碧绿的湖，还认识了田野里许多新朋友。可到了晚上，它想井了：井里冬暖夏凉，多安静啊。<br>于是，青蛙白天跳出来看世界，晚上回井里睡觉。它逢人便说：“坐在井里看天，天只有井口大；跳出来看，天才大得没边。可要我说——出来看天，回井安家，都挺好！”<br>小鸟点点头：“你不但跳出了井口，还跳出了老眼光。”<br>✏️ <b>点评：</b>结局新颖✓（青蛙主动跳出，还“白天看天、回井安家”）；由果探因✓（害怕→日出壮胆→跳出去，层层连贯）；有思辨✓（两种生活各有好处，立意高一层）；心理描写细腻✓。全文约400字。</div></div>"+
  "</div></div>";}
 ,nuoman:function(L){return "<div class='tabpane' data-tab='tuozhan'>"+
  "<div class='card'><h3>🌊 真实海难档案：故事背后的历史</h3>"+
  "<div class='timeline'>"+
  "<div class='tl'><b>1870年3月17日</b><br>英伦海峡，从南安普敦到格恩西岛的航线上，“诺曼底号”与“玛丽号”相撞沉没——雨果正是根据这场真实海难，写出了这篇小说。</div>"+
  "<div class='tl'><b>没有雷达的年代</b><br>19世纪的轮船没有雷达和无线电，夜间航行全靠灯塔、经验和瞭望。大雾是那个年代海员最怕的“隐形杀手”，碰撞事故时有发生。</div>"+
  "<div class='tl'><b>“妇女儿童优先”的由来</b><br>“妇女先走”不是随便定的规矩——1852年英国“伯肯黑德号”军舰沉没时，士兵们让妇女儿童全部获救，自己大多遇难。从此“妇女儿童优先”成为国际海事传统，课文里的命令正体现了它。</div>"+
  "</div>"+
  "<div class='tipbox fun'>🤔 想一想：哈尔威船长本可以逃生，为什么选择与船同沉？——因为他是指挥者，要为全船人负责到底；他用最后的坚守，告诉所有人什么叫“忠于职守”。</div></div>"+
  "<div class='card'><h3>📖 见习水手克莱芒的日记（感人彩蛋）</h3>"+
  "<p>课文中被喊“把克莱芒救出去”的那个见习水手，长大后怎么样了？有人续写了他的日记：</p>"+
  "<p style='background:rgba(255,248,239,.6);border-radius:12px;padding:12px 14px;line-height:1.9'>亲爱的哈尔威船长，我的师傅，我的父亲：您昔日的见习水手克莱芒长大了，也成为了一名船长，走的正是从南安普敦到格恩西岛这条航线。每次经过这里，我都要鸣笛三声——这笛声是问候，是感激，是力量。</p>"+
  "<p style='font-size:13px;color:var(--muted)'>英雄会离开，但英雄的精神会被他救过的人带着，走完他没走完的航线。</p></div>"+
  "<div class='card'><h3>💡 小知识：邮船与英伦海峡</h3>"+
  "<div class='kv'><div><b>🛳️ 诺曼底号有多大？</b><br>课文中说它“装货容量六百吨，船体长二百二十尺”（约67米）。对照课文下方的注释记住：1英尺≈0.3048米。</div>"+
  "<div><b>🗺️ 航线在哪里？</b><br>南安普敦是英国南部的港口，格恩西岛是英伦海峡中的海岛——这条航线至今仍是繁忙的客货航线。</div></div>"+
  "<div class='tipbox exam'>📌 常识考点：本文体裁是<b>小说</b>（叙事写人），作者<b>雨果</b>是<b>法国</b>作家，被誉为“法兰西的莎士比亚”。</div></div>"+
  "<div class='card'><h3>🎬 背景视频 · 听听雨果先生怎么说</h3>"+
  "<div class='bili-frame'><iframe src='https://player.bilibili.com/player.html?bvid=BV1pVrwB2E4g&page=1&danmaku=0&autoplay=0&high_quality=1' scrolling='no' frameborder='no' allowfullscreen='true' loading='lazy'></iframe></div>"+
  "<p class='vnote'>📺 听听雨果先生谈“诺曼底号”遇难记 · UP主：鳍迹课件 · 时长 4分27秒 · <a class='blink' href='https://www.bilibili.com/video/BV1pVrwB2E4g' target='_blank' rel='noopener'>在B站打开 ↗</a> · <a class='blink landlink'>⛶ 横屏看</a></p>"+
  "<div class='tipbox tip'>⚡ 雨果为什么要写这个故事？他想借哈尔威船长告诉人们什么？这个视频替“雨果先生”亲口告诉你。</div></div>" +
  "</div>";}
 ,gushisan:function(L){return "<div class='tabpane' data-tab='tuozhan'>"+
  "<div class='card'><h3>🕰️ 时代坐标：把三首诗放回历史里</h3>"+
  "<div class='timeline'>"+
  "<div class='tl'><b>1127 年 · 靖康之变（一切的起点）</b><br>金兵攻破北宋都城汴京（汴州），掳走徽、钦二帝，北宋灭亡，皇室仓皇南渡，定都临安（今杭州）。《示儿》的“悲”、《题临安邸》的“讽”，都从这一年开始埋下种子。</div>"+
  "<div class='tl'><b>1141—1142 年 · 绍兴和议与岳飞之死</b><br>宋金议和，南宋正式放弃收复北方；抗金名将岳飞以“莫须有”的罪名遇害。岳飞《满江红》里“靖康耻，犹未雪”——武将没能打回来的江山，成了文人的终身之痛。</div>"+
  "<div class='tl'><b>1210 年 · 陆游临终写《示儿》</b><br>陆游生于 1125 年，两岁时就跟着家人在战乱中逃难。他一生主张抗金却屡遭罢免，85 岁临终写下这首“遗嘱诗”——此时距靖康之变已过去 80 多年，“九州同”仍是一场空梦。</div>"+
  "<div class='tl'><b>1839 年 · 己亥年的中国</b><br>龚自珍辞官南归的这一年，林则徐正在广东虎门销烟；第二年，鸦片战争爆发。龚自珍大声呼唤“不拘一格降人才”——喊的正是晚清最缺的变革与人才。</div>"+
  "</div>"+
  "<div class='tipbox fun'>🤔 发现了吗？陆游、林升、龚自珍，再加上一位岳飞——相隔几十年甚至几百年，牵挂的却是同一件事：国家的命运。</div></div>"+
  "<div class='card'><h3>🗺️ 一图读懂：王师北定在哪里</h3>"+
  "<svg viewBox='0 0 640 330' width='100%' role='img' style='max-width:520px;display:block;margin:6px auto'>"+

  "<text x='320' y='84' text-anchor='middle' font-size='13' fill='#791F1F'>中原 · 黄河流域 · 故都汴州（今开封）</text>"+

  "<text x='320' y='254' text-anchor='middle' font-size='13' fill='#0C447C'>行在临安（今杭州）· 山阴（今绍兴）＝陆游家乡</text>"+
  "<path d='M190 198 L190 118' stroke='#A32D2D' stroke-width='2.5' fill='none'/>"+
  "<path d='M182 128 L190 114 L198 128' stroke='#A32D2D' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/>"+
  "<text x='204' y='162' font-size='14' font-weight='700' fill='#A32D2D'>王师北定：向北进军，收复失地</text>"+
  "</svg>"+
  "<div class='kv'><div><b>📍 写诗的地点</b><br>1210 年初，85 岁的陆游在山阴（今浙江绍兴）家中病重临终——人在东南，家在东南，家祭的祠堂也在东南。</div>"+
  "<div><b>🧭 “北”指哪里</b><br>北方失地——中原地区（黄河流域），含被占领的北宋故都汴州。1127 年靖康之变后，宋金以淮河——大散关一线为界，北方全归金国。</div></div>"+
  "<div class='kv'><div><b>⚔️ 为什么叫“北定”</b><br>朝廷在东南，失地在北方：想收复，军队就必须向北进军。“王师北定中原日”，就是他想象中宋军北伐成功的那一天。</div>"+
  "<div><b>💔 雪上加霜的现实</b><br>写诗前两年（1206 年）朝廷发动“开禧北伐”，陆游兴奋声援——结果北伐失败、再次和议。两年后，他带着这个未圆的梦离开人世。</div></div>"+
  "<div class='tipbox fun'>🤔 人在东南，心在北方——这就是为什么遗嘱不提家产、只提国家：家祭的香火在南方，他等的消息在北方。</div></div>"+
  "<div class='card'><h3>🔎 隐藏知识一：诗题里就藏着信息</h3>"+
  "<div class='kv'>"+
  "<div><b>《示儿》· “示”是“给……看”</b><br>这是写给儿子们看的遗嘱——诗题告诉了你这首诗的读者是谁。把最深的感情，写成一篇“家庭留言”。</div>"+
  "<div><b>《题临安邸》· “题”是题写，“邸”是旅店</b><br>写在临安旅店墙上的诗——诗题告诉了你这首诗写在哪里、怎么被传播的。</div>"+
  "<div><b>《己亥杂诗》· “己亥”是干支纪年</b><br>“己亥”=1839 年，“杂诗”=随感而写的诗——诗题告诉了你写作时间和体裁。</div></div>"+
  "<div class='kv'><div><b>🗓️ 干支纪年小知识</b><br>天干（甲乙丙丁……）10 个＋地支（子丑寅……）12 个，两两相配，60 年一轮回。上一个己亥年是 2019 年，再上一个就是 1839 年——掐指一算，历史就在身边。</div>"+
  "<div><b>📏 体裁彩蛋</b><br>三首都是<b>七言绝句</b>：四句、每句 7 字、共 28 字。绝句讲究押韵——找一找每首的韵脚：空/同/翁、楼/休/州、雷/哀/才，一读就顺口。</div></div></div>"+
  "<div class='card'><h3>🔎 隐藏知识二：藏在字词里的秘密</h3>"+
  "<div class='kv'>"+
  "<div><b>“元”＝“原”</b><br>“死去<b>元</b>知万事空”的“元”就是“原”（本来）——古人的书写习惯，不是错别字，默写时可别改成“原”。</div>"+
  "<div><b>“但”＝“只”</b><br>“<b>但</b>悲不见九州同”的“但”是“只”的意思（古今异义）——不是“但是”。这类字还有“走”（跑）、“汤”（热水）。</div></div>"+
  "<div class='kv'>"+
  "<div><b>两个成语的“出生地”</b><br>“<b>万马齐喑</b>”和“<b>不拘一格</b>”都出自《己亥杂诗》这同一首诗——一首 28 字的小诗，贡献了两个今天常用的成语。</div>"+
  "<div><b>这首诗原本是篇“祷告文”</b><br>龚自珍在诗前自己加了一条小注：路过镇江时，正遇上祭祀风神雷神的庙会，道士请他写一篇祷告文（“青词”），他提笔就写下了这首诗——一篇应景文字，成了千古名篇，靠的是满腔真情。</div></div>"+
  "<div class='kv'><div><b>外公是文字学大家</b><br>龚自珍的外公段玉裁，是清代注解《说文解字》的权威学者。他从小受文字训诂熏陶，认字功夫一流——后来却把功夫用在了写诗和呼唤变革上。</div>"+
  "<div><b>一年 315 首</b><br>《己亥杂诗》是龚自珍 1839 年辞官南归、往返途中陆续写下的——差不多一天一首，像一本“诗歌日记”。</div></div></div>"+
  "<div class='card'><h3>🔗 隐藏知识三：同一本书里的“跨课牵手”</h3>"+
  "<div class='timeline'>"+
  "<div class='tl'><b>第 12 课作者 → 盛赞第 11 课诗人</b><br>梁启超读陆游的诗集，激动地写下：“诗界千年靡靡风，兵魂销尽国魂空。集中什九从军乐，<b>亘古男儿一放翁</b>！”——写《少年中国说》的人，给写《示儿》的人颁了“千年爱国奖”。</div>"+
  "<div class='tl'><b>第 11 课诗人 → 预言第 13 课的悲剧</b><br>龚自珍 1841 年去世。他担心的“衰世”一步步成真——19 年后的 1860 年，圆明园化为灰烬。第 11 课敲响的警钟，在第 13 课变成了现实。</div>"+
  "<div class='tl'><b>同一个时代，两种声音</b><br>林升在杭州旅店题诗质问“几时休”，陆游在绍兴家中写遗嘱盼“北定”——他们互不相识，却唱出了同一个南宋的悲愤。一个把诗写在墙上给路人看，一个把诗写给儿孙看。</div>"+
  "</div></div>"+
  "<div class='card'><h3>🖋️ 三位诗人档案：从各个方面认识他们</h3>"+
  "<div class='kv'>"+
  "<div><b>陆游（1125—1210）· 存诗第一人</b><br>自称“六十年间万首诗”，现存 9300 多首，是中国文学史上存诗最多的诗人。1172 年他到抗金前线南郑从军，短短八个月的军旅生涯，成了他一生最难忘的记忆。仕途屡遭罢免，却至死不改主张——临终时儿孙绕膝，他唯独放不下北方。</div>"+
  "<div><b>林升 · 一首诗留名千古</b><br>南宋一位默默无闻的读书人，史书上几乎查不到他的生平。他把诗题在临安一家旅店的墙上（“邸”就是旅店），却凭这一首诗被后人记了八百多年——有时候，说出真话比出名更重要。</div>"+
  "<div><b>龚自珍（1792—1841）· 先知先觉的思想家</b><br>清代思想家、诗人，主张变革图强，曾支持林则徐禁烟。《己亥杂诗》共 315 首，是他辞官南归途中一路写下的“日记体诗集”——中国诗歌史上规模最大的组诗之一。</div></div>"+
  "<div class='tipbox story'>📖 冷知识：《题临安邸》能流传下来，靠的是“题壁诗”的风气——唐宋诗人爱把诗写在驿站、旅店的墙壁上“发表”，过路人抄录传播，就像今天的朋友圈。</div></div>"+
  "<div class='card'><h3>📖 诗句接力：他们互相“接棒”</h3>"+
  "<div class='timeline'>"+
  "<div class='tl'><b>岳飞《满江红》· “靖康耻，犹未雪”</b><br>与《示儿》同一场国耻的两种回响——武将没打回来的江山，成了文人至死的遗憾。</div>"+
  "<div class='tl'><b>陆游《十一月四日风雨大作》· “夜阑卧听风吹雨，铁马冰河入梦来”</b><br>写《示儿》前 18 年，68 岁的陆游梦里还在战场上冲锋。他不是临终才着急，是急了一辈子。</div>"+
  "<div class='tl'><b>龚自珍《己亥杂诗·其五》· “落红不是无情物，化作春泥更护花”</b><br>同一组 315 首诗里的另一首名篇：辞官就像落花，但落花化作春泥，仍要守护花开——离开官场，报国之心不改。</div>"+
  "<div class='tl'><b>文天祥《过零丁洋》· “人生自古谁无死，留取丹心照汗青”</b><br>南宋最后的光芒：陆游盼望的“王师北定”终究没有等到，但这份“丹心”传给了后来的英雄。这首诗，你初中就会学到。</div>"+
  "</div></div>"+
  "<div class='card'><h3>💡 读诗小锦囊</h3>"+
  "<div class='kv'>"+
  "<div><b>朗读节奏（七言 2/2/3）</b><br>死去/元知/万事空，但悲/不见/九州同。按节奏读，情感自然就出来了；《题临安邸》最后两句要读出质问的语气。</div>"+
  "<div><b>“行在”的秘密</b><br>南宋官方把临安叫作“行在”（皇帝临时驻地），名义上随时准备打回汴州——可权贵们“直把杭州作汴州”，这层遮羞布被林升一语戳穿。</div>"+
  "<div><b>默写高频榜</b><br>《示儿》全诗默写率最高；易错字：祭、乃、恃、擞；《题临安邸》的“邸”、《己亥杂诗》的“亥”也常考注音。</div></div>"+
  "<div class='tipbox exam'>📌 理解题高频：三首诗情感的“同”与“不同”——同：都心系国家；异：陆游“悲盼”、林升“讽愤”、龚自珍“呼盼”。答题时记得“诗句+背景+情感”三步走。</div></div>"+
  "<div class='card'><h3>🤔 想一想，说一说</h3>"+
  "<div class='kv'><div><b>如果你是陆游的孩子</b><br>家祭那天，你会把哪些“好消息”告乃翁？今天的中国，哪些变化可以告慰这位 85 岁的老人？</div>"+
  "<div><b>如果你是林升</b><br>看到“游人醉”的场面，你会在旅店的墙上题一句什么诗？试着替他再写两句。</div></div>"+
  "<div class='card'><h3>🎬 背景视频 · 5分钟看完陆游一生</h3>"+
  "<div class='bili-frame'><iframe src='https://player.bilibili.com/player.html?bvid=BV1nqT56fExT&page=1&danmaku=0&autoplay=0&high_quality=1' scrolling='no' frameborder='no' allowfullscreen='true' loading='lazy'></iframe></div>"+
  "<p class='vnote'>📺 陆游来讲《示儿》！5分钟看完陆游的一生 · UP主：布可星球古文奇遇 · 时长 5分23秒 · <a class='blink' href='https://www.bilibili.com/video/BV1nqT56fExT' target='_blank' rel='noopener'>在B站打开 ↗</a> · <a class='blink landlink'>⛶ 横屏看</a></p>"+
  "<div class='tipbox tip'>⚡ 陆游活了85岁，写了几千首诗，一辈子盼着“九州同”。了解他的一生，再读《示儿》感受完全不同。</div></div>" +
  "<div class='tipbox tip'>⚡ 小结：读爱国诗，先读“时代背景”这张底牌——诗人的每一个字，都是写给那个时代的回答。</div></div></div>";}
 ,snzgs:function(L){return "<div class='tabpane' data-tab='tuozhan'>"+

  "<div class='tl'><b>1900 年 · 一篇檄文</b><br>文章发表后迅速传遍全国，“少年中国”“少年强则国强”成为一代代中国人的精神口号。《觉醒年代》等影视剧中反复引用。</div>"+
  "<div class='tl'><b>“老大帝国” vs “少年中国”</b><br>当时西方讥讽中国是“老大帝国”（衰老的国家）。梁启超反其道而行：朝廷虽老，但中国如少年——正在长身体的年纪，一切皆有可能。</div>"+

 ,ymbyh:function(L){return "<div class='tabpane' data-tab='tuozhan'>"+
  "<div class='card'><h3>🌟 圆明园十问十答（精选四问）</h3>"+
  "<div class='timeline'>"+
  "<div class='tl'><b>圆明园到底多大？</b><br>占地约 350 公顷（约 500 个足球场），水面面积约 140 公顷。清代皇帝每年有半年时间在这里“园居理政”——它其实是当时的“第二皇宫”。</div>"+
  "<div class='tl'><b>“大水法”是什么？</b><br>西洋楼景区的大型喷泉Group建筑，今天圆明园遗址最著名的标志就是它的残石——课本插图上那几根石柱，正是它。</div>"+
  "<div class='tl'><b>十二生肖兽首去哪了？</b><br>海晏堂前喷泉上的 12 个兽首人身像，1860 年被掠走流散海外。至今牛、猴、虎、猪、马、鼠、兔七尊已回归，龙首疑似在台湾，蛇、鸡、狗、羊四尊下落不明。</div>"+
  "</div>"+

  "<div class='acc open' onclick='this.classList.toggle(\"open\")'><button class='head'><span class='idx'>范1</span>《二十年后的家乡》（约420字）<span class='arrow'>▸</span></button><div class='body'>“本次列车终点站——天津西站。”2046 年 10 月，我从外地出差回来，坐上了真空管道列车。从前三个小时的路程，如今只要四十分钟。<br>走出车站，我差点认不出这座城。记得小时候，海河一到夏天就泛着腥味；如今河水清得能看见水草摆动，成群的小鱼在桥墩边穿梭。河两岸的楼顶上，一块块“能量瓦”在阳光下闪着淡蓝色的光——整座楼自己会发电。马路上听不见一声鸣笛，无人驾驶的“云轨”车厢悬在半空，安静地滑行；堵车，成了词典里的老词。<br>我回到母校。教室还是那间教室，黑板却成了一整面全息屏。历史课上，大沽炮台“复原”在孩子们眼前，硝烟仿佛就在头顶炸开。窗外那棵老槐树竟然还在，比记忆里粗了一圈。我伸手摸了摸它的树皮——二十年的时光，一下子涌了回来。<br>变化的是家乡的模样，不变的是它的温度：早点的香味还在，街坊的乡音还在，老槐树还站在校门口，替一代代人记着放学路上的笑声。<br>二十年，家乡交出了一份漂亮的答卷。而我，也想成为答卷上的一笔。<br>✏️ <b>点评：</b>提纲清晰✓（交通→环境→学校三段）；今昔对比鲜明✓（三小时vs四十分钟、腥味vs清水）；想象有依据✓（管道列车、能量瓦均有现实原型）；结尾情感真挚✓。全文约420字。</div></div>"+
  "<div class='acc' onclick='this.classList.toggle(\"open\")'><button class='head'><span class='idx'>范2</span>《母校变形记》（约410字）<span class='arrow'>▸</span></button><div class='body'>二十年后的教师节，我以校友的身份回母校参观。<br>校门口没有保安，一道柔和的光栅轻轻扫过我的校友证：“欢迎回家。”走进校园，操场竟然“长”在了楼顶——地下是停车场，楼顶铺着会呼吸的草坪，风雨无阻。<br>最神奇的是教室。上课铃一响，整面墙亮了起来：讲古诗时，窗外“下”起了课件里的雪；上自然课，一株细胞结构的花在课桌上缓缓旋转放大，每个同学都能伸手“解剖”它。班主任李老师头发白了些，笑容却没变。她说现在老师不用批改作业了，AI 助手会给出每道题的诊断，她把省下的时间都用来跟学生聊天——“分数由机器看，孩子由老师看。”这句话，我记在了本子上。<br>放学路上，我看见一群小学生在楼顶草坪上给菜地浇水。那是学校的“责任田”：每种一棵菜，就有一条数据曲线记录它的生长。孩子们比我们当年更懂土地。<br>走出校门，我回头看了一眼。二十年，母校的围墙没变，格局没变，变的是里面的人学得更快乐、教得更用心。科技改变了教育的样子，却没改变教育的初心。<br>✏️ <b>点评：</b>聚焦“学校”一个方面写深写透✓；细节具体✓（全息屏、AI 批改、楼顶菜地）；有金句✓（“分数由机器看，孩子由老师看”）；情感落点温暖✓。全文约410字。</div></div>"+
  "<div class='acc' onclick='this.classList.toggle(\"open\")'><button class='head'><span class='idx'>范3</span>《外婆家的新炊烟》（约420字）<span class='arrow'>▸</span></button><div class='body'>二十年后回外婆家，村口那条石子路变成了会发光的步行道，我却在寻找一样东西——炊烟。<br>小时候，每次回外婆家，远远看见屋顶那缕白白的炊烟，脚步就不由自主地加快：那是外婆在烧饭。后来村里通了天然气，炊烟渐渐少了，我总觉得少了点什么。<br>推开院门，外婆正戴着 AR 眼镜跟城里的大夫“面对面”问诊，智能药箱按处方把药分好。厨房里，做饭机器人颠着小锅，外婆在一旁指挥：“盐少放点儿，你外孙口味淡。”——她学得可真快！<br>饭桌上，我故意问：“外婆，现在什么都是机器人干，您不无聊吗？”外婆把一筷子青菜放进我碗里：“机器人会做饭，可它不知道你爱吃锅巴。那口老灶我留着呢，过年蒸馒头，还得靠它。”我顺着她的手指看去，老灶台擦得锃亮，烟囱口正冒着细细的一缕烟。<br>原来科技不是把过去统统换掉，而是把辛苦的部分接过去，把珍贵的部分留下来。新农村的医疗、互联网让外婆的晚年既省心又自在，而那缕炊烟，还在替她守着一家人的团圆。<br>离村时我又回头看了一眼——新炊烟，旧味道，都是家的方向。<br>✏️ <b>点评：</b>以“炊烟”为线索串起今昔✓；科技与温情双线并行✓（AR 问诊+老灶台）；人物有神✓（外婆的台词鲜活）；立意高一筹✓（科技留下珍贵的东西）。全文约420字。</div></div>"+

function reorderJj(pane){
  if(!pane) return;
  var kids=Array.prototype.slice.call(pane.children);
  kids.forEach(function(el){
    var h3=el.querySelector?el.querySelector("h3"):null;
    var txt=(h3?h3.textContent:"")+" "+(el.id||"");
    var ord=99;
    for(var i=0;i<JJ_LEARN_ORDER.length;i++){
      if(JJ_LEARN_ORDER[i][0].test(txt)){ ord=JJ_LEARN_ORDER[i][1]; break; }
    }
    el.dataset.ord=ord;
  });
  kids.sort(function(a,b){return (a.dataset.ord||99)-(b.dataset.ord||99);});
  kids.forEach(function(el){ pane.appendChild(el); });
}

  ["🏛️ 卡片一 · “万园之园”有多大","圆明园由圆明园、万春园、长春园组成，所以叫“圆明三园”；周围还有 100 多个小园环绕。从 1707 年开始营建，历经六代皇帝、150 多年才建成。法国大文豪雨果这样写它：“在世界的一隅，存在着人类的一大奇迹，这个奇迹就是圆明园。”"],
  ["🎨 卡片二 · 画里的圆明园","清朝宫廷画师绘制了《圆明园四十景图咏》，把园中每个景区都画了下来——正大光明、蓬岛瑶台、武陵春色……这是今天想象圆明园昔日辉煌最珍贵的依据。可惜原作在 1860 年被掠走，现藏于法国国家图书馆。"],
  ["⚔️ 卡片三 · 1860 年的中国","那一年，第二次鸦片战争进入尾声。英法联军一路打进北京，咸丰皇帝仓皇逃往热河。10 月，联军闯入圆明园，大肆抢掠之后放火焚烧——一座造了一个多世纪的园林，三天之内化为灰烬。"]],
 ym1:["🗺️ 圆明三园与“众星拱月”","圆明园、万春园、长春园三园相连，组成“圆明三园”；东、西、南三面还有 100 多个小园，像星星围着月亮一样环绕。园中最著名的景区有 40 处，被画进《圆明园四十景图咏》——课文里的“蓬岛瑶台”“武陵春色”都是其中之一。"],
 ym2:["🏛️ 西洋楼与大水法","圆明园西部有一组欧式宫殿建筑群，叫“西洋楼”，大水法是其中的喷泉景观，用白色大理石建造，造型精巧。今天你在圆明园遗址公园看到的几根白色石柱残迹，就是大水法的遗骸——它们常常出现在历史课本的封面上。"],
 ym3:["🦁 流失的十二生肖兽首","海晏堂前有一组人身兽首铜像，是十二生肖：每到一家时辰，对应的兽首就轮流喷水，正午十二个一起喷，设计精妙绝伦。1860 年它们被联军掠走，流失海外 160 多年。到今天，牛首、猴首、虎首、猪首、马首、鼠首、兔首已陆续回归祖国——每一次回归，都是一次“勿忘国耻”的提醒。"],
 ym4:["🔥 1860 年 10 月，圆明园经历了什么","10 月 6 日，英法联军占领圆明园，随后大肆抢劫；10 月 18 日和 19 日，三千多名侵略者奉命在园内放火。大火烧了三天三夜，园中 300 多名太监、宫女葬身火海。远在欧洲的雨果愤怒地写道：“有一天，两个强盗闯入了圆明园，一个强盗大肆掠夺，另一个强盗纵火焚烧。”"],
 gushisan_before:[
  ["🏹 卡片一 · 靖康之变与南宋偏安","1127 年，金军攻破北宋都城，掳走徽、钦二帝，北宋灭亡，史称“靖康之变”。宋室仓皇南渡，定都临安（今杭州），北方大片国土沦陷——从此，“收复中原”成了南宋人一百年都没能圆的梦。"],
  ["🖋️ 卡片二 · 陆游与《示儿》","陆游（1125—1210），南宋爱国诗人，一生盼望北伐收复中原，却屡遭排挤、壮志难酬。这首诗写于 1210 年，是他 85 岁临终前留给儿子的“遗嘱”——等了一辈子的消息没等到，就成了放不下的遗愿。"],
  ["🕯️ 卡片三 · 1839 年的龚自珍","1839 年（己亥年），龚自珍辞官南归，一路目睹清朝“万马齐喑”的死气：官场僵化、人才受压、危机四伏。他在途中写下 315 首诗，总称《己亥杂诗》——课本里这首，是其中最响亮的一声呐喊。"]],
 gs1:["📜 《示儿》写于什么时候","《示儿》写于 1210 年，是陆游的临终绝笔。“王师”指南宋的朝廷军队；“九州同”指全国统一——九州是古代中国的代称。诗人临终惦记的不是家产，而是国家统一那天，家祭时别忘了把这个好消息告诉他。"],
 gs2:["🏙️ 杭州与汴州","汴州就是北宋的都城开封，1127 年已经沦陷；杭州是南宋的“行在”（临时都城）。林升在杭州的旅馆墙上题下这首诗：“直把杭州作汴州”——讽刺权贵们把逃难的落脚点当成了安乐窝，歌舞不休，全然忘了故都沦陷、国土未收。"],
 gs3:["🕯️ 《己亥杂诗》的由来","1839 年是己亥年，龚自珍辞官离京南归，途中写下 315 首绝句，总称《己亥杂诗》。“万马齐喑”用万马的沉默比喻社会死气沉沉的局面。课本里这首是他最著名的一声呐喊：盼望社会变革，不拘一格地涌现人才。"]
 ,snzgs_before:[
  ["⚔️ 卡片一 · 1900 年的时局","1900 年，八国联军入侵北京，史称“庚子国变”：国家被瓜分豆剖，条约一个接一个，赔款压弯了国人的腰。列强讥笑中国是“东亚病夫”——“老大帝国”“一盘散沙”的说法满天飞。也正是在这样的绝境里，维新人士渴望变革，把目光投向了“少年”。"],
  ["🖋️ 卡片二 · 梁启超与《少年中国说》","梁启超是戊戌变法的领袖之一。变法失败后他流亡日本，1900 年在《清议报》上发表了《少年中国说》。面对西方“中国已老”的讥讽，他奋笔反驳：中国不是垂暮的老人，而是初升的少年——文章一发表，“少年中国”的呐喊便传遍全国。"],
  ["🌟 卡片三 · 文中的八个比喻","红日（前途光明）、黄河（势不可挡）、潜龙（潜能爆发）、乳虎（初生之威）、鹰隼（跃跃欲试）、奇花（含苞待放）、干将（锋芒初露）……每个比喻的画面不同，但都指向同一件事：新生的力量。梁启超用一连串画面告诉国人——中国的希望，正在“开始”里。"]]
 ,sn1:["🧑‍🤝‍🧑 “少年中国”与“中国少年”的区别","“少年中国”是理想——梁启超心目中那个朝气蓬勃、与天不老的新中国；“中国少年”是力量——创造这个新中国的千千万万中国少年。一个是蓝图，一个是建设者：少年奋发图强，少年中国才能站起来；国有希望，少年更有奔头——二者互为因果、互相成就。"],
 sn2:["⚔️ “干将发硎”的典故（吴国名剑）","干将（gān jiāng）是古代吴国铸剑名师，与妻子莫邪一起铸成一对名剑，雄剑就叫“干将”。硎（xíng）是磨刀石。“干将发硎，有作其芒”是说：宝剑刚在磨刀石上磨出锋刃，寒光四射——比喻少年中国的才干与锋芒刚刚显露，来日不可限量。"],
 sn3:["📣 “美哉壮哉”的感叹层次","这两句感叹不是简单重复，而是层层递进：第一句“美哉我少年中国”赞国家——赞美理想中的新中国与天地共存；第二句“壮哉我中国少年”赞人——赞美创造它的少年与祖国同在、力量无穷。先国后人、由理想到力量，情感步步推高，最后喷薄而出。"]
 ,mlf_before:[
  ["🎭 卡片一 · 京剧与旦角","京剧是中国的“国粹”，至今两百多年历史。戏里的女性角色叫“旦角”——早期舞台上不许女性演戏，旦角全由男演员扮演。梅兰芳是男旦大师：台上扮女子，台下是男子，所以登台必须把胡须剃得干干净净——这是理解“蓄须”分量的前提：蓄了须，就再也演不了旦角。"],
  ["🖋️ 卡片二 · 梅兰芳其人","梅兰芳（1894—1961），京剧表演艺术大师，“四大名旦”之首，开创“梅派”艺术，代表作《贵妃醉酒》《霸王别姬》。他曾访美、访苏演出，轰动世界，让京剧第一次走向国际舞台。就是这样一位世界级艺术家，抗战期间日本人多次威逼利诱请他演出——他一次都没有答应。"],
  ["⏳ 卡片三 · 八年拒演时间线","1937 年抗战爆发，梅兰芳避居香港，深居简出不再登台；1941 年香港沦陷，他返回上海，蓄起胡须明志；没有了经济来源，他卖掉北京的房子度日；日本人以军法相逼，他请医生打伤寒预防针装病，险些丧命；1945 年抗战胜利，他当即剃须复台——整整八年，一场戏都没有为侵略者演过。"]]
 ,ml1:["🧔 蓄须的分量","京剧旦角扮演女性，登台必须剃净胡须——这是行规，也是梅兰芳几十年的职业习惯。所以“蓄须”对他说，就等于公开宣告：我不能、也不愿再登台。直接说“不”，对方还能逼还能哄；胡子长在脸上，一天不剃就一天演不了——这是他能坚持的、最彻底的拒绝方式。"],
 ml2:["💉 打针装病的凶险","日本人要庆祝“大东亚圣战”，逼梅兰芳登台。他请医生朋友给他打伤寒预防针——这种针会让人连日发高烧，本身就有致命风险。日本军医摸到他“滚烫滚烫的额头”，才看不出破绽。一个“滚烫滚烫”，写的是装病成功，也是拿性命做赌注的代价——梅兰芳为此差点儿丢了性命。"],
 ml3:["🎉 复台那一刻","1945 年抗战胜利的消息一传来，梅兰芳当即剃了胡须：“胜利了，我该登台演出了！”没有犹豫、没有讨价还价。对一个视舞台为生命的艺术家，八年不登台是最重的代价——但他用这八年“荒废”的艺术生命，换来了民族气节。 所以课文说：高超的表演艺术让人喜爱，民族气节更令人敬佩。"]
 ,guihuayu_before:[
  ["🖋️ 卡片一 · 作者琦君","琦君（1917—2006），原名潘希真，浙江温州人，当代著名女作家，被称为“台湾文坛上闪亮的恒星”。她的散文大多写故乡的人、事、物——课文里摇桂花的记忆，就来自她的童年。"],
  ["🌊 卡片二 · 离乡的岁月","1949 年，琦君离开大陆去了台湾，从此再没回到童年生活的家乡。故乡靠海，八月台风季收桂花、摇桂花、送邻居做糕饼——这些画面隔着一片海，越隔越想念。《桂花雨》就是她定居台湾后用文字“回家”的一次。"],
  ["🍂 卡片三 · 桂花的用处与乡愁","桂花晒干可以泡茶、做糕饼，课文里母亲还要“送一箩给胡家老爷爷，送一箩给毛家老婆婆”——小小桂花，联结着乡情。古人写“举头望明月，低头思故乡”，琦君写“好香的雨啊”——时代不同，乡愁一样深。"]]
 ,gh1:["🌧️ 母亲为什么天天担心台风","课文里故乡“靠海，八月是台风季节”。台风一来，风雨会把桂花打落在泥里——课文说“被风雨吹落，比摇下来的香味就差多了”。所以桂花一开，母亲就走一回、念一回“可别来台风啊”，一看到阴云密布，就赶紧叫大家提前摇桂花。操心的是桂花，惦记的是一家人的收成和给邻居的心意。"]
 ,gh2:["🌧️ “桂花雨”这个名字怎么来的","摇桂花时，大人抱着树，孩子使劲摇，桂花纷纷落下来，“满头满身都是桂花”——阵阵花香扑面而来，可不就像下了一场香喷喷的雨！题目“桂花雨”就诞生在这个画面里。它既是童年的快乐，也是作者长大后最想念的故乡风景——所以结尾说“又想起了……那摇落的阵阵桂花雨”。"]
 ,gh3:["🏞️ 杭州的桂花更香，母亲为什么说不香","杭州有一处小山“全是桂花树，花开时那才是香飘十里”，论香味未必输给家乡。可母亲说“这里的桂花再香，也比不上家乡院子里的桂花”——她不是用鼻子闻，是用<b>感情</b>在“闻”：家乡的桂花连着她的童年、亲人和人情往来，所以永远是最香的。这句话是全文思乡之情的点睛之笔。"]
 ,luohuasheng_before:[
  ["🖋️ 卡片一 · 作者许地山","许地山（1894—1941），出生于台湾台南，现代小说家、散文家、学者，“文学研究会”发起人之一。文中那位借花生教育孩子的父亲，正是他的父亲、台湾著名爱国诗人许南英——《落花生》写的是他真实的童年。"],
  ["📚 卡片二 · 1922 年与《空山灵雨》","《落花生》写于 1922 年，收入散文集《空山灵雨》，是他回忆童年生活的散文。后来他给自己取笔名“落华生”（华，同“花”），用一辈子提醒自己：像花生一样朴实无华、默默奉献。"],
  ["🕯️ 卡片三 · “借物喻人”的写法传统","借一样事物的特点，讲做人的道理，叫“借物喻人”：花生→做有用的人；蜡烛→奉献的老师；蜜蜂→勤劳的人；粉笔→默默耕耘的园丁。写这类作文的两步：先写物的特点，再由物及人——道理自然流出，不喊口号。"]]
 ,lh1:["🌱 “居然”里的科学：花生为什么藏在地里","很多植物把果实挂在枝头，花生却很特别：地上开着黄花，花落以后，子房柄钻进土里，果实在<b>地下</b>结出来——所以“必须挖起来才知道”它有没有结果、结了多少。课文里姐弟几个第一次种花生，没指望能成，却“居然收获了”——一个“居然”，写尽出乎意料的惊喜。"]
 ,lh2:["⚖️ 父亲拿花生和谁比、比出了什么","父亲把花生和桃子、石榴、苹果作对比：它们把鲜红嫩绿的果实高高地挂在枝头上，使人一见就生爱慕之心；花生却矮矮地长在地上，果实埋在地里，必须挖起来才知道。一比就清楚了：花生<b>朴实无华、默默奉献</b>。父亲不是说要否定好看，而是提醒：不能只求外表体面，要做真正有用的人。"]
 ,lh3:["✒️ 笔名“落华生”的故事","《落花生》发表后，许地山给自己取了笔名“落华生”（华，同“花”）。他一生践行父亲的话：求学、任教、写作，都在踏实做事。1941 年他积劳成疾，病逝于香港，年仅 49 岁——朋友们说，他就像自己笔下的花生。一篇童年散文，成了一生的座右铭。"]
 ,zhenzhuniao_before:[
  ["🖋️ 卡片一 · 作者冯骥才","冯骥才（1942— ），天津人，当代著名作家、文化学者，代表作有《俗世奇人》《雕花烟斗》等。他还花了很多年抢救和保护民间老街、古建筑，被称为“民间文化的守护人”。《珍珠鸟》来自他真实的生活经历。"],
  ["🐦 卡片二 · 珍珠鸟小档案","珍珠鸟因羽毛上有珍珠似的白点而得名，学名叫斑胸草雀，原产澳大利亚，天生胆小怕人——课文第 2 段一句“有人说，这是一种怕人的鸟”，就是这个科学背景。正因为它天生怕人，“信赖”才显得那么珍贵。"],
  ["🌿 卡片三 · “我”做对了什么","细读课文你会发现：“我”从头到尾都在为小鸟着想——用吊兰垂蔓蒙盖鸟笼，给它安全又幽暗的家；雏鸟出生后“决不掀开叶片往里看”；小鸟啄笔尖时“不动声色地写”；它睡着时“轻轻抬一抬肩”。信赖不是求来的，是这样一点点做出来的。"]]
 ,zz1:["🌿 为什么要用垂蔓蒙盖鸟笼","珍珠鸟天生怕人，最需要的是安全感。“我”用吊兰长长的、串生着小绿叶的垂蔓蒙盖在鸟笼上，它们“就像躲进深幽的丛林一样安全”——叫声也就“格外轻松自在”了。这盆吊兰是信赖的起点：先给鸟一个不被打扰的家，才有后面一步步的靠近。"]
 ,zz2:["🐦 珍珠鸟小档案（它凭什么“怕人”）","珍珠鸟学名斑胸草雀，原产澳大利亚，天生胆小怕人。雏鸟的样子课文写得像画一样：“红嘴红脚，灰蓝色的毛，只是后背还没生出珍珠似的圆圆的白点。它好肥，整个身子好像一个蓬松的球儿。”——颜色一个不落，“珍珠”白点还没长齐，说明它还是个雏儿。"]
 ,zz3:["😴 肩头入睡：信赖画成的一幅画","“这小家伙竟趴在我的肩头睡着了，银灰色的眼睑盖住眸子，小红脚刚好被胸脯上长长的绒毛盖住。”连睡姿都写得这么细——因为“我”看得既近又久，一动不敢动。小鸟能在人的肩头睡熟，说明它对“我”完全信赖、毫无戒备。“我轻轻抬一抬肩，它没醒，睡得好熟！还咂咂嘴，难道在做梦？”——这就是课文说的“美好的境界”。"]

  ["🧲 卡片二 · 选材方向清单","陪伴型：毛绒玩具、小台灯、自行车——天天陪着你，故事最多；纪念型：奶奶织的围巾、比赛赢来的奖牌、朋友送的礼物——藏着一个人、一件事；观赏型：风铃、贝壳、水晶球——看到它就开心；照料型：一盆多肉、蚕宝宝——你付出过辛苦，感情最深。选物秘诀：不选最贵的，选最有故事的——“来历+经历”才是“心爱”的底气。"],

function cardPop(title,html){
  var mask=document.getElementById("srcMask");
  if(!mask){
    mask=document.createElement("div");mask.id="srcMask";mask.className="cardmask";
    mask.innerHTML="<div class='cardpop'><button class='closex' onclick='closeCard()'>✕</button><div id='srcPopBody'></div></div>";
    document.body.appendChild(mask);
    mask.addEventListener("click",function(e){ if(e.target===mask) closeCard(); });
  }
  mask.querySelector("#srcPopBody").innerHTML="<h4>"+title+"</h4>"+html;
  mask.classList.add("show");
}
function showCard(key){
  var d=SRC[key]; if(!d) return;
  cardPop(d[0],"<p>"+d[1]+"</p>");
}
function showPack(key){

function closeCard(){var m=document.getElementById("srcMask"); if(m)m.classList.remove("show");}

/* ===================== 提纲生成器（二十年后的家乡） ===================== */
var TG_ASPECTS=[["环境","🌳 环境变化","例：河道变清了，屋顶花园成了每栋楼的标配"],["交通","🚄 交通变化","例：磁悬浮公交沿线穿行，堵车成了历史"],["学校","🏫 学校变化","例：教室有全息投影，可以“走进”课文里的场景"],["工作","💼 工作变化","例：爸爸妈妈在家里的全息办公室上班，不出差了"],["家","🏠 家的变化","例：老房子智能改造，外婆用语音就能关好所有门窗"],["医疗","🏥 医疗变化","例：社区诊所就能远程请大医院专家看病"],["饮食","🍜 饮食变化","例：家乡小吃有了标准化工厂，味道一点没变"],["通讯","📱 通讯变化","例：戴上眼镜就能和远方亲人“面对面”吃年夜饭"]];
var tgState={sel:[],rows:{},detail:{},text:""};
function tgRender(){
  var box=document.getElementById("tg-aspects");
  if(!box) return;
  box.innerHTML="<div style='font-weight:900;font-size:14px;margin-top:6px'>① 选择 2~3 个变化方面（已选 "+tgState.sel.length+" / 3）</div>"+
    TG_ASPECTS.map(function(a){
      var on=tgState.sel.indexOf(a[0])>=0;
      return "<button class='tg-chip"+(on?" on":"")+"' onclick='tgToggle(\""+a[0]+"\")'>"+a[1]+(on?" ✓":"")+"</button>";
    }).join("")+
    "<div style='font-size:12.5px;color:var(--muted);margin-top:6px'>建议选 2 个详写 + 1 个略写，面面俱到反而写不清。</div>";
  var form=document.getElementById("tg-form");
  form.innerHTML=tgState.sel.length?"<div style='font-weight:900;font-size:14px;margin-top:12px'>② 每个方面写一句想象要点，并标出详略</div>"+
    tgState.sel.map(function(k){
      var a=TG_ASPECTS.find(function(x){return x[0]===k;});
      var d=tgState.detail[k];
      return "<div class='tg-row'><div class='tg-head'><b>"+a[1]+"</b>"+
        "<button class='srcbtn' onclick='tgToggleDetail(\""+k+"\")'>"+(d?"⭐ 详写（点击改为略写）":"略写（点击改为详写）")+"</button></div>"+
        "<textarea placeholder='"+a[2]+"…' oninput='tgSetPoint(\""+k+"\",this.value)'>"+(tgState.rows[k]||"")+"</textarea></div>";
    }).join(""):"<p style='font-size:13px;color:var(--muted);margin:10px 0 0'>↑ 先在上面勾选方面，这里会出现要点填写框。</p>";
}
function tgToggle(k){
  var i=tgState.sel.indexOf(k);
  if(i>=0){ tgState.sel.splice(i,1); delete tgState.detail[k]; }
  else if(tgState.sel.length<3){ tgState.sel.push(k); }
  else{ tgState.sel.push(tgState.sel.shift()); tgState.sel[2]=k; }
  tgRender(); tgSave();
}
function tgToggleDetail(k){
  tgState.detail[k]=!tgState.detail[k];
  tgRender(); tgSave();
}
function tgSetPoint(k,v){
  tgState.rows[k]=v;
  tgSave();
}
function tgSave(){
  try{localStorage.setItem("inkclass_tigang",JSON.stringify(tgState));}catch(e){}
}
function tgInit(){
  try{
    var s=JSON.parse(localStorage.getItem("inkclass_tigang")||"null");
    if(s&&s.sel){ tgState=s; tgState.text=tgState.text||""; }
  }catch(e){}
  tgRender();
  if(tgState.text){ var r=document.getElementById("tg-result"); if(r&&!r.innerHTML) r.innerHTML=tgState.text; }
}
function resetTigang(){
  tgState={sel:[],rows:{},detail:{},text:""};
  tgSave(); tgRender();
  var r=document.getElementById("tg-result"); if(r) r.innerHTML="";
}
function genTigang(){
  var r=document.getElementById("tg-result");
  if(!r) return;
  if(tgState.sel.length<2){ r.innerHTML="<div class='tg-out'><b>⚠️ 至少选择 2 个方面才能生成提纲</b>——面面俱到等于什么都没写清。</div>"; tgState.text=""; tgSave(); return; }
  var hasDetail=tgState.sel.some(function(k){return tgState.detail[k];});
  var mid=tgState.sel.map(function(k,i){
    var a=TG_ASPECTS.find(function(x){return x[0]===k;});
    var d=tgState.detail[k]?"⭐ 详写":"略写";
    var pt=(tgState.rows[k]||"（这里填一句你的想象要点）");
    return "<div class='tg-line'><span class='tg-tag'>第"+(i+1)+"段 · "+d+"</span><span><b>"+a[1]+"</b>："+pt+"　<span style='color:var(--muted);font-size:12.5px'>（用“现在 vs 二十年后”的对比展开）</span></span></div>";
  }).join("");
  var tip=hasDetail?"":"<div style='margin-top:8px;font-size:13px;color:#C46E08'>💡 建议：至少把一个方面标为详写——详写的段落要有具体画面，略写的可以一笔带过。</div>";
  var html="<div class='tg-out'><h5>🧭 习作提纲：二十年后的家乡</h5>"+
    "<div class='tg-line'><span class='tg-tag'>题目</span><span><b>二十年后的家乡</b></span></div>"+
    "<div class='tg-line'><span class='tg-tag'>开头</span><span>用“回到家乡的第一眼”切入：坐上什么回来的？看到了什么？一句“变化真大”引出下文。</span></div>"+
    mid+
    "<div class='tg-line'><span class='tg-tag'>结尾</span><span>回到“人”与情感：变化的是家乡的样子，不变的是热爱——用一句抒情的话点题收束。</span></div>"+
    tip+"</div>";
  r.innerHTML=html;
  tgState.text=html; tgSave();
}
function copyTigang(){
  var r=document.getElementById("tg-result");
  if(!r||!tgState.text){ return; }
  var plain=r.innerText.replace(/\n{3,}/g,"\n\n").trim();
  function done(){ var b=event&&event.target; if(b){ var t=b.textContent; b.textContent="已复制 ✓"; setTimeout(function(){b.textContent=t;},1500); } }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(plain).then(done,function(){fallbackCopy(plain);done();});
  }else{ fallbackCopy(plain); done(); }
}
function fallbackCopy(s){
  var ta=document.createElement("textarea");
  ta.value=s; document.body.appendChild(ta); ta.select();
  try{document.execCommand("copy");}catch(e){}
  document.body.removeChild(ta);
}

var QUIZ_MAP={ymbyh:QUIZ_YMBYH,gushisan:QUIZ_GUSHISAN,snzgs:QUIZ_SNZGS,mlf:QUIZ_MLF,guihuayu:QUIZ_GUIHUAYU,luohuasheng:QUIZ_LUOHUASHENG,zhenzhuniao:QUIZ_ZHENZHNIAO,yuan1Di:QUIZ_YUAN1DI,yuanDi:QUIZ_YUANDI};
var quizState={};
function quizBank(){
  var key=currentLesson&&currentLesson.key;
  return (key&&QUIZ_MAP[key])||QUIZ_YMBYH;
}
function buildQuiz(){
  var box=document.getElementById("quizBox");
  if(!box||box.dataset.built) return;
  var Q=quizBank();
  var html=Q.map(function(item,qi){
    return "<div class='quizq' data-q='"+qi+"'><h4>"+item.q+"</h4>"+
      item.opts.map(function(o,oi){return "<button class='opt' onclick='pickOpt(this,"+qi+","+oi+")'>"+o+"</button>";}).join("")+"</div>";
  }).join("");
  html+="<div style='text-align:center;margin-top:14px'><button class='tflow' style='display:inline-block;min-width:200px' onclick='submitQuiz()'>✅ 交卷</button><div id='quizResult' style='margin-top:10px;font-weight:700'></div></div>";
  box.innerHTML=html;
  box.dataset.built="1";
  quizState={};
}
function pickOpt(btn,qi,oi){
  var qbox=btn.closest(".quizq");
  qbox.querySelectorAll(".opt").forEach(function(b){b.classList.remove("sel");});
  btn.classList.add("sel");
  quizState[qi]=oi;
}
function submitQuiz(){
  var res=document.getElementById("quizResult"); if(!res) return;
  var key=(currentLesson&&currentLesson.key)||"ymbyh";
  var Q=quizBank();
  var right=0,total=Q.length,answered=0;
  Q.forEach(function(item,qi){
    var sel=quizState[qi];
    if(sel===undefined) return;
    answered++;
    var qbox=document.querySelector(".quizq[data-q='"+qi+"']");
    qbox.querySelectorAll(".opt").forEach(function(b,bi){
      if(bi===item.a) b.classList.add("ok");
      else if(bi===sel) b.classList.add("bad");
    });
    if(sel===item.a) right++;
  });
  if(answered<total){
    res.innerHTML="⚠️ 还有 "+(total-answered)+" 题没有作答";
    res.style.color="#C46E08"; return;
  }
  var msg= right===total?"🏆 满分过关！": right>=3?"👍 过关！错题回讲解里再看看":"💪 先回「知识讲解」读一遍，再回来挑战";
  res.innerHTML=msg+"　得分："+right+" / "+total;
  res.style.color= right>=3?"#3C9E5C":"#C0392B";
  try{
    var p=JSON.parse(localStorage.getItem("inkclass_progress")||"{}");
    p[key]={score:right,total:total,time:new Date().toLocaleDateString("zh-CN")};
    localStorage.setItem("inkclass_progress",JSON.stringify(p));
  }catch(e){}
}

/* ===================== 视频·横屏播放 ===================== */
var LAND={el:null};
function landBtn(f){
  if(f.querySelector('.landbtn'))return;
  var b=document.createElement('div');b.className='landbtn';b.textContent='✕ 退出横屏';f.appendChild(b);
}
function landCleanup(){
  var f=LAND.el;LAND.el=null;
  document.documentElement.classList.remove('land-lock');
  if(f)f.classList.remove('force-land','fs-land');
}
function landExit(){
  var f=LAND.el;if(!f)return;
  if(document.fullscreenElement||document.webkitFullscreenElement){
    var x=document.exitFullscreen||document.webkitExitFullscreen;if(x)x.call(document);
  }
  try{if(window.screen&&screen.orientation&&screen.orientation.unlock)screen.orientation.unlock();}catch(e){}
  landCleanup();
}
function landFallback(f){
  document.documentElement.classList.add('land-lock');
  f.classList.add('force-land');landBtn(f);
}
function landEnter(f){
  if(!f)return;
  if(LAND.el===f)return;
  if(LAND.el)landExit();
  LAND.el=f;
  var rf=f.requestFullscreen||f.webkitRequestFullscreen;
  var lock=window.screen&&screen.orientation&&screen.orientation.lock;
  if(rf&&lock){
    try{
      var p=f.requestFullscreen();
      if(p&&p.then){
        document.documentElement.classList.add('land-lock');
        p.then(function(){return screen.orientation.lock('landscape');})
         .then(function(){f.classList.add('fs-land');landBtn(f);})
         .catch(function(){
           if(document.fullscreenElement||document.webkitFullscreenElement){
             var x=document.exitFullscreen||document.webkitExitFullscreen;if(x)x.call(document);
           }
           document.documentElement.classList.remove('land-lock');
           landFallback(f);  /* 保留 LAND.el，退出按钮才有效 */
         });
        return;
      }
    }catch(e){}
  }
  landFallback(f);
}
document.addEventListener('click',function(e){
  var t=e.target;
  if(t.classList&&t.classList.contains('landbtn')){e.preventDefault();landExit();return;}
  var a=t.closest?t.closest('.landlink'):null;
  if(!a)return;
  e.preventDefault();
  var card=a.closest('.card'),f=card&&card.querySelector('.bili-frame');
  if(f)landEnter(f);
});
document.addEventListener('fullscreenchange',function(){
  if(!document.fullscreenElement&&LAND.el&&LAND.el.classList.contains('fs-land')){
    document.documentElement.classList.remove('land-lock');
    LAND.el.classList.remove('fs-land');LAND.el=null;
  }
});
